<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L.A.R.A. Design System and Component Library</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link rel="stylesheet" href="assets/phosphor/phosphor.css">

  <style>
    :root {
      /* Brand */
      --color-primary-green: #2E9B4B;
      --color-dark-green: #176B36;
      --color-light-green: #E4F6E8;

      /* Socratic AI tutor (tutor surfaces only) */
      --color-primary-purple: #5145E5;
      --color-dark-purple: #4035C9;
      --color-light-purple: #EEEAFE;
      --color-ai-border: #D6CCFC;
      --color-ai-bubble-text: #2D237A;
      --color-ai-chat-bg: #FAF9FE;

      /* Surfaces */
      --color-canvas-bg: #F7FBFA;
      --color-surface-white: #FFFFFF;
      --color-surface-subtle: #F2F6F5;
      --color-border: #E4EAF0;

      /* Text */
      --color-text-primary: #17213D;
      --color-text-secondary: #667085;
      --color-text-muted: #98A2B3;

      /* Status */
      --color-status-success: #22A447;
      --color-status-warning: #F5B82E;
      --color-status-danger: #EF5350;
      --color-status-info: #3B82F6;
      --color-success-border: #C4ECCB;
      --color-warning-light: #FEF0C7;
      --color-warning-dark: #B54708;
      --color-warning-border: #FEDF89;
      --color-danger-light: #FEE4E2;
      --color-danger-dark: #B42318;
      --color-danger-border: #FECDCA;
      --color-info-light: #E0F2FE;
      --color-info-dark: #0369A1;
      --color-info-border: #BAE6FD;

      --font-sans: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;

      /* Radii */
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --radius-pill: 9999px;

      --min-touch-target: 52px;
      --control-height-desktop: 40px;

      /* Layered shadows tinted with navy */
      --shadow-card: 0 1px 3px 0 rgba(23, 33, 61, 0.05), 0 1px 2px -1px rgba(23, 33, 61, 0.05);
      --shadow-card-hover: 0 4px 6px -1px rgba(23, 33, 61, 0.07), 0 2px 4px -2px rgba(23, 33, 61, 0.05);
      --shadow-elevated: 0 10px 15px -3px rgba(23, 33, 61, 0.08), 0 4px 6px -4px rgba(23, 33, 61, 0.04);
      --shadow-toast: 0 12px 28px -4px rgba(23, 33, 61, 0.12), 0 4px 8px -2px rgba(23, 33, 61, 0.06);
      --shadow-modal: 0 24px 48px -12px rgba(23, 33, 61, 0.22), 0 8px 16px -4px rgba(23, 33, 61, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    [hidden] { display: none !important; }

    body {
      font-family: var(--font-sans);
      background-color: var(--color-surface-white);
      color: var(--color-text-primary);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button { font-family: inherit; }
    a { color: inherit; }
    :focus-visible { outline: 3px solid var(--color-dark-green); outline-offset: 2px; }

    .skip-link {
      position: absolute; left: 12px; top: -64px; z-index: 100; padding: 12px 18px; border-radius: var(--radius-md);
      background: var(--color-dark-green); color: #fff; font-weight: 800; text-decoration: none;
    }
    .skip-link:focus { top: 8px; outline-color: var(--color-text-primary); }

    /* ---------- Top bar ---------- */
    .doc-navbar {
      height: 60px; border-bottom: 1px solid var(--color-border); background: var(--color-surface-white);
      position: sticky; top: 0; z-index: 50; display: flex; align-items: center;
      justify-content: space-between; padding: 0 24px; gap: 12px;
    }
    .doc-nav-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .doc-brand-badge {
      background: var(--color-primary-green); color: #fff; font-weight: 900; font-size: 14px;
      padding: 4px 10px; border-radius: var(--radius-sm); letter-spacing: 0.5px; white-space: nowrap;
    }
    .doc-brand-title { font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .doc-nav-right { display: flex; align-items: center; gap: 12px; }
    .doc-status-pill {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: var(--radius-pill);
      background: var(--color-light-green); color: var(--color-dark-green); font-size: 12px; font-weight: 800;
    }
    .doc-version { font-size: 12px; font-weight: 800; color: var(--color-text-secondary); }
    .ds-menu-btn {
      display: none; width: 44px; height: 44px; border-radius: var(--radius-md); border: 2px solid var(--color-border);
      background: #fff; color: var(--color-text-primary); font-size: 22px; cursor: pointer; align-items: center; justify-content: center;
    }

    /* ---------- Page frame ---------- */
    .doc-layout { display: grid; grid-template-columns: 276px minmax(0, 1fr); min-height: calc(100vh - 60px); }
    .ds-sidebar {
      border-right: 1px solid var(--color-border); background: var(--color-surface-white);
      position: sticky; top: 60px; height: calc(100vh - 60px); overflow-y: auto; padding: 16px 14px 40px;
      overscroll-behavior: contain;
    }
    .ds-search { position: relative; margin-bottom: 10px; }
    .ds-search > i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--color-text-secondary); font-size: 18px; pointer-events: none; }
    .ds-search input {
      width: 100%; height: 44px; border-radius: var(--radius-md); border: 2px solid var(--color-border); background: #fff;
      padding: 0 40px 0 38px; font-family: inherit; font-size: 14px; font-weight: 600; color: var(--color-text-primary);
    }
    .ds-search input::placeholder { color: var(--color-text-muted); }
    .ds-search input:focus { outline: none; border-color: var(--color-primary-green); }
    .ds-search kbd {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%); min-width: 22px; height: 22px; padding: 0 6px;
      border-radius: 6px; border: 1px solid var(--color-border); background: var(--color-surface-subtle);
      font: 800 12px/20px var(--font-sans); color: var(--color-text-secondary); text-align: center; pointer-events: none;
    }
    .ds-search input:not(:placeholder-shown) ~ kbd { display: none; }
    .ds-group-title {
      display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 800;
      color: var(--color-text-secondary); margin: 20px 0 6px; padding: 0 12px;
    }
    .ds-group-title span { font-size: 12px; font-weight: 800; color: var(--color-text-secondary); background: var(--color-surface-subtle); border-radius: var(--radius-pill); padding: 0 8px; }
    .ds-nav-link {
      display: flex; align-items: center; gap: 10px; width: 100%; min-height: 40px; padding: 7px 12px; border-radius: var(--radius-md);
      font-size: 14px; font-weight: 700; color: var(--color-text-secondary); background: transparent; border: none;
      text-align: left; text-decoration: none; cursor: pointer; transition: background 0.15s, color 0.15s;
    }
    .ds-nav-link:hover { background: var(--color-surface-subtle); color: var(--color-dark-green); }
    .ds-nav-link.active { background: var(--color-light-green); color: var(--color-dark-green); font-weight: 800; }
    .ds-nav-link i { font-size: 18px; flex-shrink: 0; }
    .ds-nav-link .ds-nav-label { flex: 1; min-width: 0; }
    .ds-tag {
      flex-shrink: 0; font-size: 11px; font-weight: 800; padding: 1px 8px; border-radius: var(--radius-pill);
      background: var(--color-light-green); color: var(--color-dark-green); border: 1px solid var(--color-success-border);
    }
    .ds-tag.mobile { background: var(--color-info-light); color: var(--color-info-dark); border-color: var(--color-info-border); }
    .ds-no-results { display: none; padding: 28px 12px; text-align: center; color: var(--color-text-secondary); font-size: 14px; font-weight: 700; }
    .ds-no-results i { display: block; font-size: 32px; margin-bottom: 8px; }
    .ds-no-results.show { display: block; }
    .ds-scrim { display: none; }

    .ds-main { padding: 36px 48px 40px; max-width: 960px; margin: 0 auto; width: 100%; min-width: 0; }
    .ds-crumbs { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--color-text-secondary); margin-bottom: 18px; flex-wrap: wrap; }
    .ds-crumbs a { text-decoration: none; }
    .ds-crumbs a:hover { color: var(--color-dark-green); text-decoration: underline; }
    .ds-crumbs i { font-size: 12px; }
    .ds-title-row { display: flex; align-items: center; gap: 16px; margin-bottom: 10px; }
    .ds-title-icon {
      width: 52px; height: 52px; border-radius: var(--radius-md); background: var(--color-light-green); color: var(--color-dark-green);
      display: flex; align-items: center; justify-content: center; font-size: 28px; flex-shrink: 0;
    }
    .ds-title-icon.ai { background: var(--color-light-purple); color: var(--color-dark-purple); }
    .ds-title { font-size: 34px; line-height: 1.15; font-weight: 900; letter-spacing: -0.3px; }
    .ds-lede { font-size: 17px; line-height: 1.6; color: var(--color-text-secondary); font-weight: 600; max-width: 68ch; }
    .ds-head-actions { display: flex; gap: 8px; margin: 18px 0 26px; flex-wrap: wrap; }
    .ds-chip-btn {
      display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: var(--radius-pill);
      border: 2px solid var(--color-border); background: #fff; color: var(--color-text-secondary); font-size: 13px; font-weight: 800; cursor: pointer;
    }
    .ds-chip-btn:hover { border-color: var(--color-primary-green); color: var(--color-dark-green); }
    .ds-chip-btn i { font-size: 16px; }

    .ds-h2 { font-size: 22px; font-weight: 900; margin: 44px 0 14px; scroll-margin-top: 84px; display: flex; align-items: center; gap: 10px; }
    .ds-h2 i { font-size: 24px; color: var(--color-primary-green); }

    /* ---------- Tabs ---------- */
    .ds-tabs { display: flex; gap: 4px; padding: 4px; margin-bottom: 14px; border-radius: var(--radius-md); background: var(--color-surface-subtle); border: 1px solid var(--color-border); width: fit-content; max-width: 100%; overflow-x: auto; }
    .ds-tab {
      display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 16px; border-radius: 9px; border: none; background: transparent;
      font-size: 14px; font-weight: 800; color: var(--color-text-secondary); cursor: pointer; white-space: nowrap;
    }
    .ds-tab:hover { color: var(--color-text-primary); }
    .ds-tab[aria-selected="true"] { background: #fff; color: var(--color-dark-green); box-shadow: var(--shadow-card); }
    .ds-tab i { font-size: 18px; }

    /* ---------- Preview stage ---------- */
    .preview-card {
      border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 32px 28px;
      background: var(--color-canvas-bg); display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 220px; box-shadow: var(--shadow-card); position: relative; overflow-x: auto; overflow-y: hidden;
    }
    .preview-card.full-width { align-items: stretch; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; align-items: center; }
    .stack { display: flex; flex-direction: column; gap: 14px; width: 100%; }
    .label-xs { font-size: 12px; font-weight: 800; letter-spacing: 0.2px; color: var(--color-text-secondary); margin-bottom: 8px; }

    /* ---------- Code ---------- */
    .code-wrapper { border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--color-text-primary); background: var(--color-text-primary); box-shadow: var(--shadow-elevated); }
    .code-wrapper :focus-visible { outline-color: var(--color-light-green); }
    .code-header {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 10px 8px 18px; background: rgba(255,255,255,0.06);
      color: var(--color-border); font-size: 13px; font-weight: 800; border-bottom: 1px solid rgba(255,255,255,0.12);
    }
    .code-header .lang { display: inline-flex; align-items: center; gap: 8px; }
    .code-header .lang small { color: var(--color-text-muted); font-weight: 700; font-size: 12px; }
    .copy-btn {
      display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 14px; border-radius: var(--radius-sm);
      background: rgba(255,255,255,0.1); color: #fff; font-size: 13px; font-weight: 800;
      border: 1px solid rgba(255,255,255,0.2); cursor: pointer; transition: background 0.15s;
    }
    .copy-btn:hover { background: rgba(255,255,255,0.2); }
    .copy-btn.done { background: var(--color-light-green); color: var(--color-dark-green); border-color: var(--color-light-green); }
    .code-block {
      margin: 0; padding: 18px 22px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px; color: var(--color-surface-subtle); overflow: auto; line-height: 1.7; max-height: 560px; tab-size: 2;
      scrollbar-color: var(--color-text-secondary) transparent;
    }
    .tk-c { color: var(--color-text-muted); font-style: italic; }
    .tk-s { color: var(--color-success-border); }
    .tk-k { color: var(--color-info-border); font-weight: 700; }
    .tk-n { color: var(--color-status-warning); }
    .tk-t { color: #fff; font-weight: 700; }
    .tk-a { color: var(--color-warning-border); }

    /* ---------- Guidelines ---------- */
    .ds-rules { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .ds-rule-card { border: 1px solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden; background: #fff; box-shadow: var(--shadow-card); }
    .ds-rule-card header { display: flex; align-items: center; gap: 8px; padding: 12px 16px; font-size: 15px; font-weight: 900; }
    .ds-rule-card header i { font-size: 20px; }
    .ds-rule-card.do header { background: var(--color-light-green); color: var(--color-dark-green); }
    .ds-rule-card.dont header { background: var(--color-danger-light); color: var(--color-danger-dark); }
    .ds-rule-card.a11y header { background: var(--color-info-light); color: var(--color-info-dark); }
    .ds-rule-card ul { list-style: none; }
    .ds-rule-card li { display: flex; gap: 10px; align-items: flex-start; padding: 12px 16px; font-size: 14px; line-height: 1.55; font-weight: 600; color: var(--color-text-primary); border-top: 1px solid var(--color-border); }
    .ds-rule-card li:first-child { border-top: none; }
    .ds-rule-card li i { font-size: 18px; margin-top: 2px; flex-shrink: 0; }
    .ds-rule-card.do li i { color: var(--color-dark-green); }
    .ds-rule-card.dont li i { color: var(--color-danger-dark); }
    .ds-rule-card.a11y li i { color: var(--color-info-dark); }
    .ds-rule-card.a11y { margin-top: 0; }

    /* ---------- Previous / next ---------- */
    .ds-pager { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 56px; padding-top: 24px; border-top: 1px solid var(--color-border); }
    .ds-pager a {
      display: flex; align-items: center; gap: 14px; min-height: 72px; padding: 12px 18px; border: 2px solid var(--color-border); border-radius: var(--radius-lg);
      text-decoration: none; background: #fff; transition: border-color 0.15s;
    }
    .ds-pager a:hover { border-color: var(--color-primary-green); }
    .ds-pager a.next { justify-content: flex-end; text-align: right; grid-column: 2; }
    .ds-pager small { display: block; font-size: 12px; font-weight: 800; color: var(--color-text-secondary); }
    .ds-pager strong { font-size: 16px; font-weight: 900; }
    .ds-pager i { font-size: 22px; color: var(--color-primary-green); }


    /* ---------- Overview ---------- */
    .ov-hero {
      background: var(--color-dark-green); color: #fff; border-radius: var(--radius-xl); padding: 44px 44px 44px;
      display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 32px; align-items: center; box-shadow: var(--shadow-elevated);
    }
    .ov-hero :focus-visible { outline-color: #fff; }
    .ov-hero h1 { font-size: 38px; line-height: 1.12; font-weight: 900; letter-spacing: -0.5px; text-wrap: balance; }
    .ov-hero p { font-size: 17px; line-height: 1.6; font-weight: 600; margin-top: 16px; color: var(--color-light-green); max-width: 46ch; }
    .ov-hero .cta { display: flex; gap: 12px; margin-top: 28px; flex-wrap: wrap; }
    .ov-hero .btn-light { background: #fff; color: var(--color-dark-green); text-decoration: none; }
    .ov-hero .btn-light:hover { background: var(--color-light-green); }
    .ov-hero .btn-line { background: transparent; color: #fff; border-color: rgba(255,255,255,0.5); text-decoration: none; box-shadow: none; }
    .ov-hero .btn-line:hover { background: rgba(255,255,255,0.12); border-color: #fff; }
    .ov-demo { display: flex; flex-direction: column; gap: 12px; min-width: 0; color: var(--color-text-primary); }
    .ov-demo .card { overflow: hidden; }
    .ov-bubble { display: flex; gap: 10px; align-items: flex-start; padding: 14px 16px; background: var(--color-ai-chat-bg); border: 1px solid var(--color-ai-border); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); }
    .ov-bubble .bot { width: 34px; height: 34px; border-radius: 50%; background: var(--color-primary-purple); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .ov-bubble p { margin: 0; font-size: 14px; line-height: 1.5; font-weight: 700; color: var(--color-ai-bubble-text); max-width: none; }
    .ov-section-title { font-size: 26px; font-weight: 900; margin: 56px 0 6px; scroll-margin-top: 84px; }
    .ov-section-sub { font-size: 15px; font-weight: 600; color: var(--color-text-secondary); margin-bottom: 20px; max-width: 62ch; }
    .ov-principles { list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 32px; }
    .ov-principles li { display: flex; gap: 14px; padding: 16px 0; border-top: 1px solid var(--color-border); }
    .ov-principles .ico { width: 40px; height: 40px; border-radius: var(--radius-md); background: var(--color-light-green); color: var(--color-dark-green); display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
    .ov-principles .ico.ai { background: var(--color-light-purple); color: var(--color-dark-purple); }
    .ov-principles strong { display: block; font-size: 15px; font-weight: 900; }
    .ov-principles span { font-size: 14px; font-weight: 600; color: var(--color-text-secondary); line-height: 1.5; }
    .ov-areas { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 24px 32px; }
    .ov-area h3 { display: flex; justify-content: space-between; align-items: baseline; font-size: 17px; font-weight: 900; padding-bottom: 8px; border-bottom: 2px solid var(--color-text-primary); margin-bottom: 4px; }
    .ov-area h3 small { font-size: 13px; font-weight: 800; color: var(--color-text-secondary); }
    .ov-area a { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 6px 4px; border-bottom: 1px solid var(--color-border); text-decoration: none; font-size: 14px; font-weight: 700; color: var(--color-text-primary); }
    .ov-area a:hover { color: var(--color-dark-green); background: var(--color-canvas-bg); }
    .ov-area a i { font-size: 20px; color: var(--color-primary-green); }
    .ov-area a .ds-tag { margin-left: auto; }
    .ov-compare th, .ov-compare td { white-space: normal; vertical-align: top; line-height: 1.5; font-size: 14px; font-weight: 600; }
    .ov-compare tbody th { font-weight: 900; white-space: nowrap; background: transparent; border-bottom: 1px solid var(--color-border); }
    .ov-compare td:nth-child(2) { color: var(--color-text-secondary); }
    .ov-sync { list-style: none; counter-reset: sync; display: grid; gap: 0; }
    .ov-sync li { counter-increment: sync; display: flex; gap: 16px; padding: 14px 0; border-top: 1px solid var(--color-border); font-size: 15px; font-weight: 600; color: var(--color-text-secondary); align-items: flex-start; }
    .ov-sync li::before { content: counter(sync); width: 30px; height: 30px; border-radius: 50%; background: var(--color-text-primary); color: #fff; font-weight: 900; font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .ov-sync code, .ds-lede code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; background: var(--color-surface-subtle); border: 1px solid var(--color-border); padding: 1px 6px; border-radius: 6px; color: var(--color-text-primary); }
    .ov-sync strong { color: var(--color-text-primary); font-weight: 800; }

    /* ==========================================================
       COMPONENT PRIMITIVES
       ========================================================== */
    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--min-touch-target);
      padding: 12px 22px; border-radius: var(--radius-md); font-size: 15px; font-weight: 800; cursor: pointer;
      border: 2px solid transparent; user-select: none; box-shadow: var(--shadow-card); transition: all 0.15s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn i { font-size: 20px; }
    .btn-pill { border-radius: var(--radius-pill); }
    .btn-sm { min-height: 40px; padding: 6px 16px; font-size: 14px; }
    .btn-icon { width: var(--min-touch-target); padding: 0; }
    .btn-icon.btn-sm { width: 40px; }
    .btn-block { width: 100%; }
    .btn-primary { background: var(--color-primary-green); color: #fff; }
    .btn-primary:hover { background: var(--color-dark-green); box-shadow: var(--shadow-card-hover); }
    .btn-ai { background: var(--color-primary-purple); color: #fff; }
    .btn-ai:hover { background: var(--color-dark-purple); box-shadow: var(--shadow-card-hover); }
    .btn-secondary { background: var(--color-surface-white); color: var(--color-text-primary); border-color: var(--color-border); }
    .btn-secondary:hover { background: var(--color-canvas-bg); border-color: var(--color-text-secondary); }
    .btn-ghost { background: transparent; color: var(--color-dark-green); box-shadow: none; }
    .btn-ghost:hover { background: var(--color-light-green); }
    .btn-danger { background: var(--color-danger-light); color: var(--color-status-danger); border-color: var(--color-danger-border); }
    .btn-danger:hover { background: var(--color-danger-border); }
    .btn:disabled { background: var(--color-border); color: var(--color-text-muted); cursor: not-allowed; box-shadow: none; border-color: transparent; }
    .btn.loading { pointer-events: none; opacity: 0.9; }
    .spin { animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toast */
    .toast-container { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 420px; }
    .toast {
      display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; border-radius: var(--radius-lg);
      background: #fff; border: 1px solid var(--color-border); box-shadow: var(--shadow-toast); animation: slide-in 0.2s ease-out;
    }
    @keyframes slide-in { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .toast-icon-wrap { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 16px; }
    .toast-success .toast-icon-wrap { background: var(--color-light-green); color: var(--color-dark-green); }
    .toast-warning .toast-icon-wrap { background: var(--color-warning-light); color: var(--color-warning-dark); }
    .toast-danger .toast-icon-wrap { background: var(--color-danger-light); color: var(--color-status-danger); }
    .toast-ai .toast-icon-wrap { background: var(--color-light-purple); color: var(--color-dark-purple); }
    .toast-body { flex: 1; }
    .toast-title { font-size: 14px; font-weight: 800; }
    .toast-desc { font-size: 12px; color: var(--color-text-secondary); margin-top: 2px; }
    .toast-close { background: transparent; border: none; color: var(--color-text-muted); cursor: pointer; font-size: 16px; padding: 2px; }
    #live-toast-anchor { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 10px; z-index: 9999; }

    /* Badges */
    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: var(--radius-pill); font-size: 12px; font-weight: 800; letter-spacing: 0.3px; }
    .badge i { font-size: 15px; }
    .badge-synced { background: var(--color-light-green); color: var(--color-dark-green); border: 1px solid var(--color-success-border); }
    .badge-queued { background: var(--color-warning-light); color: var(--color-warning-dark); border: 1px solid var(--color-warning-border); }
    .badge-info { background: var(--color-info-light); color: var(--color-info-dark); border: 1px solid var(--color-info-border); }
    .badge-ai { background: var(--color-light-purple); color: var(--color-dark-purple); border: 1px solid var(--color-ai-border); }
    .badge-danger { background: var(--color-danger-light); color: var(--color-danger-dark); border: 1px solid var(--color-danger-border); }
    .badge-neutral { background: var(--color-surface-subtle); color: var(--color-text-secondary); border: 1px solid var(--color-border); }
    .count-dot { min-width: 20px; height: 20px; padding: 0 6px; border-radius: var(--radius-pill); background: var(--color-status-danger); color: #fff; font-size: 11px; font-weight: 900; display: inline-flex; align-items: center; justify-content: center; }
    .radar-pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: var(--radius-pill); background: #fff; border: 1px solid var(--color-border); font-size: 13px; font-weight: 800; box-shadow: var(--shadow-card); }
    .radar-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--color-status-success); }
    .radar-dot.off { background: var(--color-text-muted); }
    .radar-dot.warn { background: var(--color-status-warning); }

    /* Alert banner */
    .alert-banner { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-radius: var(--radius-md); font-size: 14px; font-weight: 700; box-shadow: var(--shadow-card); width: 100%; }
    .alert-banner i { font-size: 22px; flex-shrink: 0; }
    .alert-banner-warning { background: var(--color-warning-light); color: #93370D; border: 1px solid var(--color-warning-border); }
    .alert-banner-warning i { color: var(--color-warning-dark); }
    .alert-banner-success { background: var(--color-light-green); color: var(--color-dark-green); border: 1px solid var(--color-success-border); }
    .alert-banner-danger { background: var(--color-danger-light); color: var(--color-danger-dark); border: 1px solid var(--color-danger-border); }
    .alert-banner-info { background: var(--color-info-light); color: var(--color-info-dark); border: 1px solid var(--color-info-border); }

    /* Inputs */
    .form-group { width: 100%; margin-bottom: 16px; }
    .form-label { display: block; font-size: 13px; font-weight: 800; margin-bottom: 6px; }
    .form-hint { font-size: 12px; font-weight: 600; color: var(--color-text-secondary); margin-top: 6px; }
    .form-error { font-size: 12px; font-weight: 700; color: var(--color-danger-dark); margin-top: 6px; display: flex; gap: 6px; align-items: center; }
    .form-input {
      width: 100%; min-height: var(--min-touch-target); padding: 12px 14px; border-radius: var(--radius-md);
      border: 2px solid var(--color-border); background: #fff; font-family: inherit; font-size: 15px; font-weight: 600;
      color: var(--color-text-primary); box-shadow: var(--shadow-card);
    }
    .form-input::placeholder { color: var(--color-text-muted); }
    .form-input:focus { outline: none; border-color: var(--color-primary-green); }
    .form-input.error { border-color: var(--color-status-danger); background: #FFFBFA; }
    .form-input:disabled { background: var(--color-surface-subtle); color: var(--color-text-muted); }
    textarea.form-input { min-height: 110px; resize: vertical; }
    .select-wrap { position: relative; }
    .select-wrap select { appearance: none; -webkit-appearance: none; padding-right: 44px; cursor: pointer; }
    .select-wrap i { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--color-text-secondary); font-size: 18px; }
    .pin-grid { display: flex; gap: 10px; }
    .pin-box {
      width: 52px; height: 60px; border: 2px solid var(--color-border); border-radius: var(--radius-md); text-align: center;
      font-size: 26px; font-weight: 900; background: #fff; color: var(--color-text-primary); box-shadow: var(--shadow-card); font-family: inherit;
    }
    .pin-box:focus { outline: none; border-color: var(--color-primary-green); }
    .search-bar { position: relative; width: 100%; }
    .search-bar i.lead { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 20px; color: var(--color-text-muted); }
    .search-bar input { padding-left: 46px; border-radius: var(--radius-pill); }

    /* Selection controls */
    .sel-row { display: flex; align-items: center; gap: 14px; min-height: 52px; padding: 8px 14px; border: 2px solid var(--color-border); border-radius: var(--radius-md); background: #fff; cursor: pointer; user-select: none; font-size: 15px; font-weight: 700; width: 100%; box-shadow: var(--shadow-card); }
    .sel-row:hover { border-color: var(--color-primary-green); }
    .check { width: 26px; height: 26px; border-radius: 8px; border: 2px solid #CBD5E1; background: #fff; display: flex; align-items: center; justify-content: center; color: transparent; font-size: 16px; flex-shrink: 0; transition: all 0.12s; }
    .check.on { background: var(--color-primary-green); border-color: var(--color-primary-green); color: #fff; }
    .radio { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #CBD5E1; background: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .radio::after { content: ""; width: 12px; height: 12px; border-radius: 50%; background: transparent; }
    .radio.on { border-color: var(--color-primary-green); }
    .radio.on::after { background: var(--color-primary-green); }
    .switch { width: 52px; height: 30px; border-radius: var(--radius-pill); background: #CBD5E1; position: relative; flex-shrink: 0; transition: background 0.15s; margin-left: auto; }
    .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: var(--shadow-card); transition: transform 0.15s; }
    .switch.on { background: var(--color-primary-green); }
    .switch.on::after { transform: translateX(22px); }

    /* Segmented, tabs, chips */
    .segmented { display: inline-flex; padding: 4px; border-radius: var(--radius-md); background: var(--color-surface-subtle); border: 1px solid var(--color-border); gap: 4px; }
    .seg-item { min-height: 44px; padding: 0 18px; border-radius: 9px; font-size: 14px; font-weight: 800; color: var(--color-text-secondary); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; border: none; background: transparent; }
    .seg-item.active { background: #fff; color: var(--color-dark-green); box-shadow: var(--shadow-card); }
    .chip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 16px; border-radius: var(--radius-pill); border: 2px solid var(--color-border); background: #fff; font-size: 14px; font-weight: 800; color: var(--color-text-secondary); cursor: pointer; user-select: none; }
    .chip.selected { background: var(--color-light-green); border-color: var(--color-primary-green); color: var(--color-dark-green); }

    /* Progress */
    .progress { width: 100%; height: 12px; border-radius: var(--radius-pill); background: var(--color-border); overflow: hidden; }
    .progress > span { display: block; height: 100%; border-radius: var(--radius-pill); background: var(--color-primary-green); transition: width 0.3s; }
    .progress.ai > span { background: var(--color-primary-purple); }
    .progress.warn > span { background: var(--color-status-warning); }
    .ring { position: relative; width: 96px; height: 96px; }
    .ring svg { transform: rotate(-90deg); }
    .ring .ring-label { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; font-size: 22px; line-height: 1; }
    .ring .ring-label small { font-size: 10px; font-weight: 800; color: var(--color-text-secondary); margin-top: 3px; }

    /* Skeleton (solid fills with opacity pulse, no gradient shimmer) */
    .skel { background: #E4EAF0; border-radius: 8px; animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }

    /* Empty state */
    .empty { text-align: center; max-width: 340px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .empty-icon { width: 80px; height: 80px; border-radius: 50%; background: var(--color-light-green); color: var(--color-primary-green); display: flex; align-items: center; justify-content: center; font-size: 40px; }
    .empty h4 { font-size: 18px; font-weight: 900; }
    .empty p { font-size: 14px; color: var(--color-text-secondary); font-weight: 600; margin-bottom: 6px; }

    /* Modal */
    .scrim { position: absolute; inset: 0; background: rgba(23, 33, 61, 0.5); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 5; }
    .scrim.open { display: flex; }
    .modal { background: #fff; border-radius: var(--radius-xl); padding: 24px; width: 100%; max-width: 380px; box-shadow: var(--shadow-modal); animation: slide-in 0.2s ease-out; }
    .modal-icon { width: 52px; height: 52px; border-radius: 50%; background: var(--color-warning-light); color: var(--color-warning-dark); font-size: 28px; display: flex; align-items: center; justify-content: center; margin-bottom: 14px; }
    .modal h4 { font-size: 20px; font-weight: 900; margin-bottom: 6px; }
    .modal p { font-size: 14px; color: var(--color-text-secondary); font-weight: 600; margin-bottom: 20px; }
    .modal-actions { display: flex; gap: 10px; }
    .modal-actions .btn { flex: 1; }

    /* Phone frame */
    .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 24px 24px 0 0; padding: 12px 18px 22px; box-shadow: var(--shadow-modal); transform: translateY(105%); transition: transform 0.25s ease; z-index: 6; }
    .sheet.open { transform: translateY(0); }
    .sheet-handle { width: 40px; height: 5px; border-radius: 3px; background: #CBD5E1; margin: 0 auto 14px; }
    .sheet-scrim { position: absolute; inset: 0; background: rgba(23,33,61,0.45); display: none; z-index: 5; }
    .sheet-scrim.open { display: block; }

    /* Side nav (desktop) */
    .side-nav { width: 100%; max-width: 260px; background: #fff; border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 12px; box-shadow: var(--shadow-card); }
    .side-nav .brand { display: flex; align-items: center; gap: 10px; padding: 8px 10px 14px; font-weight: 900; font-size: 15px; }

    /* Avatar */
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--color-light-green); color: var(--color-dark-green); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 15px; flex-shrink: 0; position: relative; }
    .avatar.sm { width: 32px; height: 32px; font-size: 12px; }
    .avatar.lg { width: 56px; height: 56px; font-size: 20px; }
    .avatar.blue { background: var(--color-info-light); color: var(--color-info-dark); }
    .avatar.purple { background: var(--color-light-purple); color: var(--color-dark-purple); }
    .avatar.amber { background: var(--color-warning-light); color: var(--color-warning-dark); }
    .avatar .status { position: absolute; right: -1px; bottom: -1px; width: 12px; height: 12px; border-radius: 50%; background: var(--color-status-success); border: 2px solid #fff; }
    .avatar-group { display: flex; }
    .avatar-group .avatar { border: 2px solid #fff; margin-left: -10px; }
    .avatar-group .avatar:first-child { margin-left: 0; }

    /* Cards, stat, list */
    .card { background: #fff; border: 1px solid var(--color-border); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); width: 100%; }
    .card-pad { padding: 20px; }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; width: 100%; }
    .stat { padding: 16px; display: flex; flex-direction: column; gap: 6px; }
    .stat-top { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 800; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.4px; }
    .stat-ico { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .stat-val { font-size: 30px; font-weight: 900; line-height: 1.1; }
    .stat-delta { font-size: 12px; font-weight: 800; }
    .up { color: var(--color-dark-green); }
    .down { color: var(--color-danger-dark); }
    .list-item { display: flex; align-items: center; gap: 14px; padding: 14px 16px; min-height: 64px; border-bottom: 1px solid var(--color-border); background: #fff; cursor: pointer; }
    .list-item:last-child { border-bottom: none; }
    .list-item:hover { background: var(--color-canvas-bg); }
    .list-ico { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
    .list-main { flex: 1; min-width: 0; }
    .list-main h4 { font-size: 15px; font-weight: 800; }
    .list-main p { font-size: 12px; color: var(--color-text-secondary); font-weight: 600; }
    .list-end { color: var(--color-text-muted); font-size: 18px; }

    /* Table */
    .tbl { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
    .tbl th { padding: 12px 14px; font-weight: 800; background: var(--color-surface-subtle); border-bottom: 2px solid var(--color-border); white-space: nowrap; }
    .tbl td { padding: 12px 14px; border-bottom: 1px solid var(--color-border); white-space: nowrap; }
    .tbl tr:last-child td { border-bottom: none; }
    .tbl tbody tr:hover { background: var(--color-canvas-bg); }
    .tbl code { font-size: 12px; background: var(--color-surface-subtle); padding: 2px 6px; border-radius: 6px; }
    .tbl .pass { color: var(--color-primary-green); font-weight: 800; }
    .tbl .fail { color: var(--color-danger-dark); font-weight: 800; }
    .scroll-x { overflow-x: auto; }

    /* Classroom */
    .class-head { background: var(--color-dark-green); color: #fff; padding: 20px; display: flex; justify-content: space-between; align-items: flex-start; }
    .class-head h3 { font-size: 20px; font-weight: 900; }
    .class-head p { font-size: 13px; opacity: 0.9; margin-top: 2px; }
    .code-tag { background: rgba(255,255,255,0.2); padding: 4px 8px; border-radius: 8px; font-size: 12px; font-weight: 800; }
    .comment { display: flex; align-items: flex-start; gap: 10px; }
    .comment .bubble { background: var(--color-canvas-bg); border: 1px solid var(--color-border); border-radius: 12px; padding: 8px 12px; font-size: 13px; flex: 1; }
    .due-late { color: var(--color-danger-dark); }
    .att-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--color-border); }
    .att-row:last-child { border-bottom: none; }
    .att-row .name { flex: 1; font-size: 14px; font-weight: 800; }
    .att-btns { display: flex; gap: 6px; }
    .att-btn { width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--color-border); background: #fff; font-weight: 900; font-size: 14px; color: var(--color-text-secondary); cursor: pointer; }
    .att-btn.p.on { background: var(--color-light-green); border-color: var(--color-primary-green); color: var(--color-dark-green); }
    .att-btn.a.on { background: var(--color-danger-light); border-color: var(--color-status-danger); color: var(--color-danger-dark); }
    .att-btn.l.on { background: var(--color-warning-light); border-color: var(--color-status-warning); color: var(--color-warning-dark); }

    /* Quiz */
    .quiz-card-option { display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 12px 18px; border: 2px solid var(--color-border); border-radius: var(--radius-md); background: #fff; margin-bottom: 10px; cursor: pointer; user-select: none; font-size: 16px; font-weight: 700; box-shadow: var(--shadow-card); transition: all 0.15s; width: 100%; }
    .quiz-card-option:hover { border-color: var(--color-primary-green); box-shadow: var(--shadow-card-hover); }
    .quiz-card-option.selected { border-color: var(--color-primary-green); background: var(--color-light-green); }
    .quiz-card-option i { font-size: 22px; color: var(--color-text-muted); }
    .quiz-card-option.selected i { color: var(--color-primary-green); }
    .q-dots { display: flex; gap: 6px; }
    .q-dot { width: 28px; height: 8px; border-radius: 4px; background: var(--color-border); }
    .q-dot.done { background: var(--color-primary-green); }
    .q-dot.now { background: var(--color-primary-purple); }
    .timer-pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 9999px; background: var(--color-warning-light); color: var(--color-warning-dark); font-weight: 900; font-size: 15px; }

    /* Swatches */
    .swatch-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; width: 100%; }
    .swatch { border: 1px solid var(--color-border); border-radius: 12px; overflow: hidden; background: #fff; box-shadow: var(--shadow-card); cursor: pointer; }
    .swatch .chipc { height: 52px; padding: 8px 10px; font-weight: 800; font-size: 11px; display: flex; align-items: flex-end; }
    .swatch .meta { padding: 8px 10px; font-size: 12px; font-weight: 800; }
    .swatch .meta small { display: block; font-size: 11px; color: var(--color-text-secondary); font-weight: 700; font-family: ui-monospace, monospace; }
    .group-title { font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.6px; color: var(--color-text-secondary); margin: 18px 0 10px; width: 100%; }
    .group-title:first-child { margin-top: 0; }
    .type-row { border-bottom: 1px solid var(--color-border); padding-bottom: 14px; width: 100%; }
    .type-row:last-child { border-bottom: none; padding-bottom: 0; }
    .type-meta { font-size: 12px; font-weight: 800; color: var(--color-text-secondary); text-transform: uppercase; }
    .space-row { display: flex; align-items: center; gap: 14px; font-size: 13px; font-weight: 800; margin-bottom: 8px; width: 100%; }
    .space-row .sp { background: var(--color-primary-green); height: 16px; border-radius: 4px; }
    .space-row code { width: 70px; font-size: 12px; color: var(--color-text-secondary); }
    .shadow-demo { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 20px; width: 100%; }
    .shadow-box { height: 90px; border-radius: 16px; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; border: 1px solid var(--color-border); }
    .icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; width: 100%; }
    .icon-cell { background: #fff; border: 1px solid var(--color-border); border-radius: 12px; padding: 14px 6px 10px; text-align: center; font-size: 11px; font-weight: 800; color: var(--color-text-secondary); box-shadow: var(--shadow-card); }
    .icon-cell i { display: block; font-size: 28px; color: var(--color-text-primary); margin-bottom: 6px; }
    .viewfinder { width: 100%; height: 280px; background: var(--color-text-primary); border-radius: 16px; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; }
    .vf-frame { width: 80%; height: 66%; border: 2px dashed var(--color-primary-green); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; color: var(--color-light-green); }
    .vf-bar { position: absolute; bottom: 14px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 28px; }
    .shutter { width: 56px; height: 56px; border-radius: 50%; background: #fff; border: 4px solid var(--color-light-green); }

    /* ==========================================================
       CLASSROOM SCREENS
       Google Classroom's layout, built from L.A.R.A tokens only.
       ========================================================== */
    body.wide .ds-main { max-width: 1240px; }
    body.wide .doc-layout { grid-template-columns: 276px minmax(0, 1fr); }
    @media (max-width: 860px) { body.wide .doc-layout { grid-template-columns: minmax(0, 1fr); } }

    .preview-card.screen { padding: 16px; align-items: stretch; justify-content: flex-start; }
    .cr-switch { display: flex; align-items: center; justify-content: flex-end; gap: 12px; margin-bottom: 12px; font-size: 13px; font-weight: 800; color: var(--color-text-secondary); flex-wrap: wrap; }

  ],
  surface: [
    ['Canvas', '#F7FBFA', 'canvas', 'App background', '#17213D'],
    ['Surface', '#FFFFFF', 'surface', 'Cards, sheets, dialogs', '#17213D'],
    ['Surface Subtle', '#F2F6F5', 'surfaceSubtle', 'Table headers, segmented', '#17213D'],

function luminance(hex) {
  const full = hex.length === 4 ? '#' + hex.slice(1).replace(/./g, '$&$&') : hex;
  const n = parseInt(full.slice(1), 16);
  const [r, g, b] = [16, 8, 0].map(s => ((n >> s) & 255) / 255).map(v => v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}
function contrast(a, b) {
  const [hi, lo] = [luminance(a), luminance(b)].sort((x, y) => y - x);
  return (hi + 0.05) / (lo + 0.05);
}
function contrastBadge(ratio) {
  const r = ratio.toFixed(1) + ':1 ';
  if (ratio >= 7) return '<span class="contrast pass"><i class="ph ph-check-circle"></i>' + r + 'AAA</span>';
  if (ratio >= 4.5) return '<span class="contrast pass"><i class="ph ph-check-circle"></i>' + r + 'AA</span>';
  if (ratio >= 3) return '<span class="contrast large"><i class="ph ph-warning-circle"></i>' + r + 'Large text only</span>';
  return '<span class="contrast fail"><i class="ph ph-x-circle"></i>' + r + 'Fails AA</span>';
}

function swatches() {
  const titles = { brand: 'Brand', surface: 'Surfaces', text: 'Text', status: 'Status' };

      '<div class="meta">' + c[0] + '<small>' + c[1] + '</small>' + contrastBadge(contrast(c[1], c[4])) + '</div></button>').join('') + '</div>'
  ).join('');
}

const RM_DUE = ['Pagsusulit #2 is due Fri, Oct 9', 'Fractions drill is due Mon, Oct 12', '', ''];

}

const RM_TIMES = [['600', '10:00'], ['290', '4:50'], ['100', '1:40']];
const RM_QUIZ = { title: 'Pagsusulit #2: Parts of a Leaf', questions: [
  ['What gives a leaf its green color?', ['Stomata', 'Chlorophyll', 'Phloem', 'Veins']],
  ['Which part lets air move in and out of a leaf?', ['Stomata', 'Petiole', 'Xylem', 'Blade']],

const RM_LEARNERS = [['AS', 'Ana S.'], ['JD', 'Juan D.'], ['MR', 'Mika R.'], ['PC', 'Paolo C.'], ['LM', 'Liza M.'], ['BT', 'Ben T.']];

function rmFmt(s) { return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }

function rmQuizTick(root) {
  if (!root._qEnd) return;
  const left = Math.max(0, Math.round((root._qEnd - Date.now()) / 1000));
  root.querySelectorAll('[data-q-time]').forEach(e => {
    e.textContent = rmFmt(left) + ' left';
    const p = e.closest('.rm-timer'); p.classList.toggle('warn', left <= 300 && left > 120); p.classList.toggle('crit', left <= 120);
  });
  if (left === 0) {
    clearInterval(root._qTimer);
    if (root.dataset.qs === 'run') rmQuizSubmit(root, true);
    if (root.dataset.qt === 'live') rmQuizClose(root);
  }
}

function rmQuizClock(root) {
  if (!root._qEnd || Date.now() >= root._qEnd) root._qEnd = Date.now() + (+root.dataset.time || 600) * 1000;
  clearInterval(root._qTimer); root._qTimer = setInterval(() => rmQuizTick(root), 1000); rmQuizTick(root);
}

function rmQuizRender(root) {
  const i = root._qIdx, qs = RM_QUIZ.questions, q = qs[i], ans = root._qAns, last = i === qs.length - 1;
  root.querySelector('.rm-qbody').innerHTML = '<div class="rm-dots" aria-hidden="true">' + qs.map((_, k) => '<i class="' + (k === i ? 'cur' : ans[k] !== undefined ? 'done' : '') + '"></i>').join('') + '</div>' +

@Composable

            val (bg, border, fg) = when (m) {
                Mark.Present -> Triple(LaraColors.PrimaryLight, LaraColors.Primary, LaraColors.PrimaryDark)
                Mark.Absent -> Triple(LaraColors.DangerLight, LaraColors.Danger, Color(0xFFB42318))
                Mark.Late -> Triple(LaraColors.WarningLight, LaraColors.Warning, Color(0xFFB54708))
            }
            Box(
                Modifier.size(44.dp)
                    .background(if (on) bg else Color.White, RoundedCornerShape(12.dp))
                    .border(2.dp, if (on) border else LaraColors.Border, RoundedCornerShape(12.dp))
                    .selectable(on, role = Role.RadioButton, onClick = { onMark(m) })
                    .semantics { contentDescription = m.name },
                contentAlignment = Alignment.Center,
            ) { Text(letter, fontWeight = FontWeight.Black, color = if (on) fg else LaraColors.TextSecondary) }
        }
    }
}`,

/* ==========================================================================
   RENDERING
   ========================================================================== */
const ALL = GROUPS.flatMap(g => g.items.map(i => Object.assign({ group: g.name }, i)));
const ORDER = ['overview'].concat(ALL.map(c => c.id));
const OVERVIEW_TITLE = 'L.A.R.A. Design System and Component Library';
const sentence = t => t.charAt(0) + t.slice(1).toLowerCase();

/* Small tokenizer so the code panels read like code. Colors come from the design tokens. */
const KEYWORDS = new Set(['import', 'from', 'export', 'const', 'let', 'var', 'val', 'fun', 'function', 'return', 'if', 'else', 'type', 'interface',
  'class', 'object', 'private', 'public', 'override', 'when', 'is', 'in', 'for', 'as', 'true', 'false', 'null', 'new', 'default', 'extends', 'typeof', 'package', 'by']);
const TOKEN_RE = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'|`(?:[^`\\]|\\.)*`)|(@[A-Za-z]\w*)|(\b0x[0-9A-Fa-f]+\b|\b\d+(?:\.\d+)?\b)|(\b[A-Za-z_]\w*\b)/g;
function highlight(code) {
  let out = '', last = 0, m;
  TOKEN_RE.lastIndex = 0;
  while ((m = TOKEN_RE.exec(code))) {
    out += esc(code.slice(last, m.index));
    const text = esc(m[0]);
    if (m[1]) out += '<span class="tk-c">' + text + '</span>';
    else if (m[2]) out += '<span class="tk-s">' + text + '</span>';
    else if (m[3]) out += '<span class="tk-a">' + text + '</span>';
    else if (m[4]) out += '<span class="tk-n">' + text + '</span>';
    else if (KEYWORDS.has(m[0])) out += '<span class="tk-k">' + text + '</span>';
    else if (/^[A-Z]/.test(m[0])) out += '<span class="tk-t">' + text + '</span>';
    else out += text;
    last = m.index + m[0].length;
  }
  return out + esc(code.slice(last));
}

function codeBlock(label, code) {
  const lines = code.split('\n').length;
  return '<div class="code-wrapper"><div class="code-header"><span class="lang"><i class="ph ph-file-code"></i>' + label +
    '<small>' + lines + ' lines</small></span>' +
    '<button class="copy-btn" data-copy type="button"><i class="ph ph-copy"></i> Copy code</button></div>' +
    '<pre class="code-block" tabindex="0" aria-label="' + label + ' code"><code>' + highlight(code) + '</code></pre></div>';
}

function ruleCard(kind, title, headIcon, itemIcon, list) {
  return '<section class="ds-rule-card ' + kind + '"><header><i class="ph ' + headIcon + '"></i>' + title + '</header><ul>' +
    list.map(t => '<li><i class="ph ' + itemIcon + '"></i><span>' + t + '</span></li>').join('') + '</ul></section>';
}

function pager(id) {
  const i = ORDER.indexOf(id);
  const link = (target, dir) => {
    if (!target) return dir === 'prev' ? '<span></span>' : '';
    const c = target === 'overview' ? { title: 'Overview' } : ALL.find(x => x.id === target);
    const label = dir === 'prev' ? 'Previous' : 'Next';
    const arrow = dir === 'prev' ? '<i class="ph ph-arrow-left"></i>' : '<i class="ph ph-arrow-right"></i>';
    return '<a class="' + dir + '" href="#' + target + '">' + (dir === 'prev' ? arrow : '') +
      '<span><small>' + label + '</small><strong>' + c.title + '</strong></span>' + (dir === 'next' ? arrow : '') + '</a>';
  };
  return '<nav class="ds-pager" aria-label="Previous and next component">' + link(ORDER[i - 1], 'prev') + link(ORDER[i + 1], 'next') + '</nav>';
}

function setNav(open) {
  document.body.classList.toggle('nav-open', open);
  document.getElementById('menu-btn').setAttribute('aria-expanded', open);
}

function showComponent(id) {
  if (!ORDER.includes(id)) id = 'overview';
  const sec = document.getElementById('doc-' + id);
  document.querySelectorAll('.comp-section').forEach(s => { s.hidden = s !== sec; });
  document.querySelectorAll('.ds-nav-link[data-id]').forEach(a => {
    const on = a.dataset.id === id;
    a.classList.toggle('active', on);
    if (on) { a.setAttribute('aria-current', 'page'); a.scrollIntoView({ block: 'nearest' }); } else a.removeAttribute('aria-current');
  });
  const c = ALL.find(x => x.id === id);
  document.title = c ? c.title + ' | L.A.R.A. Design System' : OVERVIEW_TITLE;
  document.body.classList.toggle('wide', !!(c && c.screen));
  setNav(false);
  window.scrollTo({ top: 0, behavior: 'instant' });
}

function selectTab(tab, focus) {
  const sec = tab.closest('.comp-section');
  sec.querySelectorAll('.ds-tab').forEach(x => { const on = x === tab; x.setAttribute('aria-selected', on); x.tabIndex = on ? 0 : -1; });
  sec.querySelectorAll('.panel').forEach(p => { p.hidden = p.dataset.panel !== tab.dataset.panel; });
  if (focus) tab.focus();
}

function copyText(text, btn) {
  const done = () => {
    if (!btn) { triggerToast('success', 'Copied', text); return; }
    const orig = btn.innerHTML;
    btn.classList.add('done');
    btn.innerHTML = '<i class="ph ph-check"></i> Copied';
    setTimeout(() => { btn.classList.remove('done'); btn.innerHTML = orig; }, 1800);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, done);
  else done();
}

function triggerToast(type, titleOverride, descOverride) {
  const anchor = document.getElementById('live-toast-anchor');
  const map = {
    success: ['ph-check-circle', 'Handout Downloaded', 'Handout #2 is saved locally for offline study.'],
    warning: ['ph-cloud-slash', 'Queued Offline', 'No LAN hub detected. Saved to Room SQLite.'],
    ai: ['ph-sparkle', 'Socratic Hint Received', 'L.A.R.A provided a clue based on Lesson 1.'],
    danger: ['ph-lock', 'Assessment Lockout', 'AI Tutor is strictly blocked during an active quiz.']
  };
  const m = map[type];
  const t = document.createElement('div');
  t.className = 'toast toast-' + type;
  t.innerHTML = '<div class="toast-icon-wrap"><i class="ph ' + m[0] + '"></i></div><div class="toast-body"><div class="toast-title"></div><div class="toast-desc"></div></div><button class="toast-close" aria-label="Dismiss"><i class="ph ph-x"></i></button>';
  t.querySelector('.toast-title').textContent = titleOverride || m[1];
  t.querySelector('.toast-desc').textContent = descOverride || m[2];
  t.querySelector('.toast-close').onclick = () => t.remove();
  anchor.appendChild(t);
  while (anchor.children.length > 3) anchor.firstChild.remove();
  setTimeout(() => t.remove(), 4000);
}

function closeOverlays() {
  document.querySelectorAll('.scrim.open').forEach(x => {
    x.classList.remove('open');
    if (x._returnFocus) { x._returnFocus.focus(); x._returnFocus = null; }
  });
  document.querySelectorAll('.sheet.open, .sheet-scrim.open').forEach(x => x.classList.remove('open'));
}

document.addEventListener('click', e => {
  const t = e.target;

  // Mobile drawer
  if (t.closest('#menu-btn')) { setNav(!document.body.classList.contains('nav-open')); return; }
  if (t.closest('#nav-scrim')) { setNav(false); return; }

  // Doc tabs
  const tab = t.closest('.ds-tab');
  if (tab) { selectTab(tab); return; }

  // Copy code, swatch value, page link
  const cp = t.closest('[data-copy]');
  if (cp) { copyText(cp.closest('.code-wrapper').querySelector('code').innerText, cp); return; }
  const sw = t.closest('[data-copy-text]');
  if (sw) { copyText(sw.dataset.copyText); return; }
  if (t.closest('[data-copy-link]')) { copyText(location.href); return; }

  // Overview shortcut
  const sc = t.closest('[data-scroll]');
  if (sc) { const el = document.getElementById(sc.dataset.scroll); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }


  // Demo navs (non-routing)
  const sn = t.closest('#sn-demo .cr-nav');
  if (sn) { sn.parentElement.querySelectorAll('.cr-nav').forEach(x => { x.classList.remove('active'); x.removeAttribute('aria-current'); }); sn.classList.add('active'); sn.setAttribute('aria-current', 'page'); return; }

  // Selection rows
  const row = t.closest('.sel-row');
  if (row) {
    const kind = row.dataset.kind;
    if (kind === 'check') {
      const c = row.querySelector('.check'); c.classList.toggle('on'); row.setAttribute('aria-checked', c.classList.contains('on'));
    } else if (kind === 'switch') {
      const s = row.querySelector('.switch'); s.classList.toggle('on'); row.setAttribute('aria-checked', s.classList.contains('on'));
    } else if (kind === 'radio') {
      row.parentElement.querySelectorAll('.sel-row[data-kind="radio"]').forEach(r => { r.querySelector('.radio').classList.remove('on'); r.setAttribute('aria-checked', 'false'); });
      row.querySelector('.radio').classList.add('on'); row.setAttribute('aria-checked', 'true');
    }
    return;
  }

  // Role or state switch above a Classroom screen preview (falls through to the segmented handler)
  const rs = t.closest('[data-cr-role], [data-cr-state]');
  if (rs) {
    const root = rs.closest('.preview-card').querySelector('[data-role]');
    if (rs.dataset.crRole) root.dataset.role = rs.dataset.crRole;
    if (rs.dataset.crState) root.dataset.state = rs.dataset.crState;
    applyRoleState(root);
  }

  // Segmented
  const seg = t.closest('.seg-item');
  if (seg) { seg.parentElement.querySelectorAll('.seg-item').forEach(s => { s.classList.remove('active'); s.setAttribute('aria-selected', 'false'); }); seg.classList.add('active'); seg.setAttribute('aria-selected', 'true'); return; }

  // Chips
  const chip = t.closest('.chip[data-kind="chip"]');
  if (chip) {
    chip.classList.toggle('selected');
    const sel = chip.classList.contains('selected');
    chip.setAttribute('aria-pressed', sel);
    const ic = chip.querySelector('i');
    if (sel && !ic) chip.insertAdjacentHTML('afterbegin', '<i class="ph ph-check"></i> ');
    if (!sel && ic) ic.remove();
    return;
  }

  // Quiz options
  const opt = t.closest('.quiz-card-option');
  if (opt) {
    opt.parentElement.querySelectorAll('.quiz-card-option').forEach(o => {
      o.classList.remove('selected'); o.setAttribute('aria-checked', 'false');
      const i = o.querySelector('i'); if (i) i.className = 'ph ph-circle';
    });
    opt.classList.add('selected'); opt.setAttribute('aria-checked', 'true');
    const i = opt.querySelector('i'); if (i) i.className = 'ph ph-check-circle';
    return;
  }

  // Attendance
  const ab = t.closest('.att-btn');
  if (ab) { ab.parentElement.querySelectorAll('.att-btn').forEach(b => b.classList.remove('on')); ab.classList.add('on'); return; }

  // Dialog
  const op = t.closest('[data-open]');
  if (op) { const d = document.getElementById(op.dataset.open); if (d) { d._returnFocus = op; d.classList.add('open'); d.querySelector('button').focus(); } return; }
  const cl = t.closest('[data-close]');
  if (cl) { const d = document.getElementById(cl.dataset.close); d.classList.remove('open'); if (d._returnFocus) { d._returnFocus.focus(); d._returnFocus = null; } return; }
  if (t.classList && t.classList.contains('scrim')) { t.classList.remove('open'); if (t._returnFocus) { t._returnFocus.focus(); t._returnFocus = null; } return; }

  // Sheet
  const so = t.closest('[data-sheet-open]');
  if (so) { document.getElementById(so.dataset.sheetOpen).classList.add('open'); document.getElementById(so.dataset.sheetOpen + '-scrim').classList.add('open'); return; }
  const sclose = t.closest('[data-sheet-close]');
  if (sclose) { const id = sclose.dataset.sheetClose; document.getElementById(id).classList.remove('open'); document.getElementById(id + '-scrim').classList.remove('open'); return; }
});

document.addEventListener('keydown', e => {
  const tgt = e.target;
  const typing = tgt.matches && tgt.matches('input, textarea, select, [contenteditable]');

  if (e.key === 'Escape') {
    closeOverlays();
    if (document.body.classList.contains('nav-open')) setNav(false);
    if (tgt.id === 'side-search' && tgt.value) { tgt.value = ''; tgt.dispatchEvent(new Event('input', { bubbles: true })); }
  }

  // "/" jumps to component search
  if (e.key === '/' && !typing && !e.metaKey && !e.ctrlKey && !e.altKey) {
    e.preventDefault();
    if (window.matchMedia('(max-width: 860px)').matches) setNav(true);
    document.getElementById('side-search').focus();
  }

  // Keep Tab inside an open dialog
  const dlg = document.querySelector('.scrim.open');
  if (dlg && e.key === 'Tab') {
    const f = Array.from(dlg.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'));
    if (f.length) {
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  }

  // Arrow keys move between doc tabs
  if (tgt.classList && tgt.classList.contains('ds-tab') && ['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) {
    e.preventDefault();
    const tabs = Array.from(tgt.parentElement.querySelectorAll('.ds-tab'));
    let i = tabs.indexOf(tgt);
    if (e.key === 'ArrowRight') i = (i + 1) % tabs.length;
    if (e.key === 'ArrowLeft') i = (i - 1 + tabs.length) % tabs.length;
    if (e.key === 'Home') i = 0;
    if (e.key === 'End') i = tabs.length - 1;
    selectTab(tabs[i], true);
    return;
  }

  // Custom controls inside previews behave like buttons
  if ((e.key === ' ' || e.key === 'Enter') && tgt.classList && (tgt.classList.contains('sel-row') || tgt.classList.contains('quiz-card-option') || tgt.matches('.chip[data-kind="chip"]'))) {
    e.preventDefault(); tgt.click();
  }

  // PIN boxes
  if (tgt.classList && tgt.classList.contains('pin-box') && e.key === 'Backspace' && !tgt.value && tgt.previousElementSibling) tgt.previousElementSibling.focus();

  // Enter in the sidebar search opens the first match
  if (tgt.id === 'side-search' && e.key === 'Enter') {
    const first = Array.from(document.querySelectorAll('.ds-nav-link[data-title]')).find(a => !a.hidden);
    if (first) { location.hash = first.dataset.id; tgt.blur(); }
  }
});

document.addEventListener('input', e => {
  const b = e.target;
  if (b.classList && b.classList.contains('pin-box')) {
    b.value = b.value.replace(/\D/g, '');
    if (b.value && b.nextElementSibling) b.nextElementSibling.focus();
  }
  if (b.id === 'side-search') {
    const q = b.value.trim().toLowerCase();
    document.querySelectorAll('.ds-nav-link[data-title]').forEach(a => { a.hidden = !!q && !a.dataset.title.includes(q); });
    let any = false;
    document.querySelectorAll('[data-group]').forEach(g => {
      const has = Array.from(g.querySelectorAll('.ds-nav-link')).some(a => !a.hidden);
      g.hidden = !has; any = any || has;
    });
    document.querySelector('.ds-nav-link[data-id="overview"]').hidden = !!q;
    document.getElementById('nr-q').textContent = b.value.trim();
    document.getElementById('no-results').classList.toggle('show', !any);
  }
});

/* Show only what the current role (learner or teacher) and state should see */
function applyRoleState(root) {
  const role = root.dataset.role, state = root.dataset.state;
  root.querySelectorAll('[data-only]').forEach(el => { el.hidden = !el.dataset.only.split(' ').includes(role); });
  if (state) root.querySelectorAll('[data-st]').forEach(el => { el.hidden = !el.dataset.st.split(' ').includes(state); });
}

/* Make demo controls reachable by keyboard without editing each preview */
function enhance() {
  document.querySelectorAll('[data-role]').forEach(applyRoleState);
  document.querySelectorAll('.quiz-card-option, .chip[data-kind="chip"]').forEach(el => {
    if (!el.hasAttribute('tabindex')) el.tabIndex = 0;
    if (!el.hasAttribute('role')) el.setAttribute('role', el.classList.contains('chip') ? 'button' : 'radio');
    if (el.classList.contains('chip') && !el.hasAttribute('aria-pressed')) el.setAttribute('aria-pressed', el.classList.contains('selected'));
  });
}

/* Remake slice: Home and Stream behave like a small app (desktop) */
function rmSync(root) {
  const s = root.dataset.screen, c = root.dataset.cls, k = CR_CLASSES[+c];
  root.querySelectorAll('.rm-nav').forEach(n => {
    const on = n.dataset.id === 'home' ? s === 'home' : n.dataset.id === 'class' && s !== 'home' && n.dataset.cls === c;
    n.classList.toggle('active', on);
    if (on) n.setAttribute('aria-current', 'page'); else n.removeAttribute('aria-current');
  });
  root.querySelectorAll('[data-rm-name]').forEach(e => { e.textContent = k.name; });
  root.querySelectorAll('[data-rm-sec]').forEach(e => { e.textContent = k.section; });
  root.querySelectorAll('[data-rm-icon]').forEach(e => { e.className = 'ph ph-' + k.icon; });
  root.querySelectorAll('.rm-tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab === (s === 'stream' ? 'stream' : root.dataset.tab))));
  root.querySelector('.rm-offhint').hidden = root.dataset.state !== 'offline';
  root.querySelector('.rm-modal [data-rm="post"]').disabled = root.dataset.state === 'offline';
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-rm], [data-cr-state], [data-cr-role], [data-cr-time]');
  const root = t && t.closest('.rm') || (t && t.closest('.preview-card') && t.closest('.preview-card').querySelector('.rm'));
  if (!t || !root) return;
  if (!t.dataset.rm) { if (t.dataset.crTime) root.dataset.time = t.dataset.crTime; setTimeout(() => rmSync(root), 0); return; }
  const a = t.dataset.rm;
  if (a === 'go') {
    root.dataset.screen = t.dataset.screen;
    if (t.dataset.cls !== undefined) root.dataset.cls = t.dataset.cls;
    if (t.dataset.tab) root.dataset.tab = t.dataset.tab;
    if (t.dataset.screen === 'quiz') rmQuizTeacher(root);
    if (t.dataset.label) root.querySelector('[data-rm-later]').textContent = t.dataset.label + ' is the next slice';
    rmSync(root);
  } else if (a === 'quiz-start') {
    rmQuizClock(root); root._qAns = []; root._qIdx = 0; root.dataset.qs = 'run'; rmQuizRender(root); rmSync(root);
  } else if (a === 'quiz-pick') {
    root._qAns[root._qIdx] = +t.dataset.k; rmQuizRender(root);
  } else if (a === 'quiz-next' || a === 'quiz-prev') {
    root._qIdx += a === 'quiz-next' ? 1 : -1; rmQuizRender(root);
  } else if (a === 'quiz-submit') {
    rmQuizSubmit(root, false);
  } else if (a === 'quiz-open') {
    rmQuizClock(root); root.dataset.qt = 'live'; rmQuizTeacher(root);
  } else if (a === 'quiz-close') {
    rmQuizClose(root);
  } else if (a === 'quiz-reset') {
    clearInterval(root._qTimer); root._qEnd = 0; root.dataset.qs = 'intro'; root.dataset.qt = 'idle'; rmQuizTeacher(root);
    root.querySelectorAll('[data-q-time]').forEach(e => { e.textContent = rmFmt(+root.dataset.time || 600) + ' left'; e.closest('.rm-timer').classList.remove('warn', 'crit'); });
  } else if (a === 'toggle-nav') {
    const rail = root.dataset.nav !== 'rail'; root.dataset.nav = rail ? 'rail' : ''; t.setAttribute('aria-expanded', String(!rail));
  } else if (a === 'open-compose') {
    rmSync(root); root.querySelector('.rm-modal').hidden = false; root.querySelector('.rm-modal textarea').focus();
  } else if (a === 'close-compose') {
    root.querySelector('.rm-modal').hidden = true;
  } else if (a === 'post') {
    const ta = root.querySelector('.rm-modal textarea'), text = ta.value.trim();
    if (!text) { ta.focus(); return; }
    const box = document.createElement('div'); box.textContent = text;
    root.querySelector('.rm-posts').insertAdjacentHTML('afterbegin', rmAnnouncement('MR', 'Ms. Reyes', 'Just now', box.innerHTML));
    ta.value = ''; root.querySelector('.rm-modal').hidden = true;
  } else if (a === 'comment-toggle') {
    const r = t.closest('.rm-comments').querySelector('.rm-reply'); r.hidden = !r.hidden; if (!r.hidden) r.querySelector('input').focus();
  } else if (a === 'comment-send') {
    const inp = t.closest('.rm-reply').querySelector('input'), text = inp.value.trim();
    if (!text) { inp.focus(); return; }
    const box = document.createElement('div'); box.textContent = text;
    const who = root.dataset.role === 'teacher' ? ['MR', 'Ms. Reyes', ''] : ['AS', 'Ana', 'blue'];
    const badge = root.dataset.state === 'offline' ? '<span class="badge badge-queued"><i class="ph ph-clock"></i> Queued for sync</span>' : '<span class="badge badge-synced"><i class="ph ph-check-circle"></i> Saved</span>';
    t.closest('.rm-comments').querySelector('.rm-add').insertAdjacentHTML('beforebegin', '<div class="rm-comment"><span class="avatar sm ' + who[2] + '">' + who[0] + '</span><div><strong>' + who[1] + '</strong><small>Just now</small> ' + badge + '<br>' + box.innerHTML + '</div></div>');
    inp.value = '';
  }
});

/* ---------- Boot ---------- */
renderSidebar();
document.getElementById('main').innerHTML = renderOverview() + ALL.map(renderSection).join('');
enhance();
showComponent(location.hash.replace('#', ''));
window.addEventListener('hashchange', () => showComponent(location.hash.replace('#', '')));
</script>
