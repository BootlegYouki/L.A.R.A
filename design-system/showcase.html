      COMPARE.map(r => '<tr><th scope="row">' + r[0] + '</th><td>' + r[1] + '</td><td>' + r[2] + '</td></tr>').join('') +
    '</tbody></table></div><p style="margin-top:14px"><a class="btn btn-secondary" href="#screen-home"><i class="ph ph-arrow-right"></i> Open the screens</a></p>' +
    '<h2 class="ov-section-title" data-toc="Components" id="ov-areas">Components</h2>' +
    '<p class="ov-section-sub">Every component has a live preview, React + Tailwind code, Kotlin Compose code, and usage and accessibility guidance.</p>' +
    '<div class="ov-areas">' + areas + '</div>' +
    '<h2 class="ov-section-title" data-toc="Keeping it in sync" id="ov-sync">Keeping the files in sync</h2>' +
    '<p class="ov-section-sub">This page is the design. The token files follow it, and a test fails when they drift.</p>' +
    '<ol class="ov-sync">' +
      '<li><span>Change the design here: the token variables and the React and Kotlin code blocks in <code>showcase.html</code>.</span></li>' +
      '<li><span>Update the matching files in <code>design-system/</code> and the tables in <code>design-system.md</code>.</span></li>' +
      '<li><span>Run <code>python3 -m unittest discover tests</code>. <strong>test_design_tokens.py</strong> fails on any drift from the token files.</span></li>' +
      '<li><span>Merge as a Lead-reviewed design-system PR. Teams update their code afterwards.</span></li>' +
    '</ol></section>';
}

function renderSidebar() {
  let h = '<div class="ds-search"><i class="ph ph-magnifying-glass"></i><input id="side-search" type="text" autocomplete="off" placeholder="Search components" aria-label="Search components"><kbd>/</kbd></div>' +
    '<a class="ds-nav-link" data-id="overview" href="#overview"><i class="ph ph-house"></i><span class="ds-nav-label">Overview</span></a>';
  GROUPS.forEach(g => {
    h += '<div data-group><div class="ds-group-title">' + g.name + '<span>' + g.items.length + '</span></div>';
    g.items.forEach(i => {
      h += '<a class="ds-nav-link" data-id="' + i.id + '" data-title="' + (i.title + ' ' + g.name).toLowerCase() + '" href="#' + i.id + '"><i class="ph ph-' + i.icon + '"></i><span class="ds-nav-label">' + i.title + '</span>' +
        (i.tag ? '<span class="ds-tag' + (i.tag === 'MOBILE' ? ' mobile' : '') + '">' + sentence(i.tag) + '</span>' : '') + '</a>';
    });
    h += '</div>';
  });
  h += '<div class="ds-no-results" id="no-results" role="status"><i class="ph ph-magnifying-glass"></i>No component matches &ldquo;<span id="nr-q"></span>&rdquo;. Try a shorter word.</div>';
  document.getElementById('sidebar').innerHTML = h;
}

function renderToc(sec) {
  const items = Array.from(sec.querySelectorAll('[data-toc]'));
  const toc = document.getElementById('toc');
  toc.innerHTML = '<div class="toc-title">On this page</div><ul class="toc-list">' +
    items.map((el, i) => '<li><a class="toc-item" href="#" data-toc-index="' + i + '">' + el.dataset.toc + '</a></li>').join('') + '</ul>';
  toc.querySelectorAll('.toc-item').forEach((a, i) => { a._target = items[i]; });
}

/* ==========================================================================
   BEHAVIOUR
   ========================================================================== */
function setNav(open) {
  document.body.classList.toggle('nav-open', open);
  document.getElementById('menu-btn').setAttribute('aria-expanded', open);
}

function showComponent(id) {
  if (!ORDER.includes(id)) id = 'overview';
  const sec = document.getElementById('doc-' + id);
  document.querySelectorAll('.comp-section').forEach(s => { s.hidden = s !== sec; });
  document.querySelectorAll('.ds-nav-link[data-id]').forEach(a => {
    const on = a.dataset.id === id;
    a.classList.toggle('active', on);
    if (on) { a.setAttribute('aria-current', 'page'); a.scrollIntoView({ block: 'nearest' }); } else a.removeAttribute('aria-current');
  });
  const c = ALL.find(x => x.id === id);
  document.title = c ? c.title + ' | L.A.R.A. Design System' : OVERVIEW_TITLE;
  document.body.classList.toggle('wide', !!(c && c.screen));
  renderToc(sec);
  setNav(false);
  window.scrollTo({ top: 0, behavior: 'instant' });
  spy();
}

function selectTab(tab, focus) {
  const sec = tab.closest('.comp-section');
  sec.querySelectorAll('.ds-tab').forEach(x => { const on = x === tab; x.setAttribute('aria-selected', on); x.tabIndex = on ? 0 : -1; });
  sec.querySelectorAll('.panel').forEach(p => { p.hidden = p.dataset.panel !== tab.dataset.panel; });
  if (focus) tab.focus();
}

function copyText(text, btn) {
  const done = () => {
    if (!btn) { triggerToast('success', 'Copied', text); return; }
    const orig = btn.innerHTML;
    btn.classList.add('done');
    btn.innerHTML = '<i class="ph ph-check"></i> Copied';
    setTimeout(() => { btn.classList.remove('done'); btn.innerHTML = orig; }, 1800);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, done);
  else done();
}

function triggerToast(type, titleOverride, descOverride) {
  const anchor = document.getElementById('live-toast-anchor');
  const map = {
    success: ['ph-check-circle', 'Handout Downloaded', 'Handout #2 is saved locally for offline study.'],
    warning: ['ph-cloud-slash', 'Queued Offline', 'No LAN hub detected. Saved to Room SQLite.'],
    ai: ['ph-sparkle', 'Socratic Hint Received', 'L.A.R.A provided a clue based on Lesson 1.'],
    danger: ['ph-lock', 'Assessment Lockout', 'AI Tutor is strictly blocked during an active quiz.']
  };
  const m = map[type];
  const t = document.createElement('div');
  t.className = 'toast toast-' + type;
  t.innerHTML = '<div class="toast-icon-wrap"><i class="ph ' + m[0] + '"></i></div><div class="toast-body"><div class="toast-title"></div><div class="toast-desc"></div></div><button class="toast-close" aria-label="Dismiss"><i class="ph ph-x"></i></button>';
  t.querySelector('.toast-title').textContent = titleOverride || m[1];
  t.querySelector('.toast-desc').textContent = descOverride || m[2];
  t.querySelector('.toast-close').onclick = () => t.remove();
  anchor.appendChild(t);
  while (anchor.children.length > 3) anchor.firstChild.remove();
  setTimeout(() => t.remove(), 4000);
}

/* Which "On this page" entry is current */
let spyQueued = false;
function spy() {
  spyQueued = false;
  const links = Array.from(document.querySelectorAll('.toc-item'));
  if (!links.length) return;
  let cur = 0;
  links.forEach((l, i) => { if (l._target && l._target.getBoundingClientRect().top <= 140) cur = i; });
  if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) cur = links.length - 1;
  links.forEach((l, i) => { l.classList.toggle('active', i === cur); if (i === cur) l.setAttribute('aria-current', 'location'); else l.removeAttribute('aria-current'); });
}
window.addEventListener('scroll', () => { if (!spyQueued) { spyQueued = true; requestAnimationFrame(spy); } }, { passive: true });

function closeOverlays() {
  document.querySelectorAll('.scrim.open').forEach(x => {
    x.classList.remove('open');
    if (x._returnFocus) { x._returnFocus.focus(); x._returnFocus = null; }
  });
  document.querySelectorAll('.sheet.open, .sheet-scrim.open').forEach(x => x.classList.remove('open'));
}

document.addEventListener('click', e => {
  const t = e.target;

  // Mobile drawer
  if (t.closest('#menu-btn')) { setNav(!document.body.classList.contains('nav-open')); return; }
  if (t.closest('#nav-scrim')) { setNav(false); return; }

  // Doc tabs
  const tab = t.closest('.ds-tab');
  if (tab) { selectTab(tab); return; }

  // Copy code, swatch value, page link
  const cp = t.closest('[data-copy]');
  if (cp) { copyText(cp.closest('.code-wrapper').querySelector('code').innerText, cp); return; }
  const sw = t.closest('[data-copy-text]');
  if (sw) { copyText(sw.dataset.copyText); return; }
  if (t.closest('[data-copy-link]')) { copyText(location.href); return; }

  // Overview shortcut
  const sc = t.closest('[data-scroll]');
  if (sc) { const el = document.getElementById(sc.dataset.scroll); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }

  // On this page
  const toc = t.closest('.toc-item');
  if (toc) {
    e.preventDefault();
    const target = toc._target;
    if (target && target.dataset.anchor === 'preview') {
      const codeTab = target.closest('.comp-section').querySelector('.ds-tab[aria-selected="true"]');
      if (codeTab) codeTab.focus({ preventScroll: true });
    }
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }

  // Demo navs (non-routing)
  const bn = t.closest('#bn-demo .bn-item');
  if (bn) { bn.parentElement.querySelectorAll('.bn-item').forEach(x => x.classList.remove('active')); bn.classList.add('active'); return; }
  const sn = t.closest('#sn-demo .cr-nav');
  if (sn) { sn.parentElement.querySelectorAll('.cr-nav').forEach(x => { x.classList.remove('active'); x.removeAttribute('aria-current'); }); sn.classList.add('active'); sn.setAttribute('aria-current', 'page'); return; }

  // Selection rows
  const row = t.closest('.sel-row');
  if (row) {
    const kind = row.dataset.kind;
    if (kind === 'check') {
      const c = row.querySelector('.check'); c.classList.toggle('on'); row.setAttribute('aria-checked', c.classList.contains('on'));
    } else if (kind === 'switch') {
      const s = row.querySelector('.switch'); s.classList.toggle('on'); row.setAttribute('aria-checked', s.classList.contains('on'));
    } else if (kind === 'radio') {
      row.parentElement.querySelectorAll('.sel-row[data-kind="radio"]').forEach(r => { r.querySelector('.radio').classList.remove('on'); r.setAttribute('aria-checked', 'false'); });
      row.querySelector('.radio').classList.add('on'); row.setAttribute('aria-checked', 'true');
    }
    return;
  }

  // Role or state switch above a Classroom screen preview (falls through to the segmented handler)
  const rs = t.closest('[data-cr-role], [data-cr-state]');
  if (rs) {
    const root = rs.closest('.preview-card').querySelector('[data-role]');
    if (rs.dataset.crRole) root.dataset.role = rs.dataset.crRole;
    if (rs.dataset.crState) root.dataset.state = rs.dataset.crState;
    applyRoleState(root);
  }

  // Segmented
  const seg = t.closest('.seg-item');
  if (seg) { seg.parentElement.querySelectorAll('.seg-item').forEach(s => { s.classList.remove('active'); s.setAttribute('aria-selected', 'false'); }); seg.classList.add('active'); seg.setAttribute('aria-selected', 'true'); return; }

  // Chips
  const chip = t.closest('.chip[data-kind="chip"]');
  if (chip) {
    chip.classList.toggle('selected');
    const sel = chip.classList.contains('selected');
    chip.setAttribute('aria-pressed', sel);
    const ic = chip.querySelector('i');
    if (sel && !ic) chip.insertAdjacentHTML('afterbegin', '<i class="ph ph-check"></i> ');
    if (!sel && ic) ic.remove();
    return;
  }

  // Quiz options
  const opt = t.closest('.quiz-card-option');
  if (opt) {
    opt.parentElement.querySelectorAll('.quiz-card-option').forEach(o => {
      o.classList.remove('selected'); o.setAttribute('aria-checked', 'false');
      const i = o.querySelector('i'); if (i) i.className = 'ph ph-circle';
    });
    opt.classList.add('selected'); opt.setAttribute('aria-checked', 'true');
    const i = opt.querySelector('i'); if (i) i.className = 'ph ph-check-circle';
    return;
  }

  // Attendance
  const ab = t.closest('.att-btn');
  if (ab) { ab.parentElement.querySelectorAll('.att-btn').forEach(b => b.classList.remove('on')); ab.classList.add('on'); return; }

  // Dialog
  const op = t.closest('[data-open]');
  if (op) { const d = document.getElementById(op.dataset.open); if (d) { d._returnFocus = op; d.classList.add('open'); d.querySelector('button').focus(); } return; }
  const cl = t.closest('[data-close]');
  if (cl) { const d = document.getElementById(cl.dataset.close); d.classList.remove('open'); if (d._returnFocus) { d._returnFocus.focus(); d._returnFocus = null; } return; }
  if (t.classList && t.classList.contains('scrim')) { t.classList.remove('open'); if (t._returnFocus) { t._returnFocus.focus(); t._returnFocus = null; } return; }

  // Sheet
  const so = t.closest('[data-sheet-open]');
  if (so) { document.getElementById(so.dataset.sheetOpen).classList.add('open'); document.getElementById(so.dataset.sheetOpen + '-scrim').classList.add('open'); return; }
  const sclose = t.closest('[data-sheet-close]');
  if (sclose) { const id = sclose.dataset.sheetClose; document.getElementById(id).classList.remove('open'); document.getElementById(id + '-scrim').classList.remove('open'); return; }
});

document.addEventListener('keydown', e => {
  const tgt = e.target;
  const typing = tgt.matches && tgt.matches('input, textarea, select, [contenteditable]');

  if (e.key === 'Escape') {
    closeOverlays();
    if (document.body.classList.contains('nav-open')) setNav(false);
    if (tgt.id === 'side-search' && tgt.value) { tgt.value = ''; tgt.dispatchEvent(new Event('input', { bubbles: true })); }
  }

  // "/" jumps to component search
  if (e.key === '/' && !typing && !e.metaKey && !e.ctrlKey && !e.altKey) {
    e.preventDefault();
    if (window.matchMedia('(max-width: 860px)').matches) setNav(true);
    document.getElementById('side-search').focus();
  }

  // Keep Tab inside an open dialog
  const dlg = document.querySelector('.scrim.open');
  if (dlg && e.key === 'Tab') {
    const f = Array.from(dlg.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'));
    if (f.length) {
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  }

  // Arrow keys move between doc tabs
  if (tgt.classList && tgt.classList.contains('ds-tab') && ['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) {
    e.preventDefault();
    const tabs = Array.from(tgt.parentElement.querySelectorAll('.ds-tab'));
    let i = tabs.indexOf(tgt);
    if (e.key === 'ArrowRight') i = (i + 1) % tabs.length;
    if (e.key === 'ArrowLeft') i = (i - 1 + tabs.length) % tabs.length;
    if (e.key === 'Home') i = 0;
    if (e.key === 'End') i = tabs.length - 1;
    selectTab(tabs[i], true);
    return;
  }

  // Custom controls inside previews behave like buttons
  if ((e.key === ' ' || e.key === 'Enter') && tgt.classList && (tgt.classList.contains('sel-row') || tgt.classList.contains('quiz-card-option') || tgt.matches('.chip[data-kind="chip"]'))) {
    e.preventDefault(); tgt.click();
  }

  // PIN boxes
  if (tgt.classList && tgt.classList.contains('pin-box') && e.key === 'Backspace' && !tgt.value && tgt.previousElementSibling) tgt.previousElementSibling.focus();

  // Enter in the sidebar search opens the first match
  if (tgt.id === 'side-search' && e.key === 'Enter') {
    const first = Array.from(document.querySelectorAll('.ds-nav-link[data-title]')).find(a => !a.hidden);
    if (first) { location.hash = first.dataset.id; tgt.blur(); }
  }
});

document.addEventListener('input', e => {
  const b = e.target;
  if (b.classList && b.classList.contains('pin-box')) {
    b.value = b.value.replace(/\D/g, '');
    if (b.value && b.nextElementSibling) b.nextElementSibling.focus();
  }
  if (b.id === 'side-search') {
    const q = b.value.trim().toLowerCase();
    document.querySelectorAll('.ds-nav-link[data-title]').forEach(a => { a.hidden = !!q && !a.dataset.title.includes(q); });
    let any = false;
    document.querySelectorAll('[data-group]').forEach(g => {
      const has = Array.from(g.querySelectorAll('.ds-nav-link')).some(a => !a.hidden);
      g.hidden = !has; any = any || has;
    });
    document.querySelector('.ds-nav-link[data-id="overview"]').hidden = !!q;
    document.getElementById('nr-q').textContent = b.value.trim();
    document.getElementById('no-results').classList.toggle('show', !any);
  }
});

/* Show only what the current role (pupil or teacher) and state should see */
function applyRoleState(root) {
  const role = root.dataset.role, state = root.dataset.state;
  root.querySelectorAll('[data-only]').forEach(el => { el.hidden = !el.dataset.only.split(' ').includes(role); });
  if (state) root.querySelectorAll('[data-st]').forEach(el => { el.hidden = !el.dataset.st.split(' ').includes(state); });
}

/* Make demo controls reachable by keyboard without editing each preview */
function enhance() {
  document.querySelectorAll('[data-role]').forEach(applyRoleState);
  document.querySelectorAll('.quiz-card-option, .chip[data-kind="chip"]').forEach(el => {
    if (!el.hasAttribute('tabindex')) el.tabIndex = 0;
    if (!el.hasAttribute('role')) el.setAttribute('role', el.classList.contains('chip') ? 'button' : 'radio');
    if (el.classList.contains('chip') && !el.hasAttribute('aria-pressed')) el.setAttribute('aria-pressed', el.classList.contains('selected'));
  });
}

/* ---------- Boot ---------- */
renderSidebar();
document.getElementById('main').innerHTML = renderOverview() + ALL.map(renderSection).join('');
enhance();
showComponent(location.hash.replace('#', ''));
window.addEventListener('hashchange', () => showComponent(location.hash.replace('#', '')));
</script>
