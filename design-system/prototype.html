.rm-timer { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 14px; border-radius: var(--radius-pill); border: 1px solid var(--color-success-border); background: var(--color-light-green); color: var(--color-dark-green); font-size: 14px; font-weight: 900; font-variant-numeric: tabular-nums; }
.rm-timer.warn { background: var(--color-warning-light); color: var(--color-warning-dark); border-color: var(--color-warning-border); }
.rm-timer.crit { background: var(--color-danger-light); color: var(--color-danger-dark); border-color: var(--color-danger-border); }
.rm-dots { display: flex; gap: 6px; }
.rm-dots i { flex: 1; height: 8px; border-radius: var(--radius-pill); background: var(--color-border); }
.rm-dots i.done { background: var(--color-primary-green); }
.rm-dots i.cur { background: var(--color-dark-green); }
.rm-qbody { display: grid; gap: 16px; }
.rm-qcount { font-size: 13px; font-weight: 800; color: var(--color-text-secondary); }
.rm-qtext { font-size: 22px; line-height: 28px; font-weight: 900; }
.rm-opts { display: grid; gap: 12px; }
.rm-opt { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 56px; padding: 12px 18px; border: 2px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface-white); color: inherit; font-family: inherit; font-size: 16px; font-weight: 800; text-align: left; cursor: pointer; }
.rm-opt:hover { border-color: var(--color-primary-green); box-shadow: var(--shadow-card-hover); }
.rm-opt i { font-size: 22px; color: var(--color-text-muted); }
.rm-opt[aria-checked="true"] { border-color: var(--color-primary-green); background: var(--color-light-green); }
.rm-opt[aria-checked="true"] i { color: var(--color-primary-green); }
.rm-qfoot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.rm-qnote { display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 18px; font-weight: 700; color: var(--color-text-secondary); }
.rm-qnote i { font-size: 18px; flex-shrink: 0; }
.rm-q { display: none; }
.rm .rm-qd-q { display: none; }
.rm[data-state="offline"] .rm-qd-q { display: inline-flex; }
.rm[data-state="offline"] .rm-sv { display: none; }
.rm[data-qs="intro"] .rm-qi, .rm[data-qs="run"] .rm-qr, .rm[data-qs="done"] .rm-qd { display: grid; }
.rm-ring { width: 96px; height: 96px; }
.rm-ring circle { fill: none; stroke-width: 10; }
.rm-ring .bg { stroke: var(--color-border); }
.rm-ring .fg { stroke: var(--color-primary-green); stroke-linecap: round; }
.rm-result { display: flex; align-items: center; gap: 24px; }
.rm-result h4 { font-size: 22px; line-height: 28px; font-weight: 900; }
.rm-result p { margin-top: 4px; font-size: 14px; line-height: 20px; font-weight: 700; color: var(--color-text-secondary); }
.rm-demo { display: flex; align-items: center; gap: 8px; justify-content: flex-end; font-size: 12px; font-weight: 800; color: var(--color-text-muted); }
.rm-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.rm-stat { padding: 16px; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface-white); }
.rm-stat strong { display: block; font-size: 28px; line-height: 36px; font-weight: 900; }
.rm-stat span { font-size: 13px; font-weight: 800; color: var(--color-text-secondary); }
.rm-lrow { display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 8px 4px; border-bottom: 1px solid var(--color-border); }
.rm-lrow .nm { flex: 1; min-width: 0; font-size: 15px; font-weight: 800; }
.rm-prog { width: 160px; height: 8px; border-radius: var(--radius-pill); background: var(--color-border); overflow: hidden; }
.rm-prog i { display: block; height: 100%; background: var(--color-primary-green); }
.rm-lrow .cnt { width: 56px; font-size: 13px; font-weight: 800; color: var(--color-text-secondary); text-align: right; }
.rm[data-qt="idle"] [data-qt-show]:not([data-qt-show~="idle"]), .rm[data-qt="live"] [data-qt-show]:not([data-qt-show~="live"]), .rm[data-qt="closed"] [data-qt-show]:not([data-qt-show~="closed"]) { display: none; }
.rm.rm-lite { min-height: 0; overflow: visible; border: none; background: transparent; }
.rm-lite-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; width: 100%; }
.rm .btn, .rm .rm-tonal, .rm .cr-link { min-height: var(--control-height-desktop); }
.rm .cr-icon { width: var(--control-height-desktop); height: var(--control-height-desktop); }
.rm .rm-tab, .rm .rm-nav { min-height: 48px; }
.rm .rm-reply .form-input, .rm .rm-note .main { min-height: var(--control-height-desktop); }
@container rm (max-width: 760px) { .rm-body { grid-template-columns: minmax(0, 1fr); } .rm-drawer { display: none; } .rm-cols { grid-template-columns: minmax(0, 1fr); } .rm-banner h2 { padding-right: 0; } .rm-banner .subj { display: none; } }
.cr-item { display: flex; gap: 14px; align-items: flex-start; padding: 14px 4px; border-top: 1px solid var(--color-border); }
.cr-item .main { flex: 1; min-width: 0; }
.cr-item .main strong { display: block; font-size: 15px; font-weight: 800; }
.cr-item .main small { display: block; font-size: 13px; font-weight: 700; color: var(--color-text-secondary); margin-top: 2px; }
html, body { height: 100%; }
.rm { min-height: 100vh; border: none; border-radius: 0; }
.rm-sheet { min-height: calc(100vh - 64px); padding-bottom: 96px; }
.rm-modal { position: fixed; }
.pv-bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 20; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; padding: 8px 12px; border-radius: var(--radius-xl); background: var(--color-surface-white); border: 1px solid var(--color-border); box-shadow: var(--shadow-elevated); max-width: calc(100vw - 32px); }
.pv-bar .cr-switch { margin: 0; }
  </style>
</head>
<body>
<div id="app"></div>
<div class="pv-bar" role="group" aria-label="Prototype controls"></div>
<script>
const CR_CLASSES = [
  { icon: 'flask', name: 'Science 4', section: 'Grade 4 - Rizal', teacher: 'Ms. Reyes', init: 'MR' },
  { icon: 'calculator', name: 'Math 4', section: 'Grade 4 - Rizal', teacher: 'Mr. Bautista', init: 'MB' },
  { icon: 'book-open-text', name: 'English 4', section: 'Grade 4 - Rizal', teacher: 'Ms. Cruz', init: 'MC' },
  { icon: 'translate', name: 'Filipino 4', section: 'Grade 4 - Rizal', teacher: 'Ms. Dizon', init: 'MD' }
];
const CR_SCI = CR_CLASSES[0];

function crSwitch(views, labelText, kind) {
  const label = labelText || 'View as';
  return '<div class="cr-switch"><span>' + label + '</span><div class="segmented" role="tablist" aria-label="' + label + '">' +
    views.map((v, i) => '<button class="seg-item' + (i === 0 ? ' active' : '') + '" role="tab" type="button" aria-selected="' + (i === 0) + '" data-cr-' + (kind || 'role') + '="' + v[0] + '">' + v[1] + '</button>').join('') +
    '</div></div>';
}

const CR_VIEWS = [['learner', 'Learner'], ['teacher', 'Teacher']];
/* ---------------------------- Remake slice: Home and Stream (desktop) ---------------------------- */
const RM_DUE = ['Pagsusulit #2 is due Fri, Oct 9', 'Fractions drill is due Mon, Oct 12', '', ''];
const RM_STATES = [['normal', 'Normal'], ['empty', 'Empty'], ['loading', 'Loading'], ['offline', 'Offline']];

function rmIcon(name, cls) { return '<i class="ph ' + (cls || '') + ' ph-' + name + '"></i>'; }
function rmBtn(icon, label, extra) { return '<button class="cr-icon" type="button" aria-label="' + label + '"' + (extra || '') + '>' + rmIcon(icon) + '</button>'; }

function rmDrawer() {
  const nav = (id, icon, text, extra) => '<button class="rm-nav" type="button" data-rm="go" data-id="' + id + '" data-screen="' + (id === 'home' ? 'home' : 'later') + '"' + (extra || '') + '>' + rmIcon(icon) + '<span class="t">' + text + '</span></button>';
  return nav('home', 'house', 'Home') +
    '<div class="rm-sec"><i class="ph ph-graduation-cap"></i><span data-only="learner">Enrolled</span><span data-only="teacher">Teaching</span><i class="ph ph-caret-up end"></i></div>' +
    '<div data-only="learner">' + nav('todo', 'check-square', 'To-do', ' data-label="To-do"') + '</div>' +
    '<div data-only="teacher">' + nav('review', 'clipboard-text', 'To review', ' data-label="To review"') + '</div>' +
    '<div class="rm-has">' + CR_CLASSES.map((c, i) => '<button class="rm-nav" type="button" data-rm="go" data-id="class" data-screen="stream" data-cls="' + i + '"><span class="rm-dot">' + c.name.charAt(0) + '</span><span class="t">' + c.name + '<small>' + c.section + '</small></span></button>').join('') + '</div>' +
    '<div class="rm-rule"></div>' + nav('archived', 'archive', 'Archived classes', ' data-label="Archived classes"') + nav('settings', 'gear', 'Settings', ' data-label="Settings"');
}

function rmCard(c, i) {
  const learnerInfo = RM_DUE[i] ? '<span class="rm-pill due">' + rmIcon('timer') + RM_DUE[i] + '</span>' : '<span class="rm-pill ok">' + rmIcon('check-circle') + 'All caught up</span>';
  const teacherInfo = i === 0 ? '<span class="rm-pill due">' + rmIcon('clipboard-text') + '5 turned in: Handout #2</span>' : '<span class="rm-pill ok">' + rmIcon('check-circle') + 'Nothing to review</span>';
  return '<article class="rm-card"><div class="rm-card-top"><span class="rm-card-ic" aria-hidden="true">' + rmIcon(c.icon) + '</span>' + rmBtn('dots-three-vertical', 'More options for ' + c.name) + '</div>' +
    '<button class="rm-card-main" type="button" data-rm="go" data-screen="stream" data-cls="' + i + '"><strong>' + c.name + '</strong><span>' + c.section + '</span></button>' +
    '<div data-only="learner">' + learnerInfo + '</div><div data-only="teacher">' + teacherInfo + '</div>' +
    '<footer class="rm-card-foot"><span class="rm-who" data-only="learner"><span class="avatar sm" aria-hidden="true">' + c.init + '</span>' + c.teacher + '</span><span class="rm-who" data-only="teacher">' + rmIcon('users') + '27 learners</span>' +
    '<span class="rm-open" aria-hidden="true">Open ' + rmIcon('arrow-right') + '</span></footer></article>';
}

function rmHome() {
  const item = (tile, icon, title, sub, end) => '<div class="cr-item"><span class="tile ' + tile + '">' + rmIcon(icon) + '</span><div class="main"><strong>' + title + '</strong><small>' + sub + '</small></div>' + end + '</div>';
  const due = '<section class="rm-panel rm-has" aria-label="Due soon"><div class="rm-head"><h3 class="rm-h"><span data-only="learner">Due soon</span><span data-only="teacher">Recently due</span></h3><span><button class="cr-link" type="button" data-rm="go" data-screen="later" data-label="To-do"><span data-only="learner">View To-do</span><span data-only="teacher">View work in progress</span></button>' + rmBtn('arrows-in-line-vertical', 'Collapse this section') + '</span></div>' +
    '<div data-only="learner">' + item('quiz', 'timer', 'Pagsusulit #2: Parts of a Leaf', 'Science 4', '<span class="badge badge-queued"><i class="ph ph-clock"></i> Fri, Oct 9</span>') + item('', 'notebook', 'Fractions drill', 'Math 4', '<span class="badge badge-neutral"><i class="ph ph-clock"></i> Mon, Oct 12</span>') + '</div>' +
    '<div data-only="teacher">' + item('', 'clipboard-text', 'Handout #2: Parts of a Leaf', 'Science 4 - 5 turned in, 27 assigned', '<button class="btn btn-secondary" type="button" data-rm="go" data-screen="later" data-label="Student work">Review</button>') + '</div></section>';
  const classes = '<section class="rm-panel rm-has" aria-label="Classes"><div class="rm-head"><h3 class="rm-h">Classes</h3><button class="cr-link" type="button" data-rm="go" data-screen="later" data-label="Join or create a class">' + rmIcon('plus') + '<span data-only="learner">Join class</span><span data-only="teacher">Create class</span></button></div><div class="rm-grid">' + CR_CLASSES.map(rmCard).join('') + '</div></section>';
  const empty = '<section class="rm-empty" aria-label="No classes yet"><span class="art">' + rmIcon('graduation-cap') + '</span><div><h4>Add a class to get started</h4><p data-only="learner">Ask your teacher for the 6-character class code, then type it here.</p><p data-only="teacher">Create a class and share its code. You approve each learner who asks to join.</p>' +
    '<button class="rm-tonal" type="button" style="margin-top:12px" data-rm="go" data-screen="later" data-label="Join or create a class">' + rmIcon('plus') + '<span data-only="learner">Join class</span><span data-only="teacher">Create class</span></button></div></section>';
  const skel = '<div class="rm-skel" aria-hidden="true"><i style="height:28px;width:160px"></i><i style="height:72px"></i><i style="height:72px"></i><div style="display:grid;grid-template-columns:repeat(auto-fill,257px);gap:16px"><i style="height:296px"></i><i style="height:296px"></i><i style="height:296px"></i></div></div>';
  return '<div data-s="home"><div class="rm-wrap wide"><div class="rm-offline">' + rmIcon('wifi-slash') + 'Hub not reachable. You are seeing what is saved on this device.</div>' + due + classes + empty + skel + '</div></div>';
}

const RM_TIMES = [['600', '10:00'], ['290', '4:50'], ['100', '1:40']];
const RM_QUIZ = { title: 'Pagsusulit #2: Parts of a Leaf', questions: [
  ['What gives a leaf its green color?', ['Stomata', 'Chlorophyll', 'Phloem', 'Veins']],
  ['Which part lets air move in and out of a leaf?', ['Stomata', 'Petiole', 'Xylem', 'Blade']],
  ['What do leaves make using sunlight?', ['Soil', 'Food (sugar)', 'Water', 'Rocks']],
  ['The flat, wide part of a leaf is called the...', ['Blade', 'Stem', 'Root', 'Seed']],
  ['Which part joins the leaf to the stem?', ['Petiole', 'Blade', 'Vein', 'Edge']]] };
const RM_LEARNERS = [['AS', 'Ana S.'], ['JD', 'Juan D.'], ['MR', 'Mika R.'], ['PC', 'Paolo C.'], ['LM', 'Liza M.'], ['BT', 'Ben T.']];
const RM_LIVE = [['p', 3], ['s', 5], ['p', 1], ['n', 0], ['s', 5], ['p', 4]];

function rmTimer() { return '<span class="rm-timer">' + rmIcon('timer') + '<span data-q-time>10:00 left</span></span>'; }

function rmQuiz() {
  const back = '<button class="cr-link" type="button" data-rm="go" data-screen="stream" style="justify-self:start;padding-left:0">' + rmIcon('arrow-left') + 'Back to Stream</button>';
  const meta = '<div class="rm-qmeta"><span class="badge badge-neutral">' + rmIcon('list-numbers') + ' 5 questions</span><span class="badge badge-neutral">' + rmIcon('timer') + ' 10 minutes</span><span class="badge badge-neutral" data-rm-name>Science 4</span></div>';
  const demo = '<div class="rm-demo">Prototype only:<button class="cr-link" type="button" data-rm="quiz-reset">Restart the demo</button></div>';
  const offline = '<div class="rm-offline">' + rmIcon('wifi-slash') + 'Hub not reachable. Keep going: the timer keeps running and your answers are saved on this device.</div>';
  const intro = '<section class="rm-qcard rm-q rm-qi">' + back + '<h3>' + RM_QUIZ.title + '</h3>' + meta +
    '<ul class="rm-qlist"><li>' + rmIcon('timer') + 'One timer for the whole quiz. It starts when you press Start quiz and cannot be paused.</li>' +
    '<li>' + rmIcon('cloud-slash') + 'If the Wi-Fi drops, keep going. Your answers are saved on this device and sent when the Hub is back.</li>' +
    '<li>' + rmIcon('lock-key') + 'Ask L.A.R.A. is off until you submit.</li></ul>' +
    '<div class="rm-qfoot"><span class="rm-qnote">' + rmIcon('check-circle') + 'You can change an answer until you submit.</span><button class="btn btn-primary" type="button" data-rm="quiz-start">Start quiz</button></div></section>';
  const run = '<section class="rm-qcard rm-q rm-qr"><div class="rm-qhead"><strong>' + RM_QUIZ.title + '</strong>' + rmTimer() + '</div><div class="rm-qbody"></div>' +
    '<div class="rm-qnote">' + rmIcon('cloud-slash') + 'Each answer is saved on this device as you pick it.</div><div class="rm-qnote">' + rmIcon('lock-key') + 'Ask L.A.R.A. is off during a quiz.</div></section>';
  const done = '<section class="rm-qcard rm-q rm-qd"><div class="rm-result"><svg class="rm-ring" viewBox="0 0 100 100" aria-hidden="true"><circle class="bg" cx="50" cy="50" r="40"/><circle class="fg" cx="50" cy="50" r="40" stroke-dasharray="201 251" transform="rotate(-90 50 50)"/></svg>' +
    '<div><h4 data-q-done-title>Your answers are in</h4><p>Sample result: 4 of 5. Nice work. Let us look at the one you missed together.</p></div></div>' +
    '<div class="rm-qnote"><span class="badge badge-synced rm-sv"><i class="ph ph-check-circle"></i> Saved</span><span class="badge badge-queued rm-qd-q"><i class="ph ph-clock"></i> Queued for sync</span>Your teacher sees it as soon as the Hub is reachable.</div>' +
    '<div class="rm-qfoot"><button class="btn btn-secondary" type="button" data-rm="go" data-screen="stream">Back to Stream</button></div></section>';
  const mon = '<div class="rm-qwrap wide"><button class="cr-link" type="button" data-rm="go" data-screen="stream" style="justify-self:start;padding-left:0">' + rmIcon('arrow-left') + 'Back to Stream</button>' +
    '<section class="rm-qcard"><div class="rm-qhead"><div><h3>' + RM_QUIZ.title + '</h3><div class="rm-qmeta" style="margin-top:8px"><span class="badge badge-neutral" data-qt-show="live">' + rmIcon('broadcast') + ' Live</span><span class="badge badge-neutral" data-qt-show="idle">' + rmIcon('hourglass') + ' Not started</span><span class="badge badge-neutral" data-qt-show="closed">' + rmIcon('lock') + ' Closed</span></div></div>' +
    '<div style="display:flex;align-items:center;gap:8px"><span data-qt-show="idle live">' + rmTimer() + '</span><button class="btn btn-primary" type="button" data-rm="quiz-open" data-qt-show="idle">Start quiz</button><button class="btn btn-secondary" type="button" data-rm="quiz-close" data-qt-show="live">Close quiz</button></div></div>' +
    '<div class="rm-stats"><div class="rm-stat"><strong data-qs-n="p">0</strong><span>In progress</span></div><div class="rm-stat"><strong data-qs-n="s">0</strong><span>Submitted</span></div><div class="rm-stat"><strong data-qs-n="n">27</strong><span>Not started</span></div></div>' +
    '<div class="rm-mon"></div><div class="rm-qnote">' + rmIcon('info') + 'Closing the quiz submits and grades everyone still answering. Building a quiz comes with the Classwork screens.</div></section>' + demo + '</div>';
  return '<div data-s="quiz"><div class="rm-wrap"><div data-only="learner"><div class="rm-qwrap">' + offline + intro + run + done + demo + '</div></div><div data-only="teacher">' + mon + '</div></div></div>';
}

function rmFmt(s) { return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }

function rmQuizTick(root) {
  if (!root._qEnd) return;
  const left = Math.max(0, Math.round((root._qEnd - Date.now()) / 1000));
  root.querySelectorAll('[data-q-time]').forEach(e => {
    e.textContent = rmFmt(left) + ' left';
    const p = e.closest('.rm-timer'); p.classList.toggle('warn', left <= 300 && left > 120); p.classList.toggle('crit', left <= 120);
  });
  if (left === 0) {
    clearInterval(root._qTimer);
    if (root.dataset.qs === 'run') rmQuizSubmit(root, true);
    if (root.dataset.qt === 'live') rmQuizClose(root);
  }
}

function rmQuizClock(root) {
  if (!root._qEnd || Date.now() >= root._qEnd) root._qEnd = Date.now() + (+root.dataset.time || 600) * 1000;
  clearInterval(root._qTimer); root._qTimer = setInterval(() => rmQuizTick(root), 1000); rmQuizTick(root);
}

function rmQuizRender(root) {
  const i = root._qIdx, qs = RM_QUIZ.questions, q = qs[i], ans = root._qAns, last = i === qs.length - 1;
  root.querySelector('.rm-qbody').innerHTML = '<div class="rm-dots" aria-hidden="true">' + qs.map((_, k) => '<i class="' + (k === i ? 'cur' : ans[k] !== undefined ? 'done' : '') + '"></i>').join('') + '</div>' +
    '<p class="rm-qcount">Question ' + (i + 1) + ' of ' + qs.length + '</p><p class="rm-qtext">' + q[0] + '</p>' +
    '<div class="rm-opts" role="radiogroup" aria-label="Answers">' + q[1].map((o, k) => '<button type="button" class="rm-opt" role="radio" data-rm="quiz-pick" data-k="' + k + '" aria-checked="' + (ans[i] === k) + '">' + (ans[i] === k ? '<i class="ph-fill ph-check-circle"></i>' : '<i class="ph ph-circle"></i>') + '<span>' + o + '</span></button>').join('') + '</div>' +
    '<div class="rm-qfoot"><button class="btn btn-secondary" type="button" data-rm="quiz-prev"' + (i === 0 ? ' disabled' : '') + '>Previous</button>' +
    (last ? '<span class="rm-qnote">' + ans.filter(a => a !== undefined).length + ' of ' + qs.length + ' answered</span><button class="btn btn-primary" type="button" data-rm="quiz-submit">Submit</button>' : '<button class="btn btn-primary" type="button" data-rm="quiz-next">Next</button>') + '</div>';
}

function rmQuizSubmit(root, timeUp) {
  clearInterval(root._qTimer);
  root.dataset.qs = 'done';
  root.querySelector('[data-q-done-title]').textContent = timeUp ? 'Time is up. Your answers were sent in' : 'Your answers are in';
  rmSync(root);
}

function rmQuizTeacher(root) {
  const t = root.dataset.qt, rows = RM_LEARNERS.map((l, k) => {
    const st = t === 'idle' ? ['n', 0] : t === 'closed' ? ['s', 5] : RM_LIVE[k];
    const badge = st[0] === 's' ? '<span class="badge badge-synced"><i class="ph ph-check-circle"></i> Submitted</span>' : st[0] === 'p' ? '<span class="badge badge-queued"><i class="ph ph-pencil-simple"></i> Answering</span>' : '<span class="badge badge-neutral"><i class="ph ph-hourglass"></i> Not started</span>';
    return '<div class="rm-lrow"><span class="avatar sm">' + l[0] + '</span><span class="nm">' + l[1] + '</span><span class="rm-prog" aria-hidden="true"><i style="width:' + st[1] * 20 + '%"></i></span><span class="cnt">' + st[1] + ' of 5</span>' + badge + '</div>';
  }).join('');
  root.querySelector('.rm-mon').innerHTML = rows;
  const n = t === 'idle' ? [0, 0, 27] : t === 'closed' ? [0, 27, 0] : [14, 9, 4];
  ['p', 's', 'n'].forEach((k, j) => { root.querySelector('[data-qs-n="' + k + '"]').textContent = n[j]; });
}

function rmQuizClose(root) { clearInterval(root._qTimer); root.dataset.qt = 'closed'; rmQuizTeacher(root); rmSync(root); }

function rmNote(kind, icon, text, when, screen) {
  return '<div class="rm-note"><button class="main" type="button" data-rm="go" data-screen="' + (screen || 'later') + '" data-label="' + text.replace(/^.*?: /, '') + '"><span class="ic ' + kind + '">' + rmIcon(icon) + '</span><span class="tx">Ms. Reyes posted a new ' + text + '<small>' + when + '</small></span></button>' + rmBtn('dots-three-vertical', 'More options') + '</div>';
}

function rmComments() {
  return '<div class="rm-comments"><div class="rm-comment"><span class="avatar sm blue">JD</span><div><strong>Juan</strong><small>Oct 5, 3:02 PM</small><br>Thank you po, Ma\'am! I will read it tonight.</div></div>' +
    '<button class="cr-link rm-add" type="button" data-rm="comment-toggle" style="justify-self:start">' + rmIcon('chat-text') + 'Add comment</button>' +
    '<div class="rm-reply" hidden><span class="avatar sm"><span data-only="learner">AS</span><span data-only="teacher">MR</span></span><input class="form-input" placeholder="Add a class comment" aria-label="Add a class comment">' + rmBtn('paper-plane-tilt', 'Send comment', ' data-rm="comment-send"') + '</div></div>';
}

function rmLite(inner, role) { return '<div class="rm rm-lite" data-role="' + role + '" data-state="normal">' + inner + '</div>'; }

function rmCardPreview() {
  return '<div class="rm-lite-grid">' + rmLite(rmCard(CR_CLASSES[0], 0), 'learner') + rmLite(rmCard(CR_CLASSES[3], 3), 'learner') + rmLite(rmCard(CR_CLASSES[0], 0), 'teacher') + '</div>';
}

function rmPostPreview() {
  return '<div style="width:100%;max-width:760px;margin:0 auto">' + rmLite(rmNote('quiz', 'timer', 'quiz: Pagsusulit #2: Parts of a Leaf', 'Oct 6, 8:30 AM', 'later') + rmAnnouncement('MR', 'Ms. Reyes', 'Oct 5, 2:15 PM', 'Good morning, class! Please read Handout #2 about the parts of a leaf before Friday. We will have a short quiz. You can do it!', rmComments()), 'learner') + '</div>';
}

function rmAnnouncement(init, who, when, body, tail) {
  return '<article class="rm-post"><header class="rm-post-head"><span class="avatar">' + init + '</span><div class="who">' + who + '<small>' + when + '</small></div>' + rmBtn('dots-three-vertical', 'Announcement options') + '</header>' +
    '<div class="rm-post-body">' + body + '</div>' + (tail || '') + '</article>';
}

function rmStream() {
  const c = CR_SCI;
  const note = rmNote;
  const comments = rmComments();
  const feed = '<div class="rm-feed rm-has">' +
    note('quiz', 'timer', 'quiz: Pagsusulit #2: Parts of a Leaf', 'Oct 6, 8:30 AM', 'quiz') +
    note('material', 'book-open', 'material: Handout #2: Parts of a Leaf', 'Oct 5, 2:20 PM') +
    '<div class="rm-posts">' + rmAnnouncement('MR', 'Ms. Reyes', 'Oct 5, 2:15 PM', 'Good morning, class! Please read Handout #2 about the parts of a leaf before Friday. We will have a short quiz. You can do it!', comments) + '</div></div>';
  const empty = '<section class="rm-empty rm-feed-empty" aria-label="Nothing posted yet"><span class="art">' + rmIcon('chat-circle-dots') + '</span><div><h4>This is where you can talk to your class</h4><p data-only="teacher">Use the stream to share announcements, post assignments and answer learners\' questions.</p><p data-only="learner">When your teacher posts something, you will see it here.</p></div></section>';
  const skel = '<div class="rm-skel" aria-hidden="true"><i style="height:72px"></i><i style="height:72px"></i><i style="height:153px"></i></div>';
  const aside = '<div class="rm-aside"><div class="rm-sc" data-only="teacher"><h4>Class code ' + rmBtn('dots-three-vertical', 'More options for class code') + '</h4><span class="code">K7M-4QX</span><p>Learners type this to ask to join. You approve each one.</p></div>' +
    '<div class="rm-sc"><h4>Upcoming</h4><p class="rm-has"><span data-only="learner">Pagsusulit #2 is due Fri, Oct 9.</span><span data-only="teacher">No work due soon</span></p><p class="rm-empty-up" style="display:none">Woohoo, no work due soon!</p><button class="cr-link" type="button" style="padding-left:0" data-rm="go" data-screen="later" data-label="To-do">View all</button></div></div>';
  const bar = '<div class="rm-bar" data-only="teacher"><button class="rm-tonal" type="button" data-rm="open-compose">' + rmIcon('pencil-simple') + 'New announcement</button><button class="cr-link" type="button" data-rm="go" data-screen="later" data-label="Repost">' + rmIcon('repeat') + 'Repost</button></div>';
  const tabs = '<div data-s="stream later"><div class="rm-tabs" role="tablist" aria-label="Class sections">' +
    [['stream', 'Stream', ''], ['classwork', 'Classwork', ''], ['people', 'People', ''], ['grades', 'Grades', 'teacher']].map(t => '<button class="rm-tab" role="tab" type="button" data-rm="go" data-tab="' + t[0] + '" data-screen="' + (t[0] === 'stream' ? 'stream' : 'later') + '" data-label="' + t[1] + '"' + (t[2] ? ' data-only="teacher"' : '') + ' aria-selected="' + (t[0] === 'stream') + '">' + t[1] + '</button>').join('') +
    '<span class="cr-spacer"></span><span data-only="teacher">' + rmBtn('gear', 'Class settings', ' data-rm="go" data-screen="later" data-label="Class settings"') + '</span></div></div>';
  const stream = '<div data-s="stream"><div class="rm-wrap wide"><div class="rm-offline">' + rmIcon('wifi-slash') + 'Hub not reachable. You are seeing what is saved on this device.</div>' +
    '<div class="rm-banner"><span class="subj" aria-hidden="true"><i class="ph ph-' + c.icon + '" data-rm-icon></i></span><h2 data-rm-name>' + c.name + '</h2><p data-rm-sec>' + c.section + '</p>' +
    '<span data-only="teacher"><button class="rm-tonal rm-custom" type="button" data-rm="go" data-screen="later" data-label="Customize">' + rmIcon('pencil-simple') + 'Customize</button></span>' +
    '<button class="cr-icon rm-info" type="button" aria-label="View class information">' + rmIcon('info') + '</button></div>' +
    '<div class="rm-cols">' + aside + '<div>' + bar + feed + empty + skel + '</div></div></div></div>';
  const later = '<div data-s="later"><div class="rm-wrap"><section class="rm-empty" style="display:flex" aria-live="polite"><span class="art">' + rmIcon('hammer') + '</span><div><h4 data-rm-later>Next slice</h4><p>Only Home and Stream are in this first slice. This screen comes after you approve it.</p>' +
    '<button class="rm-tonal" type="button" style="margin-top:12px" data-rm="go" data-screen="home">' + rmIcon('house') + 'Back to Home</button></div></section></div></div>';
  return tabs + stream + later;
}

function rmModal() {
  return '<div class="rm-modal" hidden><div class="rm-dialog" role="dialog" aria-modal="true" aria-label="Announcement"><h3>Announcement</h3>' +
    '<div class="meta"><span class="badge badge-neutral"><i class="ph ph-chalkboard-teacher"></i> <span data-rm-name>Science 4</span></span><span class="badge badge-neutral"><i class="ph ph-users"></i> All learners</span></div>' +
    '<textarea class="form-input" aria-label="Announce something to your class" placeholder="Announce something to your class"></textarea>' +
    '<div class="meta">' + rmBtn('paperclip', 'Attach a file') + rmBtn('link', 'Add link') + '</div>' +
    '<footer><span class="hint rm-offhint" hidden>Waiting for the Hub. Posting needs the classroom network.</span><button class="btn btn-secondary" type="button" data-rm="close-compose">Cancel</button><button class="btn btn-primary" type="button" data-rm="post">Post</button></footer></div></div>';
}

function rmApp() {
  const top = '<header class="rm-top">' + rmBtn('list', 'Main menu', ' data-rm="toggle-nav" aria-expanded="true"') + '<span class="doc-brand-badge">L.A.R.A.</span>' +
    '<div class="rm-crumb"><i class="ph ph-caret-right"></i><div><strong data-rm-name>' + CR_SCI.name + '</strong><small data-rm-sec>' + CR_SCI.section + '</small></div></div><span class="cr-spacer"></span>' +
    '<span class="rm-hub"><span class="on"><i class="ph ph-broadcast"></i> Connected to Hub</span><span class="off"><i class="ph ph-wifi-slash"></i> Not connected to Hub</span></span>' +
    rmBtn('plus', 'Join or create a class') + '<span class="cr-icon" style="cursor:default"><span class="avatar sm" data-only="learner">AS</span><span class="avatar sm" data-only="teacher">MR</span></span></header>';
  return crSwitch(CR_VIEWS) + crSwitch(RM_STATES, 'State', 'state') + crSwitch(RM_TIMES, 'Quiz clock starts at', 'time') +
    '<div class="rm" data-role="learner" data-state="normal" data-screen="home" data-cls="0" data-tab="stream" data-qs="intro" data-qt="idle" data-time="600">' + top +
    '<div class="rm-body"><nav class="rm-drawer" aria-label="Classes">' + rmDrawer() + '</nav><div class="rm-sheet">' + rmStream() + rmHome() + rmQuiz() + '</div></div>' + rmModal() + '</div>';
}

/* Remake slice: Home and Stream behave like a small app (desktop) */
function rmSync(root) {
  const s = root.dataset.screen, c = root.dataset.cls, k = CR_CLASSES[+c];
  root.querySelectorAll('.rm-nav').forEach(n => {
    const on = n.dataset.id === 'home' ? s === 'home' : n.dataset.id === 'class' && s !== 'home' && n.dataset.cls === c;
    n.classList.toggle('active', on);
    if (on) n.setAttribute('aria-current', 'page'); else n.removeAttribute('aria-current');
  });
  root.querySelectorAll('[data-rm-name]').forEach(e => { e.textContent = k.name; });
  root.querySelectorAll('[data-rm-sec]').forEach(e => { e.textContent = k.section; });
  root.querySelectorAll('[data-rm-icon]').forEach(e => { e.className = 'ph ph-' + k.icon; });
  root.querySelectorAll('.rm-tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab === (s === 'stream' ? 'stream' : root.dataset.tab))));
  root.querySelector('.rm-offhint').hidden = root.dataset.state !== 'offline';
  root.querySelector('.rm-modal [data-rm="post"]').disabled = root.dataset.state === 'offline';
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-rm], [data-cr-state], [data-cr-role], [data-cr-time]');
  const root = t && t.closest('.rm') || (t && t.closest('.preview-card') && t.closest('.preview-card').querySelector('.rm'));
  if (!t || !root) return;
  if (!t.dataset.rm) { if (t.dataset.crTime) root.dataset.time = t.dataset.crTime; setTimeout(() => rmSync(root), 0); return; }
  const a = t.dataset.rm;
  if (a === 'go') {
    root.dataset.screen = t.dataset.screen;
    if (t.dataset.cls !== undefined) root.dataset.cls = t.dataset.cls;
    if (t.dataset.tab) root.dataset.tab = t.dataset.tab;
    if (t.dataset.screen === 'quiz') rmQuizTeacher(root);
    if (t.dataset.label) root.querySelector('[data-rm-later]').textContent = t.dataset.label + ' is the next slice';
    rmSync(root);
  } else if (a === 'quiz-start') {
    rmQuizClock(root); root._qAns = []; root._qIdx = 0; root.dataset.qs = 'run'; rmQuizRender(root); rmSync(root);
  } else if (a === 'quiz-pick') {
    root._qAns[root._qIdx] = +t.dataset.k; rmQuizRender(root);
  } else if (a === 'quiz-next' || a === 'quiz-prev') {
    root._qIdx += a === 'quiz-next' ? 1 : -1; rmQuizRender(root);
  } else if (a === 'quiz-submit') {
    rmQuizSubmit(root, false);
  } else if (a === 'quiz-open') {
    rmQuizClock(root); root.dataset.qt = 'live'; rmQuizTeacher(root);
  } else if (a === 'quiz-close') {
    rmQuizClose(root);
  } else if (a === 'quiz-reset') {
    clearInterval(root._qTimer); root._qEnd = 0; root.dataset.qs = 'intro'; root.dataset.qt = 'idle'; rmQuizTeacher(root);
    root.querySelectorAll('[data-q-time]').forEach(e => { e.textContent = rmFmt(+root.dataset.time || 600) + ' left'; e.closest('.rm-timer').classList.remove('warn', 'crit'); });
  } else if (a === 'toggle-nav') {
    const rail = root.dataset.nav !== 'rail'; root.dataset.nav = rail ? 'rail' : ''; t.setAttribute('aria-expanded', String(!rail));
  } else if (a === 'open-compose') {
    rmSync(root); root.querySelector('.rm-modal').hidden = false; root.querySelector('.rm-modal textarea').focus();
  } else if (a === 'close-compose') {
    root.querySelector('.rm-modal').hidden = true;
  } else if (a === 'post') {
    const ta = root.querySelector('.rm-modal textarea'), text = ta.value.trim();
    if (!text) { ta.focus(); return; }
    const box = document.createElement('div'); box.textContent = text;
    root.querySelector('.rm-posts').insertAdjacentHTML('afterbegin', rmAnnouncement('MR', 'Ms. Reyes', 'Just now', box.innerHTML));
    ta.value = ''; root.querySelector('.rm-modal').hidden = true;
  } else if (a === 'comment-toggle') {
    const r = t.closest('.rm-comments').querySelector('.rm-reply'); r.hidden = !r.hidden; if (!r.hidden) r.querySelector('input').focus();
  } else if (a === 'comment-send') {
    const inp = t.closest('.rm-reply').querySelector('input'), text = inp.value.trim();
    if (!text) { inp.focus(); return; }
    const box = document.createElement('div'); box.textContent = text;
    const who = root.dataset.role === 'teacher' ? ['MR', 'Ms. Reyes', ''] : ['AS', 'Ana', 'blue'];
    const badge = root.dataset.state === 'offline' ? '<span class="badge badge-queued"><i class="ph ph-clock"></i> Queued for sync</span>' : '<span class="badge badge-synced"><i class="ph ph-check-circle"></i> Saved</span>';
    t.closest('.rm-comments').querySelector('.rm-add').insertAdjacentHTML('beforebegin', '<div class="rm-comment"><span class="avatar sm ' + who[2] + '">' + who[0] + '</span><div><strong>' + who[1] + '</strong><small>Just now</small> ' + badge + '<br>' + box.innerHTML + '</div></div>');
    inp.value = '';
  }
});

const app = document.getElementById('app');
app.innerHTML = rmApp();
const rm = app.querySelector('.rm');
/* rmApp() puts the switches above the app; move them into the floating bar so the app fills the window */
const bar = document.querySelector('.pv-bar');
app.querySelectorAll('.cr-switch').forEach(x => bar.appendChild(x));
function applyRoleState(root) {
  root.querySelectorAll('[data-only]').forEach(el => { el.hidden = !el.dataset.only.split(' ').includes(root.dataset.role); });
}
bar.addEventListener('click', e => {
  const b = e.target.closest('.seg-item'); if (!b) return;
  b.parentElement.querySelectorAll('.seg-item').forEach(x => { x.classList.remove('active'); x.setAttribute('aria-selected', 'false'); });
  b.classList.add('active'); b.setAttribute('aria-selected', 'true');
  if (b.dataset.crRole) rm.dataset.role = b.dataset.crRole;
  if (b.dataset.crState) rm.dataset.state = b.dataset.crState;
  if (b.dataset.crTime) rm.dataset.time = b.dataset.crTime;
  applyRoleState(rm); rmSync(rm);
});
applyRoleState(rm); rmSync(rm);
</script>
