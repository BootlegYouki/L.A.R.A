openapi: 3.1.0
info:
  title: Proposed Hub operational activity history (#367)
  version: 0.1.0-draft
  description: |
    Review artifact only. This endpoint is NOT in the canonical contracts/openapi.yaml,
    is NOT implemented, and must not be used by feature code until the approved
    contract is promoted and merged. Normative proposed behavior is in README.md.
security:
  - bearerAuth: []
paths:
  /api/admin/activity-logs:
    get:
      summary: Read private operational history on the Hub PC (ADMIN only)
      tags: [admin]
      description: |
        Authenticate first (401), require ADMIN (403 FORBIDDEN), then require
        Hub-PC loopback without tunnel forwarding (403 ADMIN_LOCAL_ONLY).
        Reject invalid parameters with 400 BAD_REQUEST. Never cache responses.
        All sequence values are independent of the classroom sync cursor.
        See README.md for stable pagination, filtering and retention semantics.
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 100}
        - name: before_seq
          in: query
          description: Exclusive older-page boundary; mutually exclusive with after_seq.
          schema: {type: integer, minimum: 1, maximum: 9007199254740991}
        - name: after_seq
          in: query
          description: Exclusive new-event boundary; mutually exclusive with before_seq.
          schema: {type: integer, minimum: 0, maximum: 9007199254740991}
        - name: snapshot_seq
          in: query
          description: Inclusive high-water boundary returned by the first page; fixed while draining pages.
          schema: {type: integer, minimum: 0, maximum: 9007199254740991}
        - name: history_id
          in: query
          description: Required with sequence parameters; mismatch after database initialization/restore answers 409 ACTIVITY_LOG_RESET.
          schema: {type: string, format: uuid}
        - name: from_time
          in: query
          description: Inclusive epoch milliseconds; must be less than to_time when both are provided.
          schema: {type: integer, minimum: 0, maximum: 9007199254740991}
        - name: to_time
          in: query
          description: Exclusive epoch milliseconds.
          schema: {type: integer, minimum: 0, maximum: 9007199254740991}
        - name: severity
          in: query
          schema: {$ref: './schemas.json#/$defs/ActivitySeverity'}
        - name: q
          in: query
          description: Case-insensitive literal search over safe event/service/reason/result labels; not raw error text.
          schema: {type: string, maxLength: 64}
      responses:
        '200':
          description: Newest-first entries and stable sequence boundaries; no-store.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: './schemas.json#/$defs/ActivityLogPage'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503':
          description: History cannot be read; ACTIVITY_LOG_UNAVAILABLE. Other Hub features remain usable.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: {type: string, enum: [BAD_REQUEST, UNAUTHORIZED, FORBIDDEN, ADMIN_LOCAL_ONLY, ACTIVITY_LOG_UNAVAILABLE, ACTIVITY_LOG_RESET]}
            message: {type: string}
  responses:
    Error:
      description: Standard safe Error envelope; messages contain no private payloads.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
