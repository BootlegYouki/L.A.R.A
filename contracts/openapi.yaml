openapi: 3.1.0
info:
  title: L.A.R.A Local Hub REST API
  description: |
    Offline-first LAN classroom management and assessment API for Philippine public schools (Grades 1 to 12).

    Conventions (see contracts/naming_rules.md):
    - All JSON keys are snake_case. All timestamps are epoch milliseconds (integer).
    - All routes except /download, /api/auth/register and /api/auth/login require `Authorization: Bearer <token>`.
    - Errors always use the Error envelope: {"error": {"code": "...", "message": "..."}}.
    - correct_answer is returned ONLY to the teacher who owns the quiz. Student responses never contain it.
    - Realtime events are on ws://{hub_ip}:8081 (see contracts/events/README.md).
  version: 1.1.0
servers:
  - url: http://{hub_ip}:8080
    description: Local Hub Server
    variables:
      hub_ip:
        default: 192.168.1.50
security:
  - bearerAuth: []

paths:
  /download:
    get:
      summary: Captive download portal for client APK and desktop installers
      security: []
      tags: [portal]
      responses:
        "200":
          description: HTML portal page or binary application package
          content:
            text/html:
              schema:
                type: string

  # ---------------------------------------------------------------- AUTH
  /api/auth/register:
    post:
      summary: Self-register a learner account (teacher accounts are created by the Hub admin)
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lrn_or_id, full_name, pin]
              properties:
                lrn_or_id:
                  type: string
                  example: "123456789012"
                full_name:
                  type: string
                  example: "Juan dela Cruz"
                pin:
                  type: string
                  pattern: "^[0-9]{4}$"
      responses:
        "200":
          description: Account created and session opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "409":
          $ref: "#/components/responses/Error"

  /api/auth/login:
    post:
      summary: Log in with LRN/ID and 4-digit PIN
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lrn_or_id, pin]
              properties:
                lrn_or_id:
                  type: string
                pin:
                  type: string
                  pattern: "^[0-9]{4}$"
      responses:
        "200":
          description: Session opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/Error"

  /api/auth/logout:
    post:
      summary: Close the current session
      tags: [auth]
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  # ---------------------------------------------------------------- ADMIN (Hub console only)
  /api/admin/setup:
    post:
      summary: First run only. Create the single Hub admin account (lrn_or_id ADMIN-0001, role ADMIN) with the PIN typed on the Hub PC. Accepted only from the Hub machine itself (loopback). Answers 409 ADMIN_EXISTS once an admin exists; after that the Hub window signs in through /api/auth/login.
      tags: [admin]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, pin]
              properties:
                full_name:
                  type: string
                pin:
                  type: string
                  pattern: "^[0-9]{4}$"
      responses:
        "200":
          description: Signed-in admin session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "409":
          $ref: "#/components/responses/Error"

  /api/admin/users:
    get:
      summary: List all accounts (admin)
      tags: [admin]
      responses:
        "200":
          description: All users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      summary: Create a teacher or learner account (admin)
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lrn_or_id, full_name, role, pin]
              properties:
                lrn_or_id:
                  type: string
                full_name:
                  type: string
                role:
                  type: string
                  enum: ["TEACHER", "STUDENT"]
                pin:
                  type: string
                  pattern: "^[0-9]{4}$"
      responses:
        "200":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /api/admin/users/{id}/reset-pin:
    post:
      summary: Reset a user PIN (admin)
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin:
                  type: string
                  pattern: "^[0-9]{4}$"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  # ---------------------------------------------------------------- CLASSROOMS
  /api/classrooms:
    get:
      summary: List classrooms visible to the caller (teacher - owned or co-taught; learner - ACTIVE and PENDING enrollments)
      tags: [classrooms]
      responses:
        "200":
          description: List of classrooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Classroom"
    post:
      summary: Create a classroom and generate its 6-character Class Code (teacher)
      tags: [classrooms]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, section]
              properties:
                name:
                  type: string
                  example: "Science 4"
                section:
                  type: string
                  example: "Aguinaldo"
      responses:
        "200":
          description: Created classroom
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Classroom"

  /api/classrooms/join:
    post:
      summary: Request to enroll in a classroom using a 6-character Class Code
      tags: [classrooms]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [class_code]
              properties:
                class_code:
                  type: string
                  pattern: "^[A-HJ-NP-Z2-9]{6}$"
                  description: Uppercase, no 0/O/1/I. Clients strip the display hyphen before sending.
                  example: "K7M4QX"
      responses:
        "200":
          description: Enrollment status receipt. Teacher sessions receive EVENT_JOIN_REQUEST.
          content:
            application/json:
              schema:
                type: object
                required: [status, classroom_id]
                properties:
                  status:
                    type: string
                    enum: ["PENDING", "ACTIVE", "REJECTED", "REMOVED"]
                  classroom_id:
                    type: string
                    format: uuid
        "404":
          $ref: "#/components/responses/Error"

  /api/classrooms/{id}:
    patch:
      summary: Rename a class or archive it (owning teacher only). An archived class is read-only for everyone and keeps all its grades.
      tags: [classrooms]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                section:
                  type: string
                archived:
                  type: boolean
      responses:
        "200":
          description: Updated classroom
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Classroom"

  /api/classrooms/{id}/remove:
    post:
      summary: Remove an ACTIVE learner from the class (teacher). The enrollment becomes REMOVED, the learner gets EVENT_JOIN_APPROVAL with status REMOVED and loses access; their submissions and scores are kept on the Hub.
      tags: [classrooms]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        $ref: "#/components/requestBodies/StudentRef"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/classrooms/{id}/teachers:
    post:
      summary: Add a co-teacher by their teacher ID (owning teacher only). A co-teacher can do everything in the class except rename, archive or manage teachers.
      tags: [classrooms]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lrn_or_id]
              properties:
                lrn_or_id:
                  type: string
      responses:
        "200":
          description: Updated classroom
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Classroom"

  /api/classrooms/{id}/teachers/{teacher_id}:
    delete:
      summary: Remove a co-teacher (owning teacher only)
      tags: [classrooms]
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: teacher_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/classrooms/{id}/roster:
    get:
      summary: Enrollment roster with status (teacher)
      tags: [classrooms]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Roster
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RosterEntry"

  /api/classrooms/{id}/approve:
    post:
      summary: Approve a pending enrollment (teacher). Emits EVENT_JOIN_APPROVAL to the learner.
      tags: [classrooms]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        $ref: "#/components/requestBodies/StudentRef"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/classrooms/{id}/reject:
    post:
      summary: Reject a pending enrollment (teacher). Emits EVENT_JOIN_APPROVAL with status REJECTED.
      tags: [classrooms]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        $ref: "#/components/requestBodies/StudentRef"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  # ---------------------------------------------------------------- SYNC
  /api/sync/pull:
    post:
      summary: Delta-sync pull (cursor based) for the caller's ACTIVE classrooms
      description: |
        The cursor is a strictly increasing integer from the Hub's change ledger (`sync_revisions.seq`), never a clock time.
        First sync: send cursor 0 and no hub_id. Afterwards send the last `next_cursor` plus the `hub_id` and `sync_epoch` you stored.
        If they do not match the Hub (different school Hub, restored backup), the response has `reset: true`: wipe the
        mirrored tables (keep rows still QUEUED_FOR_SYNC) and apply the response, which then starts from cursor 0.
        Commit the whole response and the new cursor in ONE local transaction.
      tags: [sync]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cursor]
              properties:
                cursor:
                  type: integer
                  minimum: 0
                hub_id:
                  type: string
                sync_epoch:
                  type: integer
      responses:
        "200":
          description: Records changed after the cursor, plus tombstones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncPullResponse"

  /api/sync/push:
    post:
      summary: Delta-sync push for queued offline work (quiz attempts, stream comments, private comments)
      tags: [sync]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quiz_attempts:
                  type: array
                  items:
                    $ref: "#/components/schemas/QuizAttemptPush"
                comments:
                  type: array
                  items:
                    $ref: "#/components/schemas/CommentPush"
                private_comments:
                  type: array
                  items:
                    $ref: "#/components/schemas/PrivateCommentPush"
      responses:
        "200":
          description: Per-item receipts. Homework photos are uploaded separately via /api/assignments/{id}/submit.
          content:
            application/json:
              schema:
                type: object
                required: [acknowledged, receipts]
                properties:
                  acknowledged:
                    type: boolean
                  receipts:
                    type: array
                    items:
                      type: object
                      required: [id, status]
                      properties:
                        id:
                          type: string
                        status:
                          type: string
                          enum: ["SYNCED", "REJECTED"]
                        reason:
                          type: string
                          description: e.g. TIME_LIMIT_EXCEEDED

  # ---------------------------------------------------------------- STREAM
  /api/topics:
    post:
      summary: Create a topic that groups classwork, for example "Unit 1 - Plants" (teacher)
      tags: [classwork]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [classroom_id, name]
              properties:
                classroom_id:
                  type: string
                  format: uuid
                name:
                  type: string
      responses:
        "200":
          description: Created topic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topic"

  /api/topics/{id}:
    patch:
      summary: Rename or reorder a topic (teacher)
      tags: [classwork]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                order_index:
                  type: integer
      responses:
        "200":
          description: Updated topic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topic"
    delete:
      summary: Delete a topic (teacher). Its materials, assignments and quizzes stay and lose their topic_id. Produces a DELETE tombstone in sync.
      tags: [classwork]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/announcements:
    post:
      summary: Post an announcement to a classroom stream (teacher). Emits EVENT_ANNOUNCEMENT_PUSH.
      tags: [stream]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [classroom_id, title, content]
              properties:
                classroom_id:
                  type: string
                  format: uuid
                title:
                  type: string
                content:
                  type: string
                allow_comments:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Created announcement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"

  /api/announcements/{id}:
    patch:
      summary: Edit an announcement or toggle comments (teacher)
      tags: [stream]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                content:
                  type: string
                allow_comments:
                  type: boolean
      responses:
        "200":
          description: Updated announcement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
    delete:
      summary: Delete an announcement (teacher). Produces a DELETE tombstone in sync.
      tags: [stream]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/announcements/{id}/comments:
    get:
      summary: Retrieve comments for a specific announcement (members of the class only, else 403)
      tags: [stream]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: List of announcement comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
    post:
      summary: Post a comment on an announcement (members of the class only; rejected with 403 COMMENTS_DISABLED when allow_comments is false)
      tags: [stream]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
      responses:
        "200":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  # ---------------------------------------------------------------- MATERIALS
  /api/materials:
    post:
      summary: Upload a lesson file, or an attachment for an assignment or announcement (teacher). Max 250 MB. PDF/DOCX are text-chunked on upload.
      tags: [materials]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [classroom_id, title, file_type, file]
              properties:
                classroom_id:
                  type: string
                  format: uuid
                title:
                  type: string
                file_type:
                  type: string
                  enum: ["VIDEO", "DOCUMENT", "WORKSHEET"]
                topic_id:
                  type: string
                  format: uuid
                assignment_id:
                  type: string
                  format: uuid
                  description: Set to attach this file to an assignment. It then shows on that assignment, not in the Classwork list.
                announcement_id:
                  type: string
                  format: uuid
                  description: Set to attach this file to an announcement.
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Created material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Material"
        "413":
          $ref: "#/components/responses/Error"

  /api/materials/{id}:
    patch:
      summary: Rename a material or move it to a topic (teacher)
      tags: [materials]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                topic_id:
                  type: [string, "null"]
                  format: uuid
      responses:
        "200":
          description: Updated material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Material"
    delete:
      summary: Delete a material and its lesson chunks (teacher). Produces a DELETE tombstone in sync; clients remove the cached file.
      tags: [materials]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/materials/{id}/download:
    get:
      summary: Download the full material file
      tags: [materials]
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/TokenQuery"
      responses:
        "200":
          description: File bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /api/materials/{id}/chunks:
    get:
      summary: Pre-extracted lesson text chunks for Socratic grounding
      tags: [materials]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Ordered chunks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaterialChunk"

  /api/materials/{id}/stream:
    get:
      summary: HTTP 206 Byte-Range streaming for educational videos (max 2.0 MB/s per client)
      tags: [materials]
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/TokenQuery"
        - name: Range
          in: header
          required: false
          schema:
            type: string
            example: "bytes=0-1048576"
      responses:
        "206":
          description: Partial video content
        "200":
          description: Full video content

  # ---------------------------------------------------------------- AI MODEL FILE
  /api/model:
    get:
      summary: Describe the on-device AI model file this Hub offers (any signed-in user). It may be a smaller model than the one the Hub itself runs. Models are chosen by the AI evaluation (rules/socratic-ai-guardrails.md section 5).
      tags: [model]
      responses:
        "200":
          description: "The Hub ships with the model installed. `available` is false only if the model file is missing or failed to load."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelOffer"

  /api/model/file:
    get:
      summary: Resumable download of the model file (HTTP Range, max 2.0 MB/s per client). Clients verify `sha256` from /api/model after the last byte.
      tags: [model]
      parameters:
        - $ref: "#/components/parameters/TokenQuery"
        - name: Range
          in: header
          required: false
          schema:
            type: string
            example: "bytes=1048576-"
      responses:
        "206":
          description: Partial model file
        "200":
          description: Full model file
        "404":
          description: NOT_FOUND when the Hub has no model file configured
        "416":
          description: Range outside the file

  # ---------------------------------------------------------------- ASSIGNMENTS
  /api/assignments:
    post:
      summary: Create an assignment (teacher)
      tags: [assignments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [classroom_id, title, max_points, due_date]
              properties:
                classroom_id:
                  type: string
                  format: uuid
                title:
                  type: string
                instructions:
                  type: string
                max_points:
                  type: integer
                due_date:
                  type: integer
                allow_late:
                  type: boolean
                  default: false
                topic_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Created assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"

  /api/assignments/{id}:
    patch:
      summary: Edit an assignment (teacher)
      tags: [assignments]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                instructions:
                  type: string
                max_points:
                  type: integer
                due_date:
                  type: integer
                allow_late:
                  type: boolean
                topic_id:
                  type: [string, "null"]
                  format: uuid
      responses:
        "200":
          description: Updated assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
    delete:
      summary: Remove an assignment posted by mistake (teacher). The Hub archives it (rows and any grades are kept, never destroyed), hides it from the gradebook and export, and sends clients a DELETE tombstone.
      tags: [assignments]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/assignments/{id}/private-comments:
    get:
      summary: Private comments between one learner and the class teachers on this assignment. A learner gets their own thread; a teacher must pass student_id.
      tags: [assignments]
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: student_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Comments, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PrivateComment"
    post:
      summary: Add a private comment. A learner posts to their own thread; a teacher must send student_id. Classmates never see it.
      tags: [assignments]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                student_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivateComment"

  /api/assignments/{id}/submit:
    post:
      summary: Upload a homework photo or document (learner). Idempotent on (assignment_id, student_id); a resubmission replaces the file.
      tags: [assignments]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [submission_id, file]
              properties:
                submission_id:
                  type: string
                  format: uuid
                  description: Client-generated id so offline retries are idempotent
                file:
                  type: string
                  format: binary
                  description: JPEG up to ~800 KB for photos
      responses:
        "200":
          description: Stored submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"

  /api/assignments/{id}/submissions:
    get:
      summary: List learner submissions for an assignment (teacher)
      tags: [assignments]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Submission"

  /api/submissions/{id}:
    patch:
      summary: Grade a submission with score and feedback (teacher)
      tags: [assignments]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                score:
                  type: integer
                teacher_feedback:
                  type: string
      responses:
        "200":
          description: Updated submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"

  /api/submissions/{id}/file:
    get:
      summary: Fetch the stored submission image or document (teacher or owning learner)
      tags: [assignments]
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/TokenQuery"
      responses:
        "200":
          description: File bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  # ---------------------------------------------------------------- QUIZZES
  /api/quizzes:
    post:
      summary: Create a quiz with questions and answer keys (teacher)
      tags: [quizzes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherQuizInput"
      responses:
        "200":
          description: Created quiz in DRAFT status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherQuiz"

  /api/quizzes/active:
    get:
      summary: Fetch the currently active quiz for the caller's classrooms (ANSWER KEYS STRIPPED)
      tags: [quizzes]
      responses:
        "200":
          description: Active quiz payload without correct_answer fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentQuizResponse"
        "404":
          $ref: "#/components/responses/Error"

  /api/quizzes/{id}:
    get:
      summary: Fetch a quiz. Learners get the redacted payload; the owning teacher gets correct_answer.
      tags: [quizzes]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Quiz payload
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StudentQuizResponse"
                  - $ref: "#/components/schemas/TeacherQuiz"
    patch:
      summary: Replace a quiz's settings and questions while it is still DRAFT (teacher). Answers 409 QUIZ_NOT_DRAFT once the quiz has started, so scores stay fair.
      tags: [quizzes]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherQuizInput"
      responses:
        "200":
          description: Updated quiz
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherQuiz"
        "409":
          $ref: "#/components/responses/Error"

  /api/quizzes/{id}/start:
    post:
      summary: Activate the quiz and broadcast EVENT_QUIZ_START (teacher)
      tags: [quizzes]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Authoritative start time
          content:
            application/json:
              schema:
                type: object
                required: [started_at, duration_seconds]
                properties:
                  started_at:
                    type: integer
                  duration_seconds:
                    type: integer

  /api/quizzes/{id}/begin:
    post:
      summary: Learner begins the active quiz. Creates the IN_PROGRESS attempt that triggers the AI lockout.
      tags: [quizzes]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Attempt opened
          content:
            application/json:
              schema:
                type: object
                required: [attempt_id, started_at]
                properties:
                  attempt_id:
                    type: string
                    format: uuid
                  started_at:
                    type: integer

  /api/quizzes/{id}/close:
    post:
      summary: Close the quiz and broadcast EVENT_QUIZ_CLOSED (teacher). Unsubmitted attempts are auto-submitted. Closing also releases held scores (release_scores_immediately false) - each learner gets EVENT_GRADE_CONFIRMED and the score on the next pull.
      tags: [quizzes]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/quizzes/{id}/submit:
    post:
      summary: Submit learner answers for instant auto-grading. Emits EVENT_GRADE_CONFIRMED unless scores are held; then the receipt's score is null until the teacher closes the quiz.
      tags: [quizzes]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [started_at, submitted_at, answers]
              properties:
                started_at:
                  type: integer
                submitted_at:
                  type: integer
                answers:
                  type: array
                  items:
                    $ref: "#/components/schemas/Answer"
      responses:
        "200":
          description: Graded receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GradeReceipt"
        "422":
          $ref: "#/components/responses/Error"

  /api/quizzes/{id}/results:
    get:
      summary: Live and final results matrix for all learners (teacher)
      tags: [quizzes]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: One row per enrolled learner
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [student_id, full_name, status]
                  properties:
                    student_id:
                      type: string
                      format: uuid
                    full_name:
                      type: string
                    status:
                      type: string
                      enum: ["NOT_STARTED", "IN_PROGRESS", "SUBMITTED"]
                    score:
                      type: integer
                    total_points:
                      type: integer

  # ---------------------------------------------------------------- EXPORT & BACKUP
  /api/export/class-record:
    post:
      summary: Export the gradebook (.xlsx or .csv) with learners by work and points to a mounted USB path or as a download (teacher / Hub console)
      tags: [export]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [classroom_id, format]
              properties:
                classroom_id:
                  type: string
                  format: uuid
                format:
                  type: string
                  enum: ["XLSX", "CSV"]
                target_path:
                  type: string
                  description: Mounted USB path. When omitted the file is returned as the response body.
      responses:
        "200":
          description: Export result
          content:
            application/json:
              schema:
                type: object
                required: [file_name]
                properties:
                  file_name:
                    type: string
                  saved_to:
                    type: string

  /api/backup:
    post:
      summary: Create a .lara-backup snapshot on the given path (Hub console)
      tags: [export]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_path]
              properties:
                target_path:
                  type: string
      responses:
        "200":
          description: Backup written
          content:
            application/json:
              schema:
                type: object
                required: [file_name, checksum_sha256]
                properties:
                  file_name:
                    type: string
                  checksum_sha256:
                    type: string

  /api/restore:
    post:
      summary: Restore from a .lara-backup archive after verifying its checksum (Hub console)
      tags: [export]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_path]
              properties:
                source_path:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/Ok"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque session token returned by /api/auth/login

  parameters:
    TokenQuery:
      name: token
      in: query
      required: false
      description: Bearer token as a query parameter. Only for media routes consumed by players that cannot set headers (HTML5 video, image views).
      schema:
        type: string
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  requestBodies:
    StudentRef:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [student_id]
            properties:
              student_id:
                type: string
                format: uuid

  responses:
    Ok:
      description: Success
      content:
        application/json:
          schema:
            type: object
            required: [success]
            properties:
              success:
                type: boolean
    Error:
      description: Error envelope. Known codes include UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CLASS_CODE_INVALID, QUIZ_IN_PROGRESS, COMMENTS_DISABLED, TIME_LIMIT_EXCEEDED, FILE_TOO_LARGE, AI_NOT_AVAILABLE (the Hub's model file is missing or failed to load; everything else keeps working).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: "QUIZ_IN_PROGRESS"
            message:
              type: string

    AuthSession:
      type: object
      required: [token, expires_at, user]
      properties:
        token:
          type: string
        expires_at:
          type: integer
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required: [id, lrn_or_id, full_name, role]
      properties:
        id:
          type: string
          format: uuid
        lrn_or_id:
          type: string
        full_name:
          type: string
        role:
          type: string
          enum: ["TEACHER", "STUDENT", "ADMIN"]
          description: ADMIN is the single Hub admin account. It is never synced to a client and never appears as PublicUser.

    Classroom:
      type: object
      required: [id, name, section, class_code, teacher_id]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Science 4"
        section:
          type: string
          example: "Aguinaldo"
        class_code:
          type: string
          example: "K7M4QX"
        teacher_id:
          type: string
          format: uuid
        archived_at:
          type: [integer, "null"]
        co_teacher_ids:
          type: array
          description: Teachers added by the owner (teacher_id). Their names arrive as PublicUser.
          items:
            type: string
            format: uuid
        enrollment_status:
          type: string
          enum: ["PENDING", "ACTIVE", "REJECTED", "REMOVED"]
          description: Present for learner callers only

    RosterEntry:
      type: object
      required: [student_id, full_name, lrn, status]
      properties:
        student_id:
          type: string
          format: uuid
        full_name:
          type: string
        lrn:
          type: string
        status:
          type: string
          enum: ["PENDING", "ACTIVE", "REJECTED", "REMOVED"]
        joined_at:
          type: integer

    Announcement:
      type: object
      required: [id, classroom_id, title, content, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        classroom_id:
          type: string
          format: uuid
        title:
          type: string
        content:
          type: string
        allow_comments:
          type: boolean
        created_at:
          type: integer
        updated_at:
          type: integer

    Comment:
      type: object
      required: [id, announcement_id, author_id, content, created_at]
      properties:
        id:
          type: string
          format: uuid
        announcement_id:
          type: string
          format: uuid
        author_id:
          type: string
          format: uuid
        content:
          type: string
        created_at:
          type: integer
        updated_at:
          type: integer

    CommentPush:
      type: object
      required: [id, announcement_id, content, created_at]
      properties:
        id:
          type: string
          format: uuid
        announcement_id:
          type: string
          format: uuid
        content:
          type: string
        created_at:
          type: integer

    Material:
      type: object
      required: [id, classroom_id, title, file_type, file_size_bytes, updated_at]
      properties:
        id:
          type: string
          format: uuid
        classroom_id:
          type: string
          format: uuid
        title:
          type: string
        file_type:
          type: string
          enum: ["VIDEO", "DOCUMENT", "WORKSHEET"]
        file_size_bytes:
          type: integer
        download_url:
          type: string
        topic_id:
          type: [string, "null"]
          format: uuid
        assignment_id:
          type: [string, "null"]
          format: uuid
          description: Set when the file is an attachment of that assignment.
        announcement_id:
          type: [string, "null"]
          format: uuid
          description: Set when the file is an attachment of that announcement.
        updated_at:
          type: integer

    ModelOffer:
      type: object
      required: [available]
      properties:
        available:
          type: boolean
        file_name:
          type: string
        size_bytes:
          type: integer
          format: int64
        sha256:
          type: string
          description: Lowercase hex SHA-256 of the whole file.
    MaterialChunk:
      type: object
      required: [id, material_id, order_index, text]
      properties:
        id:
          type: string
          format: uuid
        material_id:
          type: string
          format: uuid
        order_index:
          type: integer
        heading:
          type: string
        text:
          type: string

    Assignment:
      type: object
      required: [id, classroom_id, title, max_points, due_date]
      properties:
        id:
          type: string
          format: uuid
        classroom_id:
          type: string
          format: uuid
        title:
          type: string
        instructions:
          type: string
        max_points:
          type: integer
        due_date:
          type: integer
        allow_late:
          type: boolean
        topic_id:
          type: [string, "null"]
          format: uuid
        updated_at:
          type: integer

    Topic:
      type: object
      required: [id, classroom_id, name, order_index, updated_at]
      properties:
        id:
          type: string
          format: uuid
        classroom_id:
          type: string
          format: uuid
        name:
          type: string
        order_index:
          type: integer
        updated_at:
          type: integer

    PrivateComment:
      type: object
      required: [id, assignment_id, student_id, author_id, content, created_at]
      description: One message in the private thread between a learner (student_id) and the class teachers on one assignment.
      properties:
        id:
          type: string
          format: uuid
        assignment_id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
        author_id:
          type: string
          format: uuid
        content:
          type: string
        created_at:
          type: integer
        updated_at:
          type: integer

    PrivateCommentPush:
      type: object
      required: [id, assignment_id, content, created_at]
      properties:
        id:
          type: string
          format: uuid
        assignment_id:
          type: string
          format: uuid
        content:
          type: string
        created_at:
          type: integer

    Submission:
      type: object
      required: [id, assignment_id, student_id, file_type, submitted_at]
      properties:
        id:
          type: string
          format: uuid
        assignment_id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
        file_type:
          type: string
          enum: ["IMAGE", "DOCUMENT"]
        submitted_at:
          type: integer
        score:
          type: integer
        teacher_feedback:
          type: string
        updated_at:
          type: integer

    Enrollment:
      type: object
      required: [id, classroom_id, student_id, status, updated_at]
      properties:
        id:
          type: string
          format: uuid
        classroom_id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
        status:
          type: string
          enum: ["PENDING", "ACTIVE", "REJECTED", "REMOVED"]
        joined_at:
          type: integer
        updated_at:
          type: integer

    Answer:
      type: object
      required: [question_id, selected_option]
      properties:
        question_id:
          type: string
          format: uuid
        selected_option:
          type: string

    StudentQuestion:
      type: object
      required: [id, order_index, question_text, question_type, options, points]
      description: Learner-facing question. MUST NOT contain correct_answer.
      properties:
        id:
          type: string
          format: uuid
        order_index:
          type: integer
        question_text:
          type: string
        question_type:
          type: string
          enum: ["MULTIPLE_CHOICE", "TRUE_FALSE", "IDENTIFICATION"]
        options:
          type: array
          items:
            type: string
        points:
          type: integer
        image_url:
          type: string

    StudentQuizResponse:
      type: object
      required: [id, classroom_id, title, time_limit_minutes, questions]
      properties:
        id:
          type: string
          format: uuid
        classroom_id:
          type: string
          format: uuid
        title:
          type: string
        time_limit_minutes:
          type: integer
        started_at:
          type: integer
          description: Nullable epoch ms when the teacher started the quiz
        questions:
          type: array
          items:
            $ref: "#/components/schemas/StudentQuestion"

    TeacherQuestion:
      allOf:
        - $ref: "#/components/schemas/StudentQuestion"
        - type: object
          required: [correct_answer]
          properties:
            correct_answer:
              type: string
            synonyms:
              type: array
              items:
                type: string
              description: Accepted alternates for IDENTIFICATION questions

    TeacherQuizInput:
      type: object
      required: [classroom_id, title, time_limit_minutes, questions]
      properties:
        classroom_id:
          type: string
          format: uuid
        title:
          type: string
        instructions:
          type: string
        time_limit_minutes:
          type: integer
        shuffle_questions:
          type: boolean
          default: false
        release_scores_immediately:
          type: boolean
          default: true
        topic_id:
          type: [string, "null"]
          format: uuid
        questions:
          type: array
          items:
            $ref: "#/components/schemas/TeacherQuestion"

    TeacherQuiz:
      allOf:
        - $ref: "#/components/schemas/TeacherQuizInput"
        - type: object
          required: [id, status]
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
              enum: ["DRAFT", "ACTIVE", "CLOSED"]
            started_at:
              type: integer

    QuizAttemptPush:
      type: object
      required: [id, quiz_id, started_at, submitted_at, answers]
      properties:
        id:
          type: string
          format: uuid
        quiz_id:
          type: string
          format: uuid
        started_at:
          type: integer
        submitted_at:
          type: integer
        answers:
          type: array
          items:
            $ref: "#/components/schemas/Answer"

    GradeReceipt:
      type: object
      required: [attempt_id, score, total_points, submitted_at]
      properties:
        attempt_id:
          type: string
          format: uuid
        score:
          type: [integer, "null"]
          description: Null for a learner while the teacher holds scores (release_scores_immediately false and the quiz is not CLOSED). Teachers always see it.
        total_points:
          type: integer
        submitted_at:
          type: integer

    PublicUser:
      type: object
      required: [id, full_name, role]
      description: What a client may know about another person. Never contains lrn_or_id (except the caller's own profile and a teacher's roster) or any PIN data.
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        role:
          type: string
          enum: ["TEACHER", "STUDENT"]
        lrn_or_id:
          type: string

    SyncPullResponse:
      type: object
      required: [server_time, hub_id, sync_epoch, next_cursor, has_more, reset]
      properties:
        server_time:
          type: integer
          description: Hub clock in epoch ms. Informational (clock offset for quiz timers); NEVER used as the sync cursor.
        hub_id:
          type: string
          description: Identity of this Hub. Store it; a different value means a different school Hub.
        sync_epoch:
          type: integer
          description: Incremented on restore-from-backup or tombstone pruning.
        next_cursor:
          type: integer
          description: Store as the cursor only after the whole response is committed.
        has_more:
          type: boolean
          description: When true, pull again immediately with cursor set to next_cursor.
        reset:
          type: boolean
          description: True when the caller's hub_id or sync_epoch did not match. The caller must wipe its mirror before applying.
        users:
          type: array
          items:
            $ref: "#/components/schemas/PublicUser"
        classrooms:
          type: array
          items:
            $ref: "#/components/schemas/Classroom"
        enrollments:
          type: array
          items:
            $ref: "#/components/schemas/Enrollment"
        topics:
          type: array
          items:
            $ref: "#/components/schemas/Topic"
        private_comments:
          type: array
          description: Only the caller's own threads (learner) or their classes' threads (teacher).
          items:
            $ref: "#/components/schemas/PrivateComment"
        announcements:
          type: array
          items:
            $ref: "#/components/schemas/Announcement"
        comments:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
        materials:
          type: array
          items:
            $ref: "#/components/schemas/Material"
        material_chunks:
          type: array
          items:
            $ref: "#/components/schemas/MaterialChunk"
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/Assignment"
        submissions:
          type: array
          items:
            $ref: "#/components/schemas/Submission"
        quizzes:
          type: array
          description: Metadata only. Question bodies are fetched via /api/quizzes/{id} after the teacher starts the quiz.
          items:
            type: object
            required: [id, classroom_id, title, status, time_limit_minutes]
            properties:
              id:
                type: string
                format: uuid
              classroom_id:
                type: string
                format: uuid
              title:
                type: string
              status:
                type: string
                enum: ["DRAFT", "ACTIVE", "CLOSED"]
              time_limit_minutes:
                type: integer
              started_at:
                type: integer
        quiz_attempts:
          type: array
          items:
            $ref: "#/components/schemas/GradeReceipt"
        deleted:
          type: array
          description: Tombstones from sync_revisions
          items:
            type: object
            required: [entity_table, entity_id]
            properties:
              entity_table:
                type: string
              entity_id:
                type: string
