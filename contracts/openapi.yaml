openapi: 3.1.0
info:
  title: L.A.R.A Local Hub REST API
  description: |
    Offline-first LAN classroom management and assessment API for Philippine public schools (Grades 1 to 12).

    Conventions (see contracts/naming_rules.md):
    - All JSON keys are snake_case. All timestamps are epoch milliseconds (integer).
    - All routes except /download, /api/auth/register and /api/auth/login require `Authorization: Bearer <token>`.
    - Errors always use the Error envelope: {"error": {"code": "...", "message": "..."}}.
    - correct_answer is returned ONLY to the teacher who owns the quiz. Student responses never contain it.
    - Realtime events are on ws://{hub_ip}:8081 (see contracts/events/README.md).
  version: 1.1.0
servers:
  - url: http://{hub_ip}:8080
    description: Local Hub Server
    variables:
      hub_ip:
        default: 192.168.1.50
security:
  - bearerAuth: []

paths:
  /download:
    get:
      summary: Captive download portal for client APK and desktop installers
      security: []
      tags: [portal]
      responses:
        "200":
          description: HTML portal page or binary application package
          content:
            text/html:
              schema:
                type: string

  # ---------------------------------------------------------------- AUTH
  /api/auth/register:
    post:
      summary: Self-register a learner account (teacher accounts are created by the Hub admin)
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lrn_or_id, full_name, pin]
              properties:
                lrn_or_id:
                  type: string
                  minLength: 1
                  maxLength: 32
                  description: Trimmed by the Hub; empty after trimming answers 400 BAD_REQUEST.
                  example: "123456789012"
                full_name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: Trimmed by the Hub; empty after trimming answers 400 BAD_REQUEST.
                  example: "Juan dela Cruz"
                pin:
                  type: string
                  pattern: "^[0-9]{6}$"
      responses:
        "200":
          description: Account created and session opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/auth/login:
    post:
      summary: Log in with LRN/ID and 6-digit PIN
      description: |
        Rate limit per lrn_or_id: after 5 wrong PINs within 60 seconds, every further attempt for that
        lrn_or_id (even with the right PIN) answers 429 TOO_MANY_ATTEMPTS with a Retry-After header (whole
        seconds) until 60 seconds have passed since the oldest of those failures. A successful login clears
        the count. The ADMIN account signs in only from the Hub PC itself (loopback, and not a request relayed
        by the Remote/Suspension Mode tunnel, which also arrives on loopback); from anywhere else it answers
        403 ADMIN_LOCAL_ONLY, checked before the PIN.
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lrn_or_id, pin]
              properties:
                lrn_or_id:
                  type: string
                pin:
                  type: string
                  pattern: "^[0-9]{6}$"
      responses:
        "200":
          description: Session opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          description: Too many wrong PINs for this lrn_or_id. Error code TOO_MANY_ATTEMPTS.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until the next attempt is accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/logout:
    post:
      summary: Close the current session
      tags: [auth]
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  # ---------------------------------------------------------------- ADMIN (Hub console only)
  /api/admin/setup:
    post:
      summary: First run only. Create the single Hub admin account (lrn_or_id ADMIN-0001, role ADMIN) with the PIN typed on the Hub PC. Accepted only from the Hub machine itself (loopback). Answers 409 ADMIN_EXISTS once an admin exists; after that the Hub window signs in through /api/auth/login.
      tags: [admin]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, pin]
              properties:
                full_name:
                  type: string
                pin:
                  type: string
                  pattern: "^[0-9]{6}$"
      responses:
        "200":
          description: Signed-in admin session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "409":
          $ref: "#/components/responses/Error"

  /api/admin/users:
    get:
      summary: List all accounts (admin)
      tags: [admin]
      responses:
        "200":
          description: All users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      summary: Create a teacher or learner account (admin)
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lrn_or_id, full_name, role, pin]
              properties:
                lrn_or_id:
                  type: string
                full_name:
                  type: string
                role:
                  type: string
                  enum: ["TEACHER", "STUDENT"]
                pin:
                  type: string
                  pattern: "^[0-9]{6}$"
      responses:
        "200":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /api/admin/users/{id}/reset-pin:
    post:
      summary: Reset a user PIN (admin)
      description: |
        The new PIN is exactly 6 digits. Accounts created with the old 4-digit PIN are not migrated: they cannot
        sign in until the admin resets them here to a 6-digit PIN.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin:
                  type: string
                  pattern: "^[0-9]{6}$"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/admin/activity-logs:
    get:
      summary: Read private operational history on the Hub PC (ADMIN only)
      tags:
      - admin
      description: 'Authenticate first (401), require ADMIN (403 FORBIDDEN), then require

        Hub-PC loopback without tunnel forwarding (403 ADMIN_LOCAL_ONLY).

        Reject invalid parameters with 400 BAD_REQUEST. Never cache responses.

        All sequence values are independent of the classroom sync cursor.

        Requests to this endpoint are excluded from request logging. Reads omit
        pre-existing HTTP_REQUEST entries for this endpoint without deleting history.

        GET and OPTIONS /api/admin/users request entries are likewise excluded from returned
        history and new recording. Account creation and PIN reset remain recorded.

        See activity_logs.md for stable pagination, filtering and retention semantics.

        '
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
      - name: before_seq
        in: query
        description: Exclusive older-page boundary; mutually exclusive with after_seq.
        schema:
          type: integer
          minimum: 1
          maximum: 9007199254740991
      - name: after_seq
        in: query
        description: Exclusive new-event boundary; mutually exclusive with before_seq.
        schema:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      - name: snapshot_seq
        in: query
        description: Inclusive high-water boundary returned by the first page; fixed
          while draining pages.
        schema:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      - name: history_id
        in: query
        description: Required with sequence parameters; mismatch after database initialization/restore
          answers 409 ACTIVITY_LOG_RESET.
        schema:
          type: string
          format: uuid
      - name: from_time
        in: query
        description: Inclusive epoch milliseconds; must be less than to_time when both
          are provided.
        schema:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      - name: to_time
        in: query
        description: Exclusive epoch milliseconds.
        schema:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      - name: severity
        in: query
        schema:
          $ref: #/components/schemas/ActivitySeverity
      - name: q
        in: query
        description: Case-insensitive literal search over safe event/service/reason/result
          labels; not raw error text.
        schema:
          type: string
          maxLength: 64
      responses:
        '200':
          description: Newest-first entries and stable sequence boundaries; no-store.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: #/components/schemas/ActivityLogPage
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          description: History cannot be read; ACTIVITY_LOG_UNAVAILABLE. Other Hub features
            remain usable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---------------------------------------------------------------- CLASSROOMS
  /api/classrooms:
    get:
      summary: List classrooms visible to the caller (teacher - owned or co-taught; learner - ACTIVE and PENDING enrollments)
      tags: [classrooms]
      responses:
        "200":
          description: List of classrooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Classroom"
    post:
      summary: Create a classroom and generate its 6-character Class Code (teacher)
      tags: [classrooms]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, section]
              properties:
                name:
                  type: string
                  example: "Science 4"
                section:
                  type: string
                  example: "Aguinaldo"
      responses:
        "200":
          description: Created classroom
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Classroom"

  /api/classrooms/join:
    post:
      summary: Request to enroll in a classroom using a 6-character Class Code
      description: A new request, or one from a learner whose enrollment is REJECTED or REMOVED, becomes PENDING and emits EVENT_JOIN_REQUEST to the class's teachers. A PENDING or ACTIVE learner gets their current status back and nothing changes. An archived class answers 403 FORBIDDEN.
      tags: [classrooms]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [class_code]
              properties:
                class_code:
                  type: string
                  pattern: "^[A-HJ-NP-Z2-9]{6}$"
                  description: Uppercase, no 0/O/1/I. Clients strip the display hyphen before sending.
                  example: "K7M4QX"
      responses:
        "200":
          description: Enrollment status receipt. Teacher sessions receive EVENT_JOIN_REQUEST.
          content:
            application/json:
              schema:
                type: object
                required: [status, classroom_id, section, teacher_name]
                properties:
                  status:
                    type: string
                    enum: ["PENDING", "ACTIVE", "REJECTED", "REMOVED"]
                  classroom_id:
                    type: string
                    format: uuid
                  section:
                    type: string
                    description: The class section, so a PENDING class card can show it before the first sync after approval.
                  teacher_name:
                    type: string
                    description: Full name of the owning teacher only (never their LRN/ID), for the same reason as section.
        "404":
          $ref: "#/components/responses/Error"

  /api/classrooms/{id}:
    patch:
      summary: Rename a class or archive it (owning teacher only). An archived class is read-only for everyone and keeps all its grades.
      description: While archived, a rename answers 403 FORBIDDEN unless the same request sets archived to false. Managing co-teachers stays allowed.
      tags: [classrooms]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                section:
                  type: string
                archived:
                  type: boolean
      responses:
        "200":
          description: Updated classroom
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Classroom"

  /api/classrooms/{id}/remove:
    post:
      summary: Remove an ACTIVE learner from the class (teacher). The enrollment becomes REMOVED, the learner gets EVENT_JOIN_APPROVAL with status REMOVED and loses access; their submissions and scores are kept on the Hub.
      description: Any teacher of the class (owner or co-teacher). An archived class answers 403 FORBIDDEN. ACTIVE becomes REMOVED. Repeating it on a REMOVED learner answers 200 with no change and no event; any other status answers 404 NOT_FOUND.
      tags: [classrooms]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        $ref: "#/components/requestBodies/StudentRef"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/classrooms/{id}/teachers:
    post:
      summary: Add a co-teacher by their teacher ID (owning teacher only). A co-teacher can do everything in the class except rename, archive or manage teachers.
      tags: [classrooms]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lrn_or_id]
              properties:
                lrn_or_id:
                  type: string
      responses:
        "200":
          description: Updated classroom
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Classroom"

  /api/classrooms/{id}/teachers/{teacher_id}:
    delete:
      summary: Remove a co-teacher (owning teacher only)
      tags: [classrooms]
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: teacher_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/classrooms/{id}/roster:
    get:
      summary: Enrollment roster with status (teacher)
      tags: [classrooms]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Roster
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RosterEntry"

  /api/classrooms/{id}/approve:
    post:
      summary: Approve a pending enrollment (teacher). Emits EVENT_JOIN_APPROVAL to the learner.
      description: Any teacher of the class (owner or co-teacher). An archived class answers 403 FORBIDDEN. PENDING becomes ACTIVE. Repeating it on an ACTIVE learner answers 200 with no change and no event; any other status answers 404 NOT_FOUND.
      tags: [classrooms]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        $ref: "#/components/requestBodies/StudentRef"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/classrooms/{id}/reject:
    post:
      summary: Reject a pending enrollment (teacher). Emits EVENT_JOIN_APPROVAL with status REJECTED.
      description: Any teacher of the class (owner or co-teacher). An archived class answers 403 FORBIDDEN. PENDING becomes REJECTED. Repeating it on a REJECTED learner answers 200 with no change and no event; any other status answers 404 NOT_FOUND.
      tags: [classrooms]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        $ref: "#/components/requestBodies/StudentRef"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  # ---------------------------------------------------------------- SYNC
  /api/sync/pull:
    post:
      summary: Delta-sync pull (cursor based) for the caller's ACTIVE classrooms
      description: |
        The cursor is a strictly increasing integer from the Hub's change ledger (`sync_revisions.seq`), never a clock time.
        First sync: send cursor 0 and no hub_id. Afterwards send the last `next_cursor` plus the `hub_id` and `sync_epoch` you stored.
        If they do not match the Hub (different school Hub, restored backup), the response has `reset: true`: wipe the
        mirrored tables (keep rows still QUEUED_FOR_SYNC) and apply the response, which then starts from cursor 0.
        Commit the whole response and the new cursor in ONE local transaction.
        The response also carries the caller's own enrollment rows for classes they no longer see, so a learner who was
        removed receives their `REMOVED` enrollment on the next pull and stops showing that class. Likewise a removed
        co-teacher receives that class's row once more, with `co_teacher_ids` no longer listing them.
        When a class becomes visible to the caller after their cursor (their enrollment turned ACTIVE, or they were
        added as a co-teacher), the response also carries that class's current rows from before the cursor, so the
        class does not open empty. Apply them like any other rows (upsert by id).
      tags: [sync]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cursor]
              properties:
                cursor:
                  type: integer
                  minimum: 0
                hub_id:
                  type: string
                sync_epoch:
                  type: integer
      responses:
        "200":
          description: Records changed after the cursor, plus tombstones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncPullResponse"

  /api/sync/push:
    post:
      summary: Delta-sync push for queued offline work (quiz attempts, stream comments, private comments)
      description: Teachers and active learners may push class comments. Only learners may push quiz attempts or private comments. Comment retries retain their client UUID and return a receipt; foreign authors and nonmembers are rejected.
      tags: [sync]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quiz_attempts:
                  type: array
                  items:
                    $ref: "#/components/schemas/QuizAttemptPush"
                comments:
                  type: array
                  items:
                    $ref: "#/components/schemas/CommentPush"
                private_comments:
                  type: array
                  items:
                    $ref: "#/components/schemas/PrivateCommentPush"
      responses:
        "200":
          description: Per-item receipts. Homework photos are uploaded separately via /api/assignments/{id}/submit. New or edited work for an archived class is REJECTED with reason FORBIDDEN; a retry of work the Hub saved before the archive is SYNCED.
          content:
            application/json:
              schema:
                type: object
                required: [acknowledged, receipts]
                properties:
                  acknowledged:
                    type: boolean
                  receipts:
                    type: array
                    items:
                      type: object
                      required: [id, status]
                      properties:
                        id:
                          type: string
                        status:
                          type: string
                          enum: ["SYNCED", "REJECTED"]
                        reason:
                          type: string
                          description: e.g. TIME_LIMIT_EXCEEDED

  # ---------------------------------------------------------------- STREAM
  /api/topics:
    post:
      summary: Create a topic that groups classwork, for example "Unit 1 - Plants" (teacher)
      tags: [classwork]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [classroom_id, name]
              properties:
                classroom_id:
                  type: string
                  format: uuid
                name:
                  type: string
      responses:
        "200":
          description: Created topic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topic"

  /api/topics/{id}:
    patch:
      summary: Rename or reorder a topic (teacher)
      tags: [classwork]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                order_index:
                  type: integer
      responses:
        "200":
          description: Updated topic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topic"
    delete:
      summary: Delete a topic (teacher). Its materials, assignments and quizzes stay and lose their topic_id. Produces a DELETE tombstone in sync.
      tags: [classwork]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/announcements:
    post:
      summary: Post an announcement as a class teacher or active learner. Emits EVENT_ANNOUNCEMENT_PUSH.
      description: The Hub sets author_id from the authenticated account. Only class teachers may set allow_comments.
      tags: [stream]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [classroom_id, title, content]
              properties:
                classroom_id:
                  type: string
                  format: uuid
                title:
                  type: string
                content:
                  type: string
                allow_comments:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Created announcement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"

  /api/announcements/{id}:
    patch:
      summary: Edit an announcement or moderate its comments
      description: An active learner may edit the title and content of their own post. Class teachers may edit teacher posts and set allow_comments on any post.
      tags: [stream]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                content:
                  type: string
                allow_comments:
                  type: boolean
      responses:
        "200":
          description: Updated announcement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
    delete:
      summary: Delete an announcement and its attachments
      description: An active learner may delete their own post. Class teachers may delete any post in their class. The Hub emits sync tombstones for the announcement and its attachments.
      tags: [stream]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/announcements/{id}/comments:
    get:
      summary: Retrieve comments for a specific announcement (members of the class only, else 403)
      tags: [stream]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: List of announcement comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
    post:
      summary: Post a comment on an announcement (members of the class only; rejected with 403 COMMENTS_DISABLED when allow_comments is false)
      tags: [stream]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
      responses:
        "200":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  # ---------------------------------------------------------------- MATERIALS
  /api/materials:
    post:
      summary: Upload a lesson file, or an attachment for an assignment or announcement. Max 250 MB. PDF/DOCX uploaded by a teacher are text-chunked on upload.
      description: A standalone material is linked to a classroom announcement thread. When neither assignment_id nor announcement_id is supplied, the Hub creates an announcement with the material title and empty content atomically with the material. Attachments use the linked announcement comments; assignment attachments retain private assignment comments. An explicit announcement_id must belong to the same class. Existing standalone materials must receive a linked thread before syncing to clients. Class teachers may upload materials. Active learners may upload only to their own announcement, in its classroom, with no assignment_id or topic_id; learner uploads do not generate lesson chunks.
      tags: [materials]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [classroom_id, title, file_type, file]
              properties:
                classroom_id:
                  type: string
                  format: uuid
                title:
                  type: string
                file_type:
                  type: string
                  enum: ["VIDEO", "DOCUMENT", "WORKSHEET"]
                topic_id:
                  type: string
                  format: uuid
                assignment_id:
                  type: string
                  format: uuid
                  description: Set to attach this file to an assignment. It then shows on that assignment, not in the Classwork list.
                announcement_id:
                  type: string
                  format: uuid
                  description: Set to attach this file to an existing announcement in the specified classroom.
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Created material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Material"
        "413":
          $ref: "#/components/responses/Error"

  /api/materials/{id}:
    patch:
      summary: Rename a material or move it to a topic
      description: Class teachers may rename or move materials. Active learners may rename an attachment on their own announcement. To replace its file, upload a new attachment and delete the old one.
      tags: [materials]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                topic_id:
                  type: [string, "null"]
                  format: uuid
      responses:
        "200":
          description: Updated material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Material"
    delete:
      summary: Delete a material and any lesson chunks
      description: Class teachers may delete materials in their class. Active learners may delete attachments on their own announcements. Clients remove cached files when they receive the sync tombstone.
      tags: [materials]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/materials/{id}/download:
    get:
      summary: Download the full material file. VIDEO downloads honor Range, If-Range and If-Match so Save for Home can resume after a Wi-Fi drop.
      tags: [materials]
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/TokenQuery"
        - name: Range
          in: header
          required: false
          description: VIDEO only. Without it, or when If-Range no longer matches, the whole file is sent as 200.
          schema:
            type: string
            example: "bytes=262144-"
        - name: If-Range
          in: header
          required: false
          description: The ETag from an earlier response. If the file changed, the Hub ignores Range and sends 200 with the whole new file.
          schema:
            type: string
        - name: If-Match
          in: header
          required: false
          description: "VIDEO only. How Android's and Chrome's download managers resume: the ETag from an earlier response, or `*`. If it no longer matches, the Hub answers 412 and the client starts over."
          schema:
            type: string
      responses:
        "200":
          description: "File bytes (the whole file). VIDEO responses carry `ETag` and `Accept-Ranges: bytes`."
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: VIDEO only. The requested byte range, with `Content-Range` and `ETag`.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "416":
          description: "VIDEO only. The range starts past the end of the file; `Content-Range: bytes */<size>`."
        "412":
          description: "VIDEO only. If-Match no longer matches the file (it changed); the response carries the current `ETag`."

  /api/materials/{id}/chunks:
    get:
      summary: Pre-extracted lesson text chunks for Socratic grounding
      tags: [materials]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Ordered chunks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaterialChunk"

  /api/materials/{id}/stream:
    get:
      summary: HTTP 206 Byte-Range streaming for educational videos (max 2.0 MB/s per client)
      tags: [materials]
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/TokenQuery"
        - name: Range
          in: header
          required: false
          schema:
            type: string
            example: "bytes=0-1048576"
        - name: If-Range
          in: header
          required: false
          description: As on the VIDEO download.
          schema:
            type: string
        - name: If-Match
          in: header
          required: false
          description: "How Android's and Chrome's download managers resume: the ETag from an earlier response, or `*`. If it no longer matches, the Hub answers 412 and the client starts over."
          schema:
            type: string
      responses:
        "206":
          description: Partial video content, with `Content-Range` and `ETag`
        "200":
          description: Full video content
        "404":
          description: Not a VIDEO material
        "412":
          description: "If-Match no longer matches the video; the response carries the current `ETag`."

  # ---------------------------------------------------------------- ASSIGNMENTS
  /api/assignments:
    post:
      summary: Create an assignment (teacher)
      tags: [assignments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [classroom_id, title, max_points, due_date]
              properties:
                classroom_id:
                  type: string
                  format: uuid
                title:
                  type: string
                instructions:
                  type: string
                max_points:
                  type: integer
                due_date:
                  type: integer
                allow_late:
                  type: boolean
                  default: false
                topic_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Created assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"

  /api/assignments/{id}:
    patch:
      summary: Edit an assignment (teacher)
      tags: [assignments]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                instructions:
                  type: string
                max_points:
                  type: integer
                due_date:
                  type: integer
                allow_late:
                  type: boolean
                topic_id:
                  type: [string, "null"]
                  format: uuid
      responses:
        "200":
          description: Updated assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
    delete:
      summary: Remove an assignment posted by mistake (teacher). The Hub archives it (rows and any grades are kept, never destroyed), hides it from the gradebook and export, and sends clients a DELETE tombstone.
      tags: [assignments]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/assignments/{id}/private-comments:
    get:
      summary: Private comments between one learner and the class teachers on this assignment. A learner gets their own thread; a teacher must pass student_id.
      tags: [assignments]
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: student_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Comments, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PrivateComment"
    post:
      summary: Add a private comment. A learner posts to their own thread; a teacher must send student_id. Classmates never see it.
      tags: [assignments]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                student_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivateComment"

  /api/assignments/{id}/submit:
    post:
      summary: Turn in homework (learner). Identical retries are idempotent; ungraded work can be replaced, but graded work cannot.
      description: |
        `turned_in_at` is the learner device's epoch-millisecond time when Turn in was pressed. The Hub
        clamps future values to its current time; if omitted, the Hub arrival time is used. When `allow_late`
        is false, a submission after `due_date` is refused with 409 LATE_SUBMISSION. An identical retry
        (same submission_id and SHA-256 file hash) returns the stored submission unchanged, including after
        grading or the due date. A different file after grading is refused with 409 ALREADY_GRADED.
        A queued submission refused with either code is rejected permanently; the client shows the learner
        why it was not turned in instead of retrying it indefinitely.
      tags: [assignments]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [submission_id, file]
              properties:
                submission_id:
                  type: string
                  format: uuid
                  description: Client-generated id so offline retries are idempotent
                turned_in_at:
                  type: integer
                  format: int64
                  description: Optional learner device epoch time in milliseconds when Turn in was pressed
                file:
                  type: string
                  format: binary
                  description: JPEG up to ~800 KB for photos
      responses:
        "200":
          description: Stored submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"
        "409":
          $ref: "#/components/responses/Error"

  /api/assignments/{id}/submissions:
    get:
      summary: List learner submissions for an assignment (teacher)
      tags: [assignments]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Submission"

  /api/submissions/{id}:
    patch:
      summary: Grade a submission with score and feedback (teacher)
      tags: [assignments]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                score:
                  type: integer
                teacher_feedback:
                  type: string
      responses:
        "200":
          description: Updated submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"

  /api/submissions/{id}/file:
    get:
      summary: Fetch the stored submission image or document (teacher or owning learner)
      tags: [assignments]
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/TokenQuery"
      responses:
        "200":
          description: File bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  # ---------------------------------------------------------------- QUIZZES
  /api/quizzes:
    post:
      summary: Create a quiz with questions and answer keys (teacher)
      tags: [quizzes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherQuizInput"
      responses:
        "200":
          description: Created quiz in DRAFT status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherQuiz"

  /api/quizzes/active:
    get:
      summary: Fetch the currently active quiz for the caller's classrooms (ANSWER KEYS STRIPPED)
      tags: [quizzes]
      responses:
        "200":
          description: Active quiz payload without correct_answer fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentQuizResponse"
        "404":
          $ref: "#/components/responses/Error"

  /api/quizzes/{id}:
    get:
      summary: Fetch a quiz. Learners get the redacted payload; the owning teacher gets correct_answer.
      tags: [quizzes]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Quiz payload
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StudentQuizResponse"
                  - $ref: "#/components/schemas/TeacherQuiz"
    patch:
      summary: Replace a quiz's settings and questions while it is still DRAFT (teacher). Answers 409 QUIZ_NOT_DRAFT once the quiz has started, so scores stay fair.
      tags: [quizzes]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherQuizInput"
      responses:
        "200":
          description: Updated quiz
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherQuiz"
        "409":
          $ref: "#/components/responses/Error"

  /api/quizzes/{id}/start:
    post:
      summary: Activate a DRAFT quiz and broadcast EVENT_QUIZ_START (teacher). Answers 409 QUIZ_NOT_DRAFT if it was already started, and 409 QUIZ_ALREADY_ACTIVE (the message names it) while another quiz in the class is ACTIVE - one active quiz per class.
      tags: [quizzes]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Authoritative start time
          content:
            application/json:
              schema:
                type: object
                required: [started_at, duration_seconds]
                properties:
                  started_at:
                    type: integer
                  duration_seconds:
                    type: integer

  /api/quizzes/{id}/begin:
    post:
      summary: Learner begins the active quiz. Creates the IN_PROGRESS attempt that triggers the AI lockout. Answers 409 QUIZ_CLOSED if the quiz is not ACTIVE.
      tags: [quizzes]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Attempt opened
          content:
            application/json:
              schema:
                type: object
                required: [attempt_id, started_at]
                properties:
                  attempt_id:
                    type: string
                    format: uuid
                  started_at:
                    type: integer

  /api/quizzes/{id}/close:
    post:
      summary: Close the quiz and broadcast EVENT_QUIZ_CLOSED (teacher). Unsubmitted attempts are auto-submitted. An auto-submitted attempt can be replaced once by the learner's own on-time work pushed later (submitted_at <= closed_at + 60 s, the same network grace as the time limit, so a device that auto-submits on EVENT_QUIZ_CLOSED counts; and submitted_at - started_at <= limit + 60 s, timed from the Hub's started_at); every other stored attempt is never regraded. Closing also releases held scores (release_scores_immediately false) - each learner gets EVENT_GRADE_CONFIRMED and the score on the next pull. Closing a DRAFT answers 409 QUIZ_NOT_STARTED; closing a CLOSED quiz answers 200 with no change and no events, so a retry is safe.
      tags: [quizzes]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/quizzes/{id}/submit:
    post:
      summary: Submit learner answers for instant auto-grading. Emits EVENT_GRADE_CONFIRMED unless scores are held; then the receipt's score is null until the teacher closes the quiz.
      tags: [quizzes]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [started_at, submitted_at, answers]
              properties:
                started_at:
                  type: integer
                submitted_at:
                  type: integer
                answers:
                  type: array
                  items:
                    $ref: "#/components/schemas/Answer"
      responses:
        "200":
          description: Graded receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GradeReceipt"
        "422":
          $ref: "#/components/responses/Error"

  /api/quizzes/{id}/results:
    get:
      summary: Live and final results matrix for all learners (teacher)
      tags: [quizzes]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: One row per enrolled learner
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [student_id, full_name, status]
                  properties:
                    student_id:
                      type: string
                      format: uuid
                    full_name:
                      type: string
                    status:
                      type: string
                      enum: ["NOT_STARTED", "IN_PROGRESS", "SUBMITTED"]
                    score:
                      type: integer
                    total_points:
                      type: integer

  # ---------------------------------------------------------------- EXPORT & BACKUP
  /api/export/class-record:
    post:
      summary: Export the gradebook (.xlsx or .csv) with learners by work and points to a mounted USB path or as a download (teacher / Hub console)
      tags: [export]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [classroom_id, format]
              properties:
                classroom_id:
                  type: string
                  format: uuid
                format:
                  type: string
                  enum: ["XLSX", "CSV"]
                target_path:
                  type: string
                  description: Mounted USB path. When omitted the file is returned as the response body.
      responses:
        "200":
          description: Export result
          content:
            application/json:
              schema:
                type: object
                required: [file_name]
                properties:
                  file_name:
                    type: string
                  saved_to:
                    type: string

  /api/backup:
    post:
      summary: Create a .lara-backup snapshot on the given path (Hub console)
      tags: [export]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_path]
              properties:
                target_path:
                  type: string
      responses:
        "200":
          description: Backup written
          content:
            application/json:
              schema:
                type: object
                required: [file_name, checksum_sha256]
                properties:
                  file_name:
                    type: string
                  checksum_sha256:
                    type: string

  /api/restore:
    post:
      summary: Restore from a .lara-backup archive after verifying its checksum (Hub console)
      tags: [export]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_path]
              properties:
                source_path:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/Ok"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque session token returned by /api/auth/login

  parameters:
    TokenQuery:
      name: token
      in: query
      required: false
      description: Bearer token as a query parameter. Only for media routes consumed by players that cannot set headers (HTML5 video, image views).
      schema:
        type: string
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  requestBodies:
    StudentRef:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [student_id]
            properties:
              student_id:
                type: string
                format: uuid

  responses:
    Ok:
      description: Success
      content:
        application/json:
          schema:
            type: object
            required: [success]
            properties:
              success:
                type: boolean
    Error:
      description: Error envelope. Known codes include UNAUTHORIZED, FORBIDDEN, TOO_MANY_ATTEMPTS, ADMIN_LOCAL_ONLY, NOT_FOUND, CLASS_CODE_INVALID, QUIZ_IN_PROGRESS, QUIZ_NOT_DRAFT, QUIZ_NOT_STARTED, QUIZ_ALREADY_ACTIVE, QUIZ_CLOSED, COMMENTS_DISABLED, TIME_LIMIT_EXCEEDED, FILE_TOO_LARGE, LATE_SUBMISSION, ALREADY_GRADED, AI_NOT_AVAILABLE (the Hub's model file is missing or failed to load; everything else keeps working).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    ActivityEventCode:
      type: string
      enum:
      - HUB_STARTED
      - HUB_STOPPING
      - UNCLEAN_RESTART
      - SERVICE_UNAVAILABLE
      - SERVICE_RECOVERED
      - CONNECTION_PROBLEM
      - DOCUMENT_UPLOADED
      - DOCUMENT_UPLOAD_FAILED
      - DOCUMENT_PROCESSED
      - DOCUMENT_PROCESSING_FAILED
      - QUIZ_STARTED
      - QUIZ_START_FAILED
      - QUIZ_CLOSED
      - QUIZ_CLOSE_FAILED
      - ACCOUNT_CREATED
      - ACCOUNT_CREATE_FAILED
      - PIN_RESET
      - PIN_RESET_FAILED
      - LOG_GAP
      - HTTP_REQUEST
    ActivitySeverity:
      type: string
      enum:
      - INFO
      - WARNING
      - ERROR
    ActivityResult:
      type: string
      enum:
      - SUCCEEDED
      - FAILED
      - DEGRADED
    ActivityService:
      type: string
      enum:
      - HUB
      - DATABASE
      - HTTP
      - WEBSOCKET
      - DISCOVERY
      - STORAGE
      - DOCUMENTS
      - QUIZZES
      - ACCOUNTS
      - ACTIVITY_LOG
    ActivityReason:
      type: string
      enum:
      - PORT_IN_USE
      - NETWORK_UNAVAILABLE
      - TIMEOUT
      - STORAGE_UNAVAILABLE
      - DATABASE_UNAVAILABLE
      - UNREADABLE_DOCUMENT
      - NO_TEXT_LAYER
      - SIZE_LIMIT
      - INVALID_INPUT
      - NOT_ALLOWED
      - CONFLICT
      - QUEUE_FULL
      - WRITE_FAILED
      - REPEATED_EVENT
      - UNCLEAN_EXIT
      - INTERNAL_FAILURE
    ActivityDetails:
      type: object
      additionalProperties: false
      properties:
        reason:
          $ref: '#/components/schemas/ActivityReason'
        item_count:
          type: integer
          minimum: 0
          maximum: 1000000
        duration_ms:
          type: integer
          minimum: 0
          maximum: 86400000
        http_method:
          type: string
          enum: [GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS, CONNECT, TRACE, OTHER]
        endpoint:
          type: string
          enum:
          - '/'
          - '/api/admin/activity-logs'
          - '/api/admin/setup'
          - '/api/admin/users'
          - '/api/admin/users/{id}/reset-pin'
          - '/api/announcements'
          - '/api/announcements/{id}'
          - '/api/announcements/{id}/comments'
          - '/api/assignments'
          - '/api/assignments/{id}'
          - '/api/assignments/{id}/private-comments'
          - '/api/assignments/{id}/submissions'
          - '/api/assignments/{id}/submit'
          - '/api/auth/login'
          - '/api/auth/logout'
          - '/api/auth/register'
          - '/api/backup'
          - '/api/classrooms'
          - '/api/classrooms/join'
          - '/api/classrooms/{id}'
          - '/api/classrooms/{id}/approve'
          - '/api/classrooms/{id}/reject'
          - '/api/classrooms/{id}/remove'
          - '/api/classrooms/{id}/roster'
          - '/api/classrooms/{id}/teachers'
          - '/api/classrooms/{id}/teachers/{teacher_id}'
          - '/api/export/class-record'
          - '/api/materials'
          - '/api/materials/{id}'
          - '/api/materials/{id}/chunks'
          - '/api/materials/{id}/download'
          - '/api/materials/{id}/stream'
          - '/api/quizzes'
          - '/api/quizzes/active'
          - '/api/quizzes/{id}'
          - '/api/quizzes/{id}/begin'
          - '/api/quizzes/{id}/close'
          - '/api/quizzes/{id}/results'
          - '/api/quizzes/{id}/start'
          - '/api/quizzes/{id}/submit'
          - '/api/restore'
          - '/api/submissions/{id}'
          - '/api/submissions/{id}/file'
          - '/api/sync/pull'
          - '/api/sync/push'
          - '/api/topics'
          - '/api/topics/{id}'
          - '/download'
          - '/download/assets/{*path}'
          - '/download/{file}'
          - 'UNMATCHED'
        status_code:
          type: integer
          minimum: 100
          maximum: 599
    ActivityEntry:
      type: object
      additionalProperties: false
      required:
      - seq
      - occurred_at
      - event_code
      - severity
      - result
      - service
      - details
      properties:
        seq:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        occurred_at:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        event_code:
          $ref: '#/components/schemas/ActivityEventCode'
        severity:
          $ref: '#/components/schemas/ActivitySeverity'
        result:
          $ref: '#/components/schemas/ActivityResult'
        service:
          $ref: '#/components/schemas/ActivityService'
        details:
          $ref: '#/components/schemas/ActivityDetails'
    ActivityLogPage:
      type: object
      additionalProperties: false
      required:
      - history_id
      - entries
      - high_water_seq
      - next_before_seq
      - next_after_seq
      - pruned_through_seq
      - dropped_total
      - recording_state
      - server_time
      properties:
        history_id:
          type: string
          format: uuid
        entries:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ActivityEntry'
        high_water_seq:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        next_before_seq:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 9007199254740991
        next_after_seq:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 9007199254740991
        pruned_through_seq:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        dropped_total:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        recording_state:
          type: string
          enum:
          - ACTIVE
          - DEGRADED
          - UNAVAILABLE
        server_time:
          type: integer
          minimum: 0
          maximum: 9007199254740991
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: "QUIZ_IN_PROGRESS"
            message:
              type: string

    AuthSession:
      type: object
      required: [token, expires_at, user]
      properties:
        token:
          type: string
        expires_at:
          type: integer
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required: [id, lrn_or_id, full_name, role]
      properties:
        id:
          type: string
          format: uuid
        lrn_or_id:
          type: string
        full_name:
          type: string
        role:
          type: string
          enum: ["TEACHER", "STUDENT", "ADMIN"]
          description: ADMIN is the single Hub admin account. It is never synced to a client and never appears as PublicUser.

    Classroom:
      type: object
      required: [id, name, section, class_code, teacher_id]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Science 4"
        section:
          type: string
          example: "Aguinaldo"
        class_code:
          type: string
          example: "K7M4QX"
        teacher_id:
          type: string
          format: uuid
        archived_at:
          type: [integer, "null"]
        co_teacher_ids:
          type: array
          description: Teachers added by the owner (teacher_id). Their names arrive as PublicUser.
          items:
            type: string
            format: uuid
        enrollment_status:
          type: string
          enum: ["PENDING", "ACTIVE", "REJECTED", "REMOVED"]
          description: Present for learner callers only

    RosterEntry:
      type: object
      required: [enrollment_id, student_id, full_name, lrn, status]
      properties:
        enrollment_id:
          type: string
          format: uuid
          description: The enrollment row's id, the same id sync delivers in `enrollments`, so a client can save the row before its first sync.
        student_id:
          type: string
          format: uuid
        full_name:
          type: string
        lrn:
          type: string
        status:
          type: string
          enum: ["PENDING", "ACTIVE", "REJECTED", "REMOVED"]
        joined_at:
          type: integer

    Announcement:
      type: object
      required: [id, classroom_id, title, content, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        classroom_id:
          type: string
          format: uuid
        author_id:
          type: [string, "null"]
          format: uuid
          description: Authenticated author UUID. May be absent or null for legacy teacher posts.
        title:
          type: string
        content:
          type: string
        allow_comments:
          type: boolean
        created_at:
          type: integer
        updated_at:
          type: integer

    Comment:
      type: object
      required: [id, announcement_id, author_id, content, created_at]
      properties:
        id:
          type: string
          format: uuid
        announcement_id:
          type: string
          format: uuid
        author_id:
          type: string
          format: uuid
        content:
          type: string
        created_at:
          type: integer
        updated_at:
          type: integer

    CommentPush:
      type: object
      required: [id, announcement_id, content, created_at]
      properties:
        id:
          type: string
          format: uuid
        announcement_id:
          type: string
          format: uuid
        content:
          type: string
        created_at:
          type: integer

    Material:
      type: object
      required: [id, classroom_id, title, file_type, file_size_bytes, updated_at]
      properties:
        id:
          type: string
          format: uuid
        classroom_id:
          type: string
          format: uuid
        title:
          type: string
        file_type:
          type: string
          enum: ["VIDEO", "DOCUMENT", "WORKSHEET"]
        file_size_bytes:
          type: integer
        download_url:
          type: string
        topic_id:
          type: [string, "null"]
          format: uuid
        assignment_id:
          type: [string, "null"]
          format: uuid
          description: Set when the file is an attachment of that assignment.
        announcement_id:
          type: [string, "null"]
          format: uuid
          description: Set when the file is an attachment of that announcement.
        updated_at:
          type: integer

    MaterialChunk:
      type: object
      required: [id, material_id, order_index, text]
      properties:
        id:
          type: string
          format: uuid
        material_id:
          type: string
          format: uuid
        order_index:
          type: integer
        heading:
          type: string
        text:
          type: string

    Assignment:
      type: object
      required: [id, classroom_id, title, max_points, due_date]
      properties:
        id:
          type: string
          format: uuid
        classroom_id:
          type: string
          format: uuid
        title:
          type: string
        instructions:
          type: string
        max_points:
          type: integer
        due_date:
          type: integer
        allow_late:
          type: boolean
        topic_id:
          type: [string, "null"]
          format: uuid
        updated_at:
          type: integer

    Topic:
      type: object
      required: [id, classroom_id, name, order_index, updated_at]
      properties:
        id:
          type: string
          format: uuid
        classroom_id:
          type: string
          format: uuid
        name:
          type: string
        order_index:
          type: integer
        updated_at:
          type: integer

    PrivateComment:
      type: object
      required: [id, assignment_id, student_id, author_id, content, created_at]
      description: One message in the private thread between a learner (student_id) and the class teachers on one assignment.
      properties:
        id:
          type: string
          format: uuid
        assignment_id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
        author_id:
          type: string
          format: uuid
        content:
          type: string
        created_at:
          type: integer
        updated_at:
          type: integer

    PrivateCommentPush:
      type: object
      required: [id, assignment_id, content, created_at]
      properties:
        id:
          type: string
          format: uuid
        assignment_id:
          type: string
          format: uuid
        content:
          type: string
        created_at:
          type: integer

    Submission:
      type: object
      required: [id, assignment_id, student_id, file_type, submitted_at, received_at]
      properties:
        id:
          type: string
          format: uuid
        assignment_id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
        file_type:
          type: string
          enum: ["IMAGE", "DOCUMENT"]
        submitted_at:
          type: integer
          description: Effective learner turn-in time in epoch milliseconds (future values clamped by Hub)
        received_at:
          type: integer
          description: Epoch milliseconds when the Hub stored the file
        score:
          type: integer
        teacher_feedback:
          type: string
        updated_at:
          type: integer

    Enrollment:
      type: object
      required: [id, classroom_id, student_id, status, updated_at]
      properties:
        id:
          type: string
          format: uuid
        classroom_id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
        status:
          type: string
          enum: ["PENDING", "ACTIVE", "REJECTED", "REMOVED"]
        joined_at:
          type: integer
        updated_at:
          type: integer

    Answer:
      type: object
      required: [question_id, selected_option]
      properties:
        question_id:
          type: string
          format: uuid
        selected_option:
          type: string

    StudentQuestion:
      type: object
      required: [id, order_index, question_text, question_type, options, points]
      description: Learner-facing question. MUST NOT contain correct_answer.
      properties:
        id:
          type: string
          format: uuid
        order_index:
          type: integer
        question_text:
          type: string
        question_type:
          type: string
          enum: ["MULTIPLE_CHOICE", "TRUE_FALSE", "IDENTIFICATION"]
        options:
          type: array
          items:
            type: string
        points:
          type: integer
        image_url:
          type: string

    StudentQuizResponse:
      type: object
      required: [id, classroom_id, title, time_limit_minutes, questions]
      properties:
        id:
          type: string
          format: uuid
        classroom_id:
          type: string
          format: uuid
        title:
          type: string
        time_limit_minutes:
          type: integer
        started_at:
          type: integer
          description: Nullable epoch ms when the teacher started the quiz
        questions:
          type: array
          items:
            $ref: "#/components/schemas/StudentQuestion"

    TeacherQuestion:
      allOf:
        - $ref: "#/components/schemas/StudentQuestion"
        - type: object
          required: [correct_answer]
          properties:
            correct_answer:
              type: string
            synonyms:
              type: array
              items:
                type: string
              description: Accepted alternates for IDENTIFICATION questions

    TeacherQuizInput:
      type: object
      required: [classroom_id, title, time_limit_minutes, questions]
      properties:
        classroom_id:
          type: string
          format: uuid
        title:
          type: string
        instructions:
          type: string
        time_limit_minutes:
          type: integer
        shuffle_questions:
          type: boolean
          default: false
        release_scores_immediately:
          type: boolean
          default: true
        topic_id:
          type: [string, "null"]
          format: uuid
        questions:
          type: array
          items:
            $ref: "#/components/schemas/TeacherQuestion"

    TeacherQuiz:
      allOf:
        - $ref: "#/components/schemas/TeacherQuizInput"
        - type: object
          required: [id, status]
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
              enum: ["DRAFT", "ACTIVE", "CLOSED"]
            started_at:
              type: integer

    QuizAttemptPush:
      type: object
      required: [id, quiz_id, started_at, submitted_at, answers]
      properties:
        id:
          type: string
          format: uuid
        quiz_id:
          type: string
          format: uuid
        started_at:
          type: integer
        submitted_at:
          type: integer
        answers:
          type: array
          items:
            $ref: "#/components/schemas/Answer"

    GradeReceipt:
      type: object
      required: [attempt_id, score, total_points, submitted_at]
      properties:
        attempt_id:
          type: string
          format: uuid
        quiz_id:
          type: string
          format: uuid
          description: Optional. The quiz this attempt answers; lets a teacher's pull match scores to quizzes.
        student_id:
          type: string
          format: uuid
          description: Optional. The learner who made the attempt; lets a teacher's pull match scores to learners.
        score:
          type: [integer, "null"]
          description: Null for a learner while the teacher holds scores (release_scores_immediately false and the quiz is not CLOSED). Teachers always see it.
        total_points:
          type: integer
        submitted_at:
          type: integer

    PublicUser:
      type: object
      required: [id, full_name, role]
      description: What a client may know about another person. Never contains lrn_or_id (except the caller's own profile and a teacher's roster) or any PIN data.
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        role:
          type: string
          enum: ["TEACHER", "STUDENT"]
        lrn_or_id:
          type: string

    SyncPullResponse:
      type: object
      required: [server_time, hub_id, sync_epoch, next_cursor, has_more, reset]
      properties:
        server_time:
          type: integer
          description: Hub clock in epoch ms. Informational (clock offset for quiz timers); NEVER used as the sync cursor.
        hub_id:
          type: string
          description: Identity of this Hub. Store it; a different value means a different school Hub.
        sync_epoch:
          type: integer
          description: Incremented on restore-from-backup or tombstone pruning.
        next_cursor:
          type: integer
          description: Store as the cursor only after the whole response is committed.
        has_more:
          type: boolean
          description: When true, pull again immediately with cursor set to next_cursor.
        reset:
          type: boolean
          description: True when the caller's hub_id or sync_epoch did not match. The caller must wipe its mirror before applying.
        users:
          type: array
          items:
            $ref: "#/components/schemas/PublicUser"
        classrooms:
          type: array
          items:
            $ref: "#/components/schemas/Classroom"
        enrollments:
          type: array
          items:
            $ref: "#/components/schemas/Enrollment"
        topics:
          type: array
          items:
            $ref: "#/components/schemas/Topic"
        private_comments:
          type: array
          description: Only the caller's own threads (learner) or their classes' threads (teacher).
          items:
            $ref: "#/components/schemas/PrivateComment"
        announcements:
          type: array
          items:
            $ref: "#/components/schemas/Announcement"
        comments:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
        materials:
          type: array
          items:
            $ref: "#/components/schemas/Material"
        material_chunks:
          type: array
          items:
            $ref: "#/components/schemas/MaterialChunk"
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/Assignment"
        submissions:
          type: array
          items:
            $ref: "#/components/schemas/Submission"
        quizzes:
          type: array
          description: Metadata only. Question bodies are fetched via /api/quizzes/{id} after the teacher starts the quiz.
          items:
            type: object
            required: [id, classroom_id, title, status, time_limit_minutes]
            properties:
              id:
                type: string
                format: uuid
              classroom_id:
                type: string
                format: uuid
              title:
                type: string
              status:
                type: string
                enum: ["DRAFT", "ACTIVE", "CLOSED"]
              time_limit_minutes:
                type: integer
              started_at:
                type: integer
        quiz_attempts:
          type: array
          items:
            $ref: "#/components/schemas/GradeReceipt"
        deleted:
          type: array
          description: Tombstones from sync_revisions
          items:
            type: object
            required: [entity_table, entity_id]
            properties:
              entity_table:
                type: string
              entity_id:
                type: string
