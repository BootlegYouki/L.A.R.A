# Project-wide Gradle settings.

# Enough heap for the Android build on CI runners; file.encoding keeps resource
# parsing deterministic across platforms (the strings.xml parity check depends on UTF-8).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Run independent sub-projects in parallel.
org.gradle.parallel=true

# Cache task outputs between builds.
org.gradle.caching=true

# AndroidX is mandatory for Compose and Room.
android.useAndroidX=true

# Kotlin code style for the formatter.
kotlin.code.style=official

# Only generate the resource symbols each module actually uses.
android.nonTransitiveRClass=true
