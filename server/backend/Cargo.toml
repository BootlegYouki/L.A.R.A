[package]
name = "lara_hub"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "lara_hub"
path = "src/lib.rs"

[[bin]]
name = "lara-hub"
path = "src/main.rs"

[dependencies]
argon2 = "0.6"
axum = { version = "0.8", features = ["multipart"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.4"
libmdns = "0.10"
local-ip-address = "0.6"
mime = "0.3"
# Lesson text (3.1): Word handouts are ZIPs of XML. Deflate only, pure Rust (no C zlib, no other formats).
quick-xml = "0.42"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx ={ version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs", "io-util"] }
tokio-tungstenite = "0.30"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "fs", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart"] }
tempfile = "3"

# Unoptimized, one argon2 PIN hash takes about 430 ms instead of about 20 ms, which makes every
# auth test slow.
[profile.dev.package.argon2]
opt-level = 3
