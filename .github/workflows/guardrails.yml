name: Invariant Guardrails & Offline Policy

on:
  pull_request:
    branches:
      - staging
      - main
  push:
    branches:
      - staging

jobs:
  offline-invariants:
    name: Offline Invariant & Localization Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Invariant & Guardrail Scanner
        env:
          BASE_REF: ${{ github.base_ref || 'staging' }}
        run: |
          python3 scripts/verify_invariants.py
